# Conditioning ablation — MINIMAL-SCALAR dynamics arm (regime=ip_ne).
# Temporal attention ON (matched to cap_v1_dynamics).  Architecture is
# byte-identical to cap_v1_dynamics (dim 1024, 12 layers, 16 heads, full
# cond_channels) so the param count matches the full arm — at RUNTIME
# CondMaskedTrainer (regime=ip_ne) keeps ONLY plasma_current +
# ne_line_integrated and suppresses every other channel (value 0, missing 1).
#
# Reduced 8000-step budget for turnaround; compared to the other arms at the
# SAME 8000-step budget (full arm uses cap_v1_dynamics/step8000.pt).
model:
  temporal_attention: true
  dim: 1024
  n_layers: 12
  n_heads: 16
  mlp_ratio: 4.0
  dropout: 0.0
  n_frames: 16
  grid: [16, 16]
  bits: 18

n_frames: 16
stride: 8
max_train_shots: null
max_val_shots: 300
max_heldout_shots: 150

batch_size: 32
max_steps: 8000
peak_lr: 3.0e-4
warmup_frac: 0.03
min_lr_frac: 0.1
weight_decay: 0.05
betas: [0.9, 0.95]
grad_clip: 1.0

curriculum: true
num_workers: 6
seed: 0

log_every: 50
val_every: 4000
ckpt_every: 1000
val_windows: 48
eval_windows: 256
watchdog_grace_s: 600.0

ckpt_root: /work/projects/imas_gpu/mast-checkpoints/camdyn
run_name: cond_ip_ne
device: cuda
