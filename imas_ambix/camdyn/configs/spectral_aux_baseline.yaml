# Structure-aware spectral-shape auxiliary loss — BASELINE arm.
# Temporal attention OFF.  This is the per-frame spatial-inpainting arm at
# the scaled capacity, now trained with masked_bit_bce + λ·structure_loss.
# spectral_aux_dynamics.yaml is byte-identical EXCEPT model.temporal_attention
# (true) and run_name — matched on params, capacity, batch, steps, lr, seed,
# n_frames, stride, AND the SAME structure loss + λ, so the comparison isolates
# exactly the value of dynamics under the new objective.
#
# The structure loss (model.structure_spectral_loss) matches the predicted
# bit-probability field's radial power-spectrum SHAPE (unit-power-normalised)
# to the GT field's — pushing the predictive distribution toward GT-like
# spatial structure so even the mean/MAP decode is sharper, without the
# adversarial/hallucination hazard of a GAN term.  λ kept small; masked_bit_bce
# remains the primary likelihood loss (the W1 NLL/top-1 gate is re-measured on
# THIS objective for both arms — it is not comparable to the old cap_v1 bar).
#
# Sizing: param count ≈ 16·dim²·n_layers = 16·1024²·12 ≈ 2.01e8 (~200M).
# n_heads must divide dim (1024 / 16 = 64-dim heads).
model:
  temporal_attention: false   # <-- THE toggle. spectral_aux_dynamics sets this true.
  dim: 1024
  n_layers: 12
  n_heads: 16
  mlp_ratio: 4.0
  dropout: 0.0
  n_frames: 16
  # cond_channels defaults to len(CONDITIONING_CHANNELS) (full actuator vector)
  grid: [16, 16]
  bits: 18
  # spectral-shape auxiliary loss weight (0.0 = pure masked_bit_bce). Both arms
  # share this λ; SWEEP it (0.02 / 0.05 / 0.10) and report the NLL/top-1 trade.
  structure_loss_weight: 0.05

# windowing over the frame-grid token corpus
n_frames: 16
stride: 8
# whole train/val/held-out splits (None = all shots in the split)
max_train_shots: null
max_val_shots: 300
max_heldout_shots: 150

# optimisation — matched token budget across both arms.
# token budget = max_steps · batch_size · n_frames · 256 cells
#              = 20000 · 32 · 16 · 256 ≈ 2.62e9 scored-grid tokens.
batch_size: 32
max_steps: 20000
peak_lr: 3.0e-4
warmup_frac: 0.03
min_lr_frac: 0.1
weight_decay: 0.05
betas: [0.9, 0.95]
grad_clip: 1.0

# masking curriculum (anneal large->full visibility over training)
curriculum: true

# loader (bounded torch DataLoader worker pool — repo §2b). Main process
# holds the model ONCE; workers do CPU data prep (tokens + conditioning +
# mask) with bounded prefetch and persistent workers.
num_workers: 6
seed: 0

# cadence
log_every: 50
val_every: 6000
ckpt_every: 1000
val_windows: 48
eval_windows: 256
watchdog_grace_s: 600.0

# paths
ckpt_root: /work/projects/imas_gpu/mast-checkpoints/camdyn
run_name: spectral_aux_baseline
device: cuda
