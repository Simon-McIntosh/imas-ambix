# Matched temporal arm with causally shuffled fast Dalpha conditioning.
model:
  temporal_attention: true
  dim: 1024
  n_layers: 12
  n_heads: 16
  mlp_ratio: 4.0
  dropout: 0.0
  n_frames: 16
  grid: [16, 16]
  bits: 18

n_frames: 16
stride: 8
max_train_shots: null
max_val_shots: 300
max_heldout_shots: 150

batch_size: 32
max_steps: 20000
peak_lr: 3.0e-4
warmup_frac: 0.03
min_lr_frac: 0.1
weight_decay: 0.05
betas: [0.9, 0.95]
grad_clip: 1.0

curriculum: true
num_workers: 6
seed: 0
conditioning_variant: shuffled

log_every: 50
val_every: 6000
ckpt_every: 1000
val_windows: 48
eval_windows: 256
watchdog_grace_s: 600.0

ckpt_root: /work/projects/imas_gpu/mast-checkpoints/camdyn
run_name: da_burst_shuffled_dynamics
device: cuda
