notes:
- greens-matvec = the FILAMENT / single-interaction-matrix DEV SPINE (primary, GPU target); grid-delstar
  = the gridded delta* solve, retained as a baseline CHECK.
- Perf at OMP=1; per-shot first slice discarded as warmup. solve_wall = the profile solve only; end_to_end/latency
  = disc-seed + basin solve + profile solve.
- Reproduction (axis/lcfs/profile) validates the greens-matvec dev spine against the grid-delta* baseline
  check on the same slice (greens row).
- magnetics_residual_whitened_rms scores the converged equilibrium against the RAW magnetics, which the
  frozen spine never fits (mask OFF), so it is a forward-model check on the machine geometry rather than
  a fit residual; its floor is the static coil / sensor calibration misfit.
- bench_scope = per-slice STATIC solve (the GPU inner-loop target); the dynamics-coupled label rollout
  (diffusion + passive + temporal warm-start) is a distinct mode to add before the corpus GPU run.
- FSA d-roughness = rms(2nd-diff of d_face)/rms(d_face), interior faces. A cell-binned d-roughness is
  expected to worsen with n_rho; on the CONTOUR-INTEGRATED geo.d_face the slope measured here is <=0,
  and no committed diagnostic reproduces the worsening trend.
- Per-component / GPU-device memory is added with the GPU rollout; peak_rss_gb here is process-level.
  Held-out-MSE pitch is tracked separately (heldout_mse_gate_eval).
- 'CAVEAT (corpus extrapolation): per-slice metrics are on the CACHED Green''s matrix (built once per
  shot, warmup-excluded), so a corpus-cost extrapolation from throughput_slices_per_core_s ASSUMES campaign-scope
  Green''s caching. Today the grid+matrices are rebuilt per shot (only ~2 campaign signatures exist),
  adding ~2% at corpus scale until that caching lands.'
