# Option D diagnostic — baseline (untrained OMAG2) on the 100-shot rbb config
# but with rfid_frames_per_shot=32 (= ALL loaded frames, no random sub-sampling)
# to tighten the statistical estimate of the rFID measurement.  Compared
# against v0-rbb-100shot.yaml's 1209100 result (rFID 17.04 with the default
# 8-frame sub-sample) to test whether the bench measurement is dominated by
# stochastic sample selection.
