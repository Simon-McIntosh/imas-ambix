# Re-bench config for plasma-decoder-v1 fine-tuned checkpoint.
# Identical shots to v0-rbb-100shot.yaml; uses plasma-decoder-v1-merged.ckpt
# so the in-process bench loads the fine-tuned decoder instead of imagenet_256_L.
# The merged ckpt path is written by DecoderFinetuneTrainer._save_merged_checkpoint.
