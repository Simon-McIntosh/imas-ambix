id: https://imas-ambix.example/schema/machine-map
name: machine-map
title: Declarative machine channel map
description: >-
  Range-scoped bindings from immutable store arrays to Data Dictionary leaves.
  The schema deliberately has no condition, expression, or code-hook slot.
license: LGPL-3.0-or-later
version: 1.3.0
prefixes:
  linkml: https://w3id.org/linkml/
  mm: https://imas-ambix.example/schema/machine-map/
default_prefix: mm
default_range: string
imports:
  - linkml:types

enums:
  BindingRole:
    permissible_values:
      value:
        description: Source values populate the declared Data Dictionary path.
      identifier:
        description: Source strings identify structures at the declared path.
      dimension-coordinate:
        description: Source indices order a target array and are not emitted as a leaf.
  SignConvention:
    permissible_values:
      identity:
        description: Source-positive and target-positive directions coincide.
      negate:
        description: Target values are the additive inverse of source values.
      not-applicable:
        description: Names and structural indices have no signed direction.
      unknown-unvalidated:
        description: The public declaration has not been checked against pulse data.
  SourceStatus:
    permissible_values:
      corpus-observed:
        description: The source array exists in the pulse store but cannot be bound.
      legacy-only:
        description: The legacy description requires content absent from the pulse store.
  ValidationState:
    permissible_values:
      corpus-validated:
        description: Source paths and metadata were checked against a local corpus.
      source-only:
        description: Schema and public source were checked without pulse data.

slots:
  schema_version:
    required: true
  dd_version:
    required: true
  source:
    required: true
  source_revision:
    required: true
  binding_sets:
    range: BindingSet
    multivalued: true
    inlined_as_list: true
    required: true
  bindings:
    range: ChannelBinding
    multivalued: true
    inlined_as_list: true
    required: true
  maps:
    range: MachineMap
    multivalued: true
    inlined_as_list: true
    required: true
  validation_gaps:
    range: ValidationGap
    multivalued: true
    inlined_as_list: true
  source_qualifications:
    range: SourceQualification
    multivalued: true
    inlined_as_list: true
  drive_topologies:
    range: DriveTopology
    multivalued: true
    inlined_as_list: true
  name:
    identifier: true
    required: true
  machine:
    required: true
  first_shot:
    range: integer
    minimum_value: 0
    required: true
  last_shot:
    range: integer
    minimum_value: 0
    required: true
  transition:
  binding_set:
    required: true
  validation_state:
    range: ValidationState
    required: true
  source_group:
    required: true
  source_array:
    required: true
  source_rank:
    range: integer
    minimum_value: 0
    required: true
  source_role:
    range: BindingRole
    required: true
  source_location:
    required: true
  dd_path:
    required: true
  source_unit:
    required: true
  target_unit:
    required: true
  sign_convention:
    range: SignConvention
    required: true
  evidence:
    required: true
  source_shape:
    range: integer
    multivalued: true
    required: true
  source_status:
    range: SourceStatus
    required: true
  binding:
    required: true
  reason:
    required: true
  circuit_identity_source:
    required: true
  current_scale_source:
    required: true
  current_channel_source:
    required: true
  circuit_identity_qualification:
    required: true
  current_scale_qualification:
    required: true
  current_channel_qualification:
    required: true
  passive_loop_names:
    multivalued: true
    required: true
  structure_assemblies:
    range: StructureAssembly
    multivalued: true
    inlined_as_list: true
  structure_path:
    required: true
  type_path:
    required: true
  type_index:
    range: integer
    required: true
  name_binding:
    required: true
  member_bindings:
    multivalued: true
    required: true

classes:
  BindingSet:
    slots:
      - name
      - bindings
  ChannelBinding:
    slots:
      - name
      - source_group
      - source_array
      - source_rank
      - source_role
      - source_location
      - dd_path
      - source_unit
      - target_unit
      - sign_convention
      - evidence
  MachineMap:
    slots:
      - name
      - machine
      - first_shot
      - last_shot
      - transition
      - binding_set
      - validation_state
  ValidationGap:
    slots:
      - binding
      - reason
  SourceQualification:
    description: >-
      Required machine-description content excluded either because the Data
      Dictionary has no semantically valid writable leaf or because the pulse
      store does not expose the legacy field needed to populate one.
    slots:
      - name
      - source_group
      - source_array
      - source_location
      - source_shape
      - source_status
      - source_unit
      - reason
      - evidence
  DriveTopology:
    description: >-
      Declares how conductor identities, current scales, measured channels and
      passive loop groups combine without embedding a machine-specific rule.
    slots:
      - name
      - source_location
      - circuit_identity_source
      - current_scale_source
      - current_channel_source
      - circuit_identity_qualification
      - current_scale_qualification
      - current_channel_qualification
      - passive_loop_names
      - evidence
  StructureAssembly:
    description: >-
      Assembles source bindings into repeated Data Dictionary structures and
      declares the structure type and name binding without executable code.
    slots:
      - name
      - structure_path
      - type_path
      - type_index
      - name_binding
      - member_bindings
      - evidence
  MachineMapCatalog:
    tree_root: true
    slots:
      - schema_version
      - dd_version
      - source
      - source_revision
      - binding_sets
      - maps
      - validation_gaps
      - source_qualifications
      - drive_topologies
      - structure_assemblies
