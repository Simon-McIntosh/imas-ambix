id: https://imas-ambix.example/schema/machine-map
name: machine-map
title: Declarative machine channel map
description: >-
  Range-scoped bindings from immutable store arrays to Data Dictionary leaves.
  The schema deliberately has no condition, expression, or code-hook slot.
license: LGPL-3.0-or-later
version: 1.9.0
prefixes:
  linkml: https://w3id.org/linkml/
  mm: https://imas-ambix.example/schema/machine-map/
default_prefix: mm
default_range: string
imports:
  - linkml:types

enums:
  BindingRole:
    permissible_values:
      value:
        description: Source values populate the declared Data Dictionary path.
      identifier:
        description: Source strings identify structures at the declared path.
      dimension-coordinate:
        description: Source indices order a target array and are not emitted as a leaf.
  SignConvention:
    permissible_values:
      identity:
        description: Source-positive and target-positive directions coincide.
      negate:
        description: Target values are the additive inverse of source values.
      not-applicable:
        description: Names and structural indices have no signed direction.
      unknown-unvalidated:
        description: The public declaration has not been checked against pulse data.
  SourceStatus:
    permissible_values:
      corpus-observed:
        description: The source array exists in the pulse store but cannot be bound.
      legacy-only:
        description: The legacy description requires content absent from the pulse store.
      range-absent:
        description: A named acquisition source is absent throughout the declared shot range.
  ValidationState:
    permissible_values:
      corpus-validated:
        description: Source paths and metadata were checked against a local corpus.
      source-only:
        description: Schema and public source were checked without pulse data.
  IdentityCaseRule:
    permissible_values:
      case-fold:
        description: Compare identities after Unicode case folding.
  IdentityNumericTokenRule:
    permissible_values:
      integer-value:
        description: Compare every decimal token by integer value, ignoring zero padding.

slots:
  schema_version:
    required: true
  dd_version:
    required: true
  source:
    required: true
  source_revision:
    required: true
  source_cocos:
    description: >-
      Machine-wide source coordinate convention. Zero is the explicit
      undeclared marker when the convention has not been validated against
      source data.
    required: true
    range: integer
    minimum_value: 0
    maximum_value: 18
  source_cocos_override:
    description: >-
      Optional source coordinate convention for a binding that differs from
      the machine-wide declaration.
    range: integer
    minimum_value: 1
    maximum_value: 18
  binding_sets:
    range: BindingSet
    multivalued: true
    inlined_as_list: true
    required: true
  bindings:
    range: ChannelBinding
    multivalued: true
    inlined_as_list: true
    required: true
  maps:
    range: MachineMap
    multivalued: true
    inlined_as_list: true
    required: true
  validation_gaps:
    range: ValidationGap
    multivalued: true
    inlined_as_list: true
  source_qualifications:
    range: SourceQualification
    multivalued: true
    inlined_as_list: true
  sensor_identity_rules:
    range: SensorIdentityRule
    multivalued: true
    inlined_as_list: true
  identity_qualifications:
    range: IdentityQualification
    multivalued: true
    inlined_as_list: true
  circuit_current_joins:
    range: CircuitCurrentJoin
    multivalued: true
    inlined_as_list: true
  drive_topologies:
    range: DriveTopology
    multivalued: true
    inlined_as_list: true
  drive_topology:
  description_supplement:
  name:
    identifier: true
    required: true
  machine:
    required: true
  first_shot:
    range: integer
    minimum_value: 0
    required: true
  last_shot:
    range: integer
    minimum_value: 0
    required: true
  transition:
  binding_set:
    required: true
  validation_state:
    range: ValidationState
    required: true
  source_group:
    required: true
  source_array:
    required: true
  source_rank:
    range: integer
    minimum_value: 0
    required: true
  source_role:
    range: BindingRole
    required: true
  source_location:
    required: true
  dd_path:
    required: true
  source_unit:
    required: true
  target_unit:
    required: true
  sign_convention:
    range: SignConvention
    required: true
  evidence:
    required: true
  source_shape:
    range: integer
    multivalued: true
    required: true
  source_status:
    range: SourceStatus
    required: true
  range_first_shot:
    range: integer
    minimum_value: 0
  range_last_shot:
    range: integer
    minimum_value: 0
  source_representation_signature:
    description: >-
      Frozen upstream geometry identity for a range whose source representation
      may contain more conductor rows than its materialised geometry table.
  binding:
    required: true
  reason:
    required: true
  circuit_identity_source:
    required: true
  current_scale_source:
    required: true
  current_channel_source:
    required: true
  current_channel_declaration:
    required: true
  circuit_identifier_path:
    required: true
  supply_identifier_path:
    required: true
  element_identifier_path:
    required: true
  turns_path:
    required: true
  connections_path:
    required: true
  connections:
    range: CircuitConnection
    multivalued: true
    inlined_as_list: true
    required: true
  circuit_identifier:
    required: true
  current_channel:
    required: true
  conductor_identifier:
    required: true
  supply_identifier:
    required: true
  element_identifier:
    required: true
  geometry_element_identifier:
    required: true
  turns:
    range: float
    minimum_value: 0
    required: true
  current_weight:
    range: float
    minimum_value: 0
    required: true
  direction:
    range: integer
    minimum_value: -1
    maximum_value: 1
    required: true
  passive_loop_names:
    multivalued: true
    required: true
  structure_assemblies:
    range: StructureAssembly
    multivalued: true
    inlined_as_list: true
  structure_path:
    required: true
  type_path:
    required: true
  type_index:
    range: integer
    required: true
  name_binding:
    required: true
  member_bindings:
    multivalued: true
    required: true
  element_identifiers:
    multivalued: true
  acquisition_declarations:
    range: AcquisitionDeclaration
    multivalued: true
    inlined_as_list: true
  sensor_identity_key:
    description: >-
      Non-geometric key that distinguishes acquisition channels even when
      their spatial descriptions are identical.
    required: true
  sensor_identity_rule:
    description: >-
      Named reusable rule that canonicalises identities before comparison.
    required: true
  case_rule:
    range: IdentityCaseRule
    required: true
  numeric_token_rule:
    range: IdentityNumericTokenRule
    required: true
  malformed_identity:
    required: true
  canonical_identity:
    required: true
  description_supplements:
    range: DescriptionSupplement
    multivalued: true
    inlined_as_list: true
  current_channels:
    multivalued: true
    required: true
  sensor_addresses:
    multivalued: true
    required: true
  unmatched_sensor_addresses:
    multivalued: true
  acquisition_declaration:
    required: true
  point_flux_loops:
    range: PointFluxLoopDeclaration
    multivalued: true
    inlined_as_list: true
  r:
    range: float
    required: true
  z:
    range: float
    required: true
  r_path:
    required: true
  z_path:
    required: true
  reference_radius:
    range: float
    minimum_value: 0
    required: true
  reference_radius_path:
    required: true
  reference_radius_unit:
    required: true
  minor_radius_qualification:
    required: true
  polygon_sections:
    range: PolygonSectionDeclaration
    multivalued: true
    inlined_as_list: true
  vertex_r:
    range: float
    multivalued: true
    required: true
  vertex_z:
    range: float
    multivalued: true
    required: true
  current_scale:
    range: float
    required: true

classes:
  BindingSet:
    slots:
      - name
      - bindings
  ChannelBinding:
    slots:
      - name
      - source_group
      - source_array
      - source_rank
      - source_role
      - source_location
      - dd_path
      - source_unit
      - target_unit
      - sign_convention
      - evidence
      - source_cocos_override
  MachineMap:
    slots:
      - name
      - machine
      - first_shot
      - last_shot
      - transition
      - binding_set
      - drive_topology
      - description_supplement
      - validation_state
      - source_representation_signature
  ValidationGap:
    slots:
      - binding
      - reason
  SourceQualification:
    description: >-
      Required machine-description content excluded either because the Data
      Dictionary has no semantically valid writable leaf or because the pulse
      store does not expose the field needed to populate one with authoritative
      source provenance.
    slots:
      - name
      - source_group
      - source_array
      - source_location
      - source_shape
      - source_status
      - source_unit
      - reason
      - evidence
      - range_first_shot
      - range_last_shot
  SensorIdentityRule:
    description: >-
      Canonicalises acquisition identities without enumerating aliases. Case
      and decimal-token rules apply uniformly to every sensor address.
    slots:
      - name
      - case_rule
      - numeric_token_rule
      - evidence
  IdentityQualification:
    description: >-
      Records one malformed upstream spelling and the canonical acquisition
      identity reached through a declared reusable rule.
    slots:
      - name
      - source_location
      - malformed_identity
      - canonical_identity
      - sensor_identity_rule
      - reason
      - evidence
  DriveTopology:
    description: >-
      Declares the sparse non-zero form of a circuit connections matrix: which
      named supply drives each named conductor element, in which direction,
      with which positive turn magnitude, and with what share of the measured
      supply current. Measured channels and passive loop groups remain
      declarative without embedding a machine-specific rule.
    slots:
      - name
      - source_location
      - circuit_identity_source
      - current_scale_source
      - current_channel_source
      - current_channel_declaration
      - circuit_identifier_path
      - supply_identifier_path
      - element_identifier_path
      - turns_path
      - connections_path
      - connections
      - passive_loop_names
      - evidence
  CircuitConnection:
    description: >-
      One non-zero supply-to-element connectivity entry in a named circuit.
      Turn magnitude and the share of supply current carried by the element
      are separately positive; current direction is carried only by direction.
    slots:
      - circuit_identifier
      - supply_identifier
      - element_identifier
      - geometry_element_identifier
      - turns
      - current_weight
      - direction
  CircuitCurrentJoin:
    description: >-
      Joins one stable circuit identity to the measured current channel and
      conductor identity that supply it. The declaration is shared by every
      shot-selected topology that contains the circuit.
    slots:
      - circuit_identifier
      - current_channel
      - conductor_identifier
      - evidence
  StructureAssembly:
    description: >-
      Assembles source bindings into repeated Data Dictionary structures and
      declares the structure type and name binding without executable code.
    slots:
      - name
      - structure_path
      - type_path
      - type_index
      - name_binding
      - member_bindings
      - element_identifiers
      - evidence
  AcquisitionDeclaration:
    description: >-
      Declares acquisition identities required by machine-description consumers
      without embedding channel selection in reader code. Sensor identity is
      explicit and does not depend on projected coordinates.
    slots:
      - name
      - source_location
      - sensor_identity_key
      - sensor_identity_rule
      - current_channels
      - sensor_addresses
      - unmatched_sensor_addresses
      - evidence
  PointFluxLoopDeclaration:
    description: >-
      Declares one static point-loop position absent from pulse-store arrays at
      writable scalar leaves of a typed magnetics flux-loop structure. An
      acquisition address may join that declared position to a measured signal
      when the upstream nominal-geometry identity is absent.
    slots:
      - name
      - acquisition_address
      - r
      - z
      - r_path
      - z_path
      - type_path
      - type_index
      - evidence
  PolygonSectionDeclaration:
    description: >-
      Declares a shaped conductor section and its joins to circuit connectivity
      and emitted conductor geometry.
    slots:
      - name
      - circuit_identifier
      - geometry_element_identifier
      - vertex_r
      - vertex_z
      - current_scale
      - evidence
  DescriptionSupplement:
    description: >-
      Static machine-description values selected by the same shot range as the
      executable bindings and drive topology.
    slots:
      - name
      - source_location
      - acquisition_declaration
      - point_flux_loops
      - reference_radius
      - reference_radius_path
      - reference_radius_unit
      - minor_radius_qualification
      - polygon_sections
      - evidence
  MachineMapCatalog:
    tree_root: true
    slots:
      - schema_version
      - dd_version
      - source
      - source_revision
      - source_cocos
      - binding_sets
      - maps
      - validation_gaps
      - source_qualifications
      - sensor_identity_rules
      - identity_qualifications
      - circuit_current_joins
      - drive_topologies
      - structure_assemblies
      - acquisition_declarations
      - description_supplements
