# GLM-5.3 — 4×H200 INT4 AWQ variant — STUB
#
# WARNING: GLM-5.3 weights are NOT YET OPEN (announced Aug 14, API-only;
# open-weight release expected ~Aug 28 pending safety review).
#
# This profile is pre-configured for when the weights drop — same architecture
# as GLM-5.2 (glm_moe_dsa, ~744B total / ~40B active), so every setting is
# identical to glm-5-2-4x except the HuggingFace repo.
#
# The 4×H200 INT4 AWQ path will follow the community requant pipeline once the
# official FP8 weights land.  Activation steps:
#   1. Wait for a community INT4/AWQ variant of GLM-5.3 (check HF ~2-3 days
#      after official release)
#   2. Update hf_repo below with the correct INT4 repo
#   3. ``imas-ambix agent download glm-5-3-4x``
#   4. ``imas-ambix agent serve glm-5-3-4x``
#
# Architecture: ~744B total / ~40B active per token MoE, native thinking mode.
# License: TBC.

[model]
name = "GLM-5.3 (4×H200 INT4)"
hf_repo = "community/GLM-5.3-AWQ-INT4"  # FIXME: replace with actual repo
served_name = "glm-5.3-int4"
size_gb = 440
max_context = 1048576

[engine]
type = "vllm"
tensor_parallel = 4
trust_remote_code = true
enable_auto_tool_choice = true
mem_fraction_static = 0.90
max_total_tokens = 131072
kv_cache_dtype = "fp8_e4m3"
max_num_seqs = 512
max_num_batched_tokens = 32768

[engine.parsers]
tool_call = "glm47"
reasoning = "glm45"

[slurm]
gpus = 4
cpus = 12
memory = "320G"
time_serve = "7-00:00:00"
time_download = "24:00:00"
