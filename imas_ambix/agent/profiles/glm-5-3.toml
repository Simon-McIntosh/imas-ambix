# GLM-5.3 — Z.ai (Zhipu AI) ~744B MoE frontier coding/agentic model
#
# Architecture: fine-grained MoE, 78 layers, 64 attention heads, 256 routed
#   experts with 8 active per token, MLA attention with kv_lora_rank 512 and
#   qk_rope_head_dim 64, native 1,048,576-token context.
#
# Identical to GLM-5.2 in every architectural field. The two differ only in
# `moe_router_dtype` (float32 here, absent there) and the transformers version
# they were saved with, so the engine that serves one serves the other and the
# GLM-5.2 deployment findings carry over unchanged.
#
# Release shape, checked against the published artifacts rather than assumed:
#   * zai-org/GLM-5.3 is ALREADY FP8 (e4m3, 128x128 blocks). There is no
#     `-FP8` repo, unlike GLM-5.2 -- a profile naming one downloads nothing.
#   * zai-org/GLM-5.3-Flash is a DIFFERENT architecture
#     (Glm5NextForConditionalGeneration, multimodal, 45 layers) that no
#     released vLLM registers. Support is in flight upstream but unmerged and
#     conflicted, so Flash cannot be served here yet at any card count.
#   * The FP8 release is 703.7 GiB, which needs eight cards. The four-card
#     deployment therefore uses a compressed-tensors W4A8 release of the SAME
#     architecture, which the serving engine registers.
#
# Weights: camel-ai/GLM-5.3-W4A8, 154 files and 399754189403 bytes. Verified
#   against the serving vLLM 0.28.0: GlmMoeDsaForCausalLM is registered and
#   both compressed-tensors W4A8 loader classes import from that environment.
#   The checkpoint ships tokenizer.json and tokenizer_config.json itself.

[model]
name = "GLM-5.3"
hf_repo = "camel-ai/GLM-5.3-W4A8"
# The two card counts need different checkpoints, so each keeps its own
# directory; the eight-card variant redirects to the official FP8 download.
weights_slug = "glm-5-3-w4a8"
served_name = "glm-5.3"
checkpoint_precision = "w4a8"
size_gb = 400
max_context = 1048576

[engine]
type = "vllm"
tensor_parallel = 4
trust_remote_code = true
enable_auto_tool_choice = true
mem_fraction_static = 0.94

# Context sized from the measured cost of this architecture rather than from
# the model's native window. The MLA cache holds a compressed latent of
# kv_lora_rank + qk_rope_head_dim = 576 elements per token per layer, which at
# bfloat16 over 78 layers measures ~91.7 KiB/token, and that latent is
# REPLICATED on every rank rather than sharded -- so more cards buy room only
# by shrinking weights-per-card.
#
# At four cards and 0.94 memory fraction, 98304 tokens served successfully:
# the engine reported a 13.92 GiB pool, 161280 cached tokens and 1.64x
# concurrency, and a real streaming decode returned coherent correct text.
# Raising the context from 65536 reduces concurrency from 2.45x to 1.64x.
# 131072 failed KV initialisation, needing 11.31 GiB against 10.42 GiB
# available. The engine estimated its ceiling at 120768, so 98304 is the
# largest proven point rather than the estimated maximum.
max_total_tokens = 98304

# The sparse attention has no FP8 KV kernel in vLLM, and "fp8" resolves to the
# fp8_e4m3 those backends reject, so an FP8 entry cannot start at all.
kv_cache_dtype = "bfloat16"

# 64 sequences. CUDA-graph capture scales with this cap and its memory comes
# out of the KV pool; 64 sits above any concurrency measured here.
max_num_seqs = 64
max_num_batched_tokens = 32768

# Speculative decoding is left off pending measurement. This checkpoint does
# quantize an MTP head, unlike the GLM-5.2 INT4 build, but vLLM could not
# construct an MTP draft against a compressed-tensors MoE there, and the same
# loader path applies here. Measured on GLM-5.2 at eight cards, drafting also
# cost single-stream throughput at low concurrency, so it is a measurement
# rather than a default.

[engine.parsers]
tool_call = "glm47"
reasoning = "glm45"

[slurm]
gpus = 4
cpus = 12
memory = "320G"
time_serve = "0"
time_download = "24:00:00"

# ─── Eight-card deployment (FP8, the vendor release) ─────────────────────
# Selected by `serve glm-5-3 --gpus 8`. Uses the official checkpoint at full
# precision; 703.7 GiB over eight cards is ~88 GiB/card, the same budget the
# GLM-5.2 FP8 deployment ran at.
[gpu_variants.8.model]
hf_repo = "zai-org/GLM-5.3"
weights_slug = "glm-5-3"
tokenizer_source_slug = ""
checkpoint_precision = "fp8"
size_gb = 704

[gpu_variants.8.engine]
tensor_parallel = 8
mem_fraction_static = 0.92
max_total_tokens = 204800
max_num_seqs = 256

[gpu_variants.8.slurm]
gpus = 8
cpus = 16
memory = "640G"
