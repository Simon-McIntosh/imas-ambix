# DeepSeek-V4.1-Flash — 552B backbone MoE, 8B/16B activated, 1M context
#
# A different architecture from V4-Flash, not a point release of it, so none of
# the V4-Flash deployment findings carry over:
#   * Causal Encoder-Decoder — 40 layers as a 20-layer causal encoder feeding a
#     20-layer decoder, where V4-Flash is decoder-only.
#   * CSA2 attention (Full / Reindex / Reuse modes), 64 query heads, 1 KV head.
#   * 1 shared + 384 routed experts per MoE layer, 6 routed active per token;
#     8B activated during prefill, 16B during decode.
#   * Native multimodal — a DeepSeek-ViT tower feeds the same backbone through
#     a two-layer MLP projector, rather than the bolt-on vision pack V4 used.
#
# Weights: 48 shards, 510.3 GB, MIT. Verified against the published blob sizes
# rather than the index metadata, which disagrees with them:
#   routed + DSpark experts (MXFP4)         259.5 GiB
#   Engram tables (FP8)                     183.1 GiB
#   attention, dense projections, routers      6.9 GiB
#   embedding + LM head (BF16), norms (FP32)   3.9 GiB
#   UE8M0 block scales                        21.9 GiB
#                                     total  475.3 GiB
#
# The Engram tables are the whole memory story and have nothing to do with the
# MoE: layers 1 and 14 each own a hash table of ~384M rows x 256 dims, 196.6B
# parameters between them. They are why a model activating 8-16B parameters per
# token still needs half a terabyte resident, and why the host-table setting
# below is load-bearing rather than a tuning knob.
#
# Memory budget on 4xH200 (140.4 GiB each, 561.6 GiB total):
#   Engram tables resident:  475.3 GiB weights -> 86 GiB spare. Fits, but the
#                            margin is thin once CUDA graphs and the ViT land.
#   Engram tables on host:   292.2 GiB weights -> 269 GiB spare, and ~46 GiB
#                            per card handed back to the KV pool.
#   KV is a rounding error either way — the compressed latents are stored in
#   FP4 at 890 bytes/token, so the full 1M window costs ~0.89 GB.
#
# Measured on the first four-card serve, per rank:
#   load weight begin        avail 138.72 GiB
#   load weight end          avail  65.99 GiB   (weights 72.73 GiB/card)
#   memory pool end          avail  49.05 GiB   (KV pool 16.94 GiB/card)
#   decode CUDA graph end    avail  45.13 GiB   (graphs 1.33 GiB)
# Four cards at 72.73 GiB is 290.9 GiB of weights against the 292.2 GiB the
# host-table arithmetic predicts, so the offload does what it claims. The
# Engram tables land as 2 layers x 4 ranks x ~24 GiB of pinned host memory,
# 100% huge-page backed.
#
# Startup is dominated by reading the checkpoint off GPFS: load_weight 458.9 s,
# kv_cache_allocation 6.6 s, decode graph capture 47.9 s, scheduler end-to-end
# 670.1 s. Roughly eleven minutes from submit to first token; size any health
# check's patience accordingly.
#
# Throughput not yet characterised here. The DeepSeek beta reported 300-507
# tok/s output; that is the vendor's number on their own stack, not a
# prediction for this deployment.
#
# License: MIT (fully permissive)

[model]
name = "DeepSeek-V4.1-Flash"
hf_repo = "deepseek-ai/DeepSeek-V4.1-Flash"
# Its own directory rather than sharing with V4-Flash: a different architecture
# and a different shard count, so a shared directory would leave one release's
# shards beside the other's index with no way to tell afterwards which
# checkpoint a run actually loaded.
weights_slug = "deepseek-v4-1-flash"
served_name = "deepseek-v4.1-flash"
checkpoint_precision = "mxfp4+fp8"
size_gb = 510
max_context = 1048576

[engine]
type = "sglang"
# TP4 is the shape the vendor recipes exercise (GB300 and B200 at --tp 4
# --ep-size 4; NVIDIA Dynamo at TP4/EP4 per worker). The published H200 recipe
# is TP8/EP8, so TP4 ON H200 is this deployment's own composition of a
# supported topology with the memory arithmetic above — the first thing to
# verify at launch, not an inherited guarantee.
#
# TP4 also divides cleanly: 64 query heads / 4 = 16 per card. This is why a
# six-card deployment is not expressible at all — 64 does not divide by 6 —
# and why adding cards beyond four has to come through expert or data
# parallelism rather than by widening TP.
tensor_parallel = 4
ep_size = 4
# The cookbook ships 0.8 for every verified layout, which left 45.13 GiB per
# card idle on the first run here: sglang sized a 112.3 GiB budget and used
# only 95.3 GiB, because the KV pool was capped well below what the budget
# allowed. Raised to spend the reserved cards rather than hold them back. The
# remaining 5% (~7 GiB/card) stays outside the budget for the CUDA context,
# NCCL buffers and fragmentation, which are not drawn from it.
mem_fraction_static = 0.95
# This architecture's own attention kernel; "flashinfer" (the schema default,
# and what V4-Flash uses) does not implement CSA2.
attention_backend = "dsv4"
# MXFP4 routed experts run on Hopper through FlashInfer's MXFP4 path, so the
# experts stay at their shipped precision on these SM90 cards — no FP8
# up-conversion pass and no second checkpoint.
moe_runner_backend = "flashinfer_mxfp4"
# Vendor-documented Hopper prefill win: decoder-side bounded replay measured
# 1.56x prefill throughput on 8xH200.
enable_decoder_swa_bounded_replay = true
cuda_graph_max_bs_decode = 64
# The shared KV pool -- NOT the per-request context window, which stays at the
# model's native 1,048,576 and cannot usefully go past it without RoPE
# rescaling. This is how many tokens the engine holds across all concurrent
# requests at once, and leaving the two equal is the trap: one full-context
# request would consume the whole pool, so agentic sessions at 100-300k would
# fit only a handful.
#
# PINNED, and engine auto-sizing is the thing that must not be used here.
# Handing the sizing to the allocator at this memory fraction died with
# torch.OutOfMemoryError during scheduler init, at 139.57 GiB in use of a
# 139.80 GiB card: it sizes the pool to fill the mem_fraction_static budget,
# which leaves only the 5% outside that budget to cover CUDA graph capture,
# activations and non-PyTorch allocations, and that is not enough. Auto-sizing
# and a high static fraction are alternatives, not companions.
#
# Pool sizing is an empirical bracket, not a formula. Measured, per card:
#   21.51 GiB /  3,485,952 tokens -- serves, 40.61 GiB left free
#   46.64 GiB / 20,000,000 tokens -- SERVES, 14.64 GiB left free (this line)
#  ~60.7  GiB / auto-sized        -- OOM at scheduler init, 6.4 GiB left
# Between the two serving points the cost is ~16.2 GiB fixed plus ~1.6
# KiB/token, so the pool is cheap per token and the fixed base dominates. Do
# not extrapolate past 20M from that: the OOM sits only ~14 GiB above this
# line, and every estimate made here from fewer than two measured points has
# been wrong -- once understating the pool fivefold, once overstating the
# claimable headroom into an OOM. 14.64 GiB of margin is a bit over double the
# 6.4 GiB that failed; treat that as the safety budget, not as spare capacity.
# Known-good fallback if a future engine build shifts the numbers: 3485952.
max_total_tokens = 20000000
trust_remote_code = true

# "auto" resolves to this architecture's own parsers rather than a generic
# fallback: the engine reports reasoning_parser "deepseek-v41" and
# tool_call_parser "deepseekv41" at startup. Naming them explicitly would pin a
# spelling that belongs to the engine build, not to the checkpoint.
[engine.parsers]
tool_call = "auto"
reasoning = "auto"

# Startup logs "No HuggingFace chat template found" and falls back to the
# 'string' content format. That line is COSMETIC for this model family and
# there is nothing to fix: the checkpoint deliberately ships no chat_template,
# carrying an encoding/ module instead, and chat is formatted by the engine's
# own vendored encoder (srt/entrypoints/openai/encoding_dsv41.py).
#
# Supplying a chat template here would not silence it and would not change
# behaviour -- it would simply be ignored. resolve_chat_encoding_spec()
# dispatches on model_type == "deepseek_v41" BEFORE it ever inspects
# tokenizer.chat_template; only the DeepseekV3 branch below it is conditional
# on a template being absent. The warning is emitted by the template layer
# this model does not use.
#
# Verified by behaviour, not just by reading: a tool-calling round trip
# returns finish_reason "tool_calls" with a correctly named function and valid
# JSON arguments, and a follow-up carrying the tool result is consumed
# correctly. Naive string concatenation could not produce either.

[engine.env]
# Move the 183.1 GiB of Engram tables into one shared host-resident copy.
# This is the setting that makes four cards comfortable rather than tight, and
# it is close to free:
#   * output is bitwise unchanged — the same FP8 values, gathered from host
#     memory instead of HBM, so there is no quality question to evaluate;
#   * it costs ~0.4-1.0% output throughput in the shared/local layout (the
#     larger -1.4% to -7.7% figures belong to the Store-backed variant, which
#     needs Mooncake and is not used here);
#   * it removes the per-lookup all-reduce that row-sharding the tables across
#     the TP group otherwise costs.
# The price is ~200 GB of host RAM, which the [slurm] request below carries,
# and a longer load. Huge-page backing keeps the gather cheap; without it the
# ~1% figure will not reproduce.
SGLANG_ENABLE_DSV41_ENGRAM_HOST_TABLE = "1"

# Serving runs from the vendor preview container, not from the sglang engine
# venv. V4.1 support merged to sglang main on 2026-09-14 (PR #38798) and is not
# in any released wheel, so the 0.5.11 in the shared engine environment cannot
# register this architecture at all. The image is the route the cookbook
# documents, and pinning the digest keeps a re-pull from silently moving the
# serving stack under a deployment that was measured against one build.
[engine.container]
image = "lmsysorg/sglang:dev-dsv41"
sif_path = "/work/projects/imas_gpu/containers/sglang-dev-dsv41.sif"

[slurm]
gpus = 4
# Matches the V4-Flash four-card serve. Cores do not scale with cards — one API
# server, one engine core, one worker per rank, every worker mostly blocked on
# the device — and the node carries two overlapping 30-core reservations, so a
# request scaled off the card count strands co-running jobs on cores while the
# cards they want sit idle.
cpus = 12
# Sized for the host-resident Engram tables: ~200 GB of tables plus the engine's
# own working set and the shard-loading page cache. Above the 300G the V4-Flash
# serve runs at, and deliberately well under the 650 GB group ceiling so a
# co-running job can still be admitted. Never request the node's RealMemory —
# that reads as "no limit" and reserves everything.
memory = "420G"
# 18800-18809 are taken by the other profiles and by the router at 18802.
port = 18810
time_serve = "0"
time_download = "24:00:00"
