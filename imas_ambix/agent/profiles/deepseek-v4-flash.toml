# DeepSeek V4-Flash — 284B MoE, 13B activated, 1M context
#
# Architecture: 256 routed + 1 shared expert, 6 selected/token, 13B activated
# 43 layers + 1 MTP, CSA+HCA hybrid attention (1 KV head, head_dim 512)
# Weights: FP4 (experts) + FP8 (others) mixed precision — ~164 GB on disk
#
# Memory budget on 4×H200 (140.4 GB each):
#   GPU: ~41 GB/card weights, leaves ~100 GB/card for KV cache
#   KV: ultra-compact — 1 KV head × 512 dim × CSA/HCA compression
#        → millions of tokens capacity at FP8 KV
#   Weights need no CPU offloading — the model fits on GPU. The KV cache is a
#   different matter; see kv_offloading_size below.
#
# Throughput (measured 2026-06-04):
#   TP=2 (2×H200): ~100 tok/s single-request decode, ~114 tok/s 8-way concurrent
#   TP=4 (4×H200): target 500–800 tok/s (4× wider NCCL allreduce)
#   → 400 tok/s target requires TP=4; use deepseek-v4-flash-2x only when
#     the other 2 GPUs are needed for a concurrent job.
#
# Thinking mode API (vLLM chat_template_kwargs — all client-side per request):
#   Non-think (default):  no chat_template_kwargs required
#   Think:                {"thinking": true}              — <think>…</think> populated in
#                                                            response.choices[0].message.reasoning
#   Think Max:            {"thinking": true,              — REASONING_EFFORT_MAX system prefix
#                          "reasoning_effort": "max"}        injected; model elaborates deeply
#   Think High:           {"thinking": true,              — slightly less verbose than max
#                          "reasoning_effort": "high"}
#   Think + tools:        {"thinking": true} + tools=[…]  — reasoning AND tool_calls both present
#
# License: MIT (fully permissive)
# Arena rank: #55 (thinking), #61 (standard)

[model]
name = "DeepSeek-V4-Flash"
hf_repo = "deepseek-ai/DeepSeek-V4-Flash-0731"
# Separate weights directory: the current release ships a different shard count
# from the one before it, so sharing a directory would leave the superseded
# shards sitting beside the new index, wasting the space and making it
# impossible to tell afterwards which checkpoint a run actually loaded.
weights_slug = "deepseek-v4-flash-0731"
served_name = "deepseek-v4-flash"
checkpoint_precision = "fp4+fp8"
size_gb = 164
max_context = 1048576

[engine]
type = "vllm"
tensor_parallel = 4
trust_remote_code = true
enable_auto_tool_choice = true
# Full native context window (1M) for the four-card base.
#
# It does NOT match the two-card variant, despite what this comment said until
# 2026-09-15. Weights shard across tensor parallelism, so TP2 puts roughly 82 GB
# per card of weights against TP4's 41 and leaves far less room for KV: measured
# at this fraction, 22.32 GiB of KV on two cards against 60.22 on four. A single
# 1048576-token request needs 31.49 GiB, so the two-card variant REFUSES TO
# START at this window and reports an estimated maximum length of 53,124 tokens.
# Any sizing that assumes the pool is card-count-independent is wrong.
max_total_tokens = 1048576
# Above the 0.90 default so the full 1M window gets its pool.
# Measured on four cards: 70.01 GiB of KV per card, 2557835 tokens total,
# which vLLM reports as 2.44x maximum concurrency at a full 1048576-token
# request. That figure is informational rather than an admission ceiling —
# paged KV means a request consumes the blocks it actually fills, and agent
# traffic asks for a fraction of the window.
#
# Lowered from 0.92 because the pool was never the constraint and the margin
# outside it was. At 0.92 the serve carried 128 concurrent requests cleanly at
# 1451 tok/s and died at 256: CUDA out of memory asking 1.51 GiB with 1.19 GiB
# free, 141 requests running, and KV occupancy at 7.3%. So roughly 65 GiB per
# card of pool sat idle while the engine ran out of room for the fused-MoE
# workspace, which is allocated lazily at generation, scales with concurrency,
# and lives OUTSIDE this fraction — free memory after startup is not the
# margin, it is the margin before the largest allocation the serve will make.
#
# Held at 0.85. A raise to 0.92 was drafted on 2026-09-15 and withdrawn before
# it ran, for the same reason the scheduler-budget change was withdrawn: one
# restart is available and a worse outcome must have as few candidate
# explanations as possible.
#
# The case for raising it was that a larger pool keeps a session's prefix
# resident across its own turn gap. The case against is that kv_offloading_size
# below already does that, by giving an evicted block somewhere to go instead of
# being recomputed -- so the device pool buys much less residency alongside the
# offload than it would alone, while carrying the full crash risk measured here:
# at 0.92 this serve died at 256 concurrent, CUDA out of memory asking 1.51 GiB
# with 1.19 GiB free, because the fused-MoE workspace allocates lazily at
# generation and lives outside this fraction.
#
# A peer additionally observed a 17% cumulative hit rate at 0.92 against 28.2% at
# 0.85 and argued the larger pool was worse. That comparison is inconclusive
# rather than decisive -- both are cumulative counters over different eras, fleet
# sizes and workloads, and this serve's recent delta rate (21-23%) runs BELOW its
# own cumulative (28.6%). It is recorded because it is the honest state of the
# evidence: uncertain benefit against a measured risk.
#
# What does NOT support keeping 0.85 is occupancy. `kv_cache_usage_perc` is
# 1 - free_blocks/total, and vLLM keeps cached-but-unreferenced blocks in the
# FREE queue as eviction candidates (block_pool.py:44, 146, 711). So a pool at
# 50% "usage" may be entirely full of reusable cache about to be destroyed:
# occupancy is not cache residency, and no vLLM metric reports the latter.
mem_fraction_static = 0.85
kv_cache_dtype = "fp8"
# Upstream recipe flags for this checkpoint family (recipes.vllm.ai + the
# DSpark model card). block_size and tokenizer_mode are the vendor-documented
# values for DeepSeek-V4; moe_backend "auto" lets vLLM pick the routed-expert
# kernel, and expert parallelism is required alongside tensor parallelism for
# this model's routed-expert layout.
# Declared 256, but the engine reports block_size=4 with
# _block_size_resolved=true and user_specified_block_size=true, so something
# resolves it down for this checkpoint's hybrid attention. Left as declared
# because smaller blocks give FINER prefix matching and so cannot be the cause
# of a low hit rate -- but the divergence is unexplained, and a declared value
# that is not in effect is worth resolving before tuning further around it.
block_size = 256
tokenizer_mode = "deepseek_v4"
moe_backend = "auto"
enable_expert_parallel = true
# DSpark is not a separate model -- the DeepSeek model card describes it as
# "the same checkpoint with an additional speculative decoding module
# attached", and our downloaded weights already carry the dspark_* config
# block, so no draft checkpoint needs downloading or naming here.
# num_speculative_tokens: the checkpoint declares dspark_block_size = 5;
# start there per the recipe's own guidance rather than copying the SM120
# example's 7. draft_sample_method "greedy" fits tool-calling and structured
# output, where draft acceptance matters more than sample diversity, over the
# SM120 recipe's "probabilistic". attention_config.use_fp4_indexer_cache is
# Blackwell-oriented and left unset on these SM90 cards pending a measured win.
speculative_method = "dspark"
speculative_num_tokens = 5
speculative_draft_sample_method = "greedy"
# Scheduler caps — raise both to exploit the 4×H200 KV cache budget.
# At the default ``max_num_seqs=256`` only ~12% of KV cache is in use
# (live measurement 2026-05-17), so the scheduler is the throughput
# bottleneck, not hardware. Targeting ~80% KV utilization:
#   * max_num_seqs = 1024 → 4× the running-sequences ceiling
#   * max_num_batched_tokens = 32768 → matches the chunked prefill
#     budget so the scheduler isn't starved when many long prompts
#     queue up at the same time
max_num_seqs = 1024
# Held at 32768, after a lowering to 8192 was drafted and withdrawn unmeasured.
#
# This is the token budget for ONE scheduler iteration, shared between prefill
# and decode: a decoding sequence contributes about one token per step (about
# five under DSpark drafting), while a prefilling request claims a chunk of
# whatever remains. Decode rate is running_sequences / step_latency, so a budget
# stuffed with prefill lengthens every step and each sequence emits its token
# less often. That is the mechanism behind 9.3 tok/s per worker.
#
# Lowering it therefore looks attractive and was drafted at 8192. It was
# withdrawn because the 119:1 prefill-to-generation ratio is caused by VOLUME --
# 18,863 tok/s of recomputation that should not exist -- rather than by
# scheduler policy, and kv_offloading_size below removes that volume at its
# source in the same restart. The two changes work against each other: once the
# recomputation is gone, a smaller budget would process the remaining real
# prefill LESS efficiently, since larger batches use the device better.
#
# It is also the only one of the three levers with no measurement behind it on
# this workload; 8192 was a conventional four-fold reduction, not a finding. With
# one restart available, a worse outcome must have as few candidate explanations
# as possible. If the hit rate recovers and per-worker throughput is still poor,
# this is the next lever and it will then have a clean before and after.
max_num_batched_tokens = 32768
# Host-RAM buffer for evicted prefix blocks, GiB summed across tensor ranks.
#
# THIS IS THE CAUSE. Without it an evicted prefix is recomputed from scratch,
# and on a shared agent lane that is self-sustaining: the recomputation is
# itself what evicts the next session's prefix. The arithmetic, measured on
# this serve:
#
#   pool 2,200,283 tokens / 22,557 tok/s prefill = 98 s to turn over completely
#   a 500-token reply at 9.3 tok/s               = 54 s, plus tool and think time
#
# So a session's cached prefix is evicted on the same timescale as its own turn
# gap, and the hit rate sits at 21-25% where multi-turn agent traffic should
# reach 90% -- turn N+1's prompt is turn N's plus the exchange. It also explains
# why draining the fleet from 36 requests to 20 barely moved it: turnover is set
# by the prefill rate, not the worker count.
#
# 128 GiB holds roughly 4.7M tokens at the measured 28.7 KiB/token. Combined with
# the 0.92 GPU pool (~2.56M) that is ~7.2M tokens of cache, turning over in about
# 320 s against the 98 s measured at 0.85 without it -- past the turn gap rather
# than inside it, which is the whole point. Restoring a block over PCIe costs far
# less than a forward pass through 284B parameters.
#
# Sized against the job's 400G host allocation, leaving ~260G. Untested at this
# scale here: judge it on the PREFIX HIT RATE, not on throughput. If hits move
# from ~21% toward 90% the mechanism was right and throughput follows; if they do
# not, the mechanism is wrong and the answer is not in the throughput number.
kv_offloading_size = 128

[engine.env]
# Route top-k/top-p sampling around the FlashInfer TopKMaskLogits kernel, which
# fails at startup warmup on this H200 + vLLM 0.23.0 build with
# "invalid resource handle" (job 1222917, 2026-06-26). 0 = native PyTorch
# sampler path. Remove once a FlashInfer build that fixes the kernel ships.
VLLM_USE_FLASHINFER_SAMPLER = "0"

[engine.parsers]
tool_call = "deepseek_v4"
reasoning = "deepseek_v4"

# Host cores for a full-GPU serve. Cores do NOT scale with cards: the engine
# runs one API server, one engine core, and one worker per tensor-parallel rank,
# and every worker spends most of its time blocked on the device. What the extra
# cores would buy is detokenization headroom at high concurrency, which is far
# below the reservation ceiling. Requesting the ceiling instead is what leaves a
# co-running job pending on cores while the cards it wants sit idle, on a node
# carrying two overlapping 30-core reservations. Probe with `srun --test-only`
# before raising this, and use `serve --cpus N` for a one-off.
[slurm]
gpus = 4
cpus = 12
memory = "400G"
port = 18800
time_serve = "0"
time_download = "24:00:00"

# ─── Eight-card deployment ───────────────────────────────────────────────
# Selected by `serve deepseek-v4-flash --gpus 8`. Cores are declared rather than
# derived, because they do not follow the card count: eight ranks need four more
# support cores than four ranks, not double. The node carries two overlapping
# 30-core reservations, so a request scaled off the card count exhausts the
# schedulable pool and then pends on Resources while every GPU sits idle.
#
# One checkpoint serves every card count -- unlike GLM, whose card counts need
# different weights -- so only the topology and the KV budget move. This
# attention keeps a single compressed KV head, which makes context cheap enough
# that the full native window fits once the weights are spread over eight cards.
[gpu_variants.8.engine]
tensor_parallel = 8
max_total_tokens = 1048576

[gpu_variants.8.slurm]
gpus = 8
cpus = 16
memory = "600G"
