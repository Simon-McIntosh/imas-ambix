# MiniMax M3 — 428B MoE, ~24.5B activated/token, 1M context with MSA
#
# Architecture (from live config.json, 2026-06-26): 60 layers (first 3 dense,
# 57 MoE), 128 routed experts, top-4 routing + 1 shared expert, hidden_size=6144,
# moe_intermediate_size=3072, 64 Q heads / 4 KV heads (GQA), head_dim=128,
# vocab=200,064. MSA (MiniMax Sparse Attention) for ultra-long context.
# Multimodal: separate ViT vision encoder (hidden 1280, 32 layers).
# Weights: FP8 native checkpoint (float8_e4m3fn) — ~456 GB on disk.
#
# DECODE SPEED: ~24.5B active/token (computed from config) = ~1.5× FEWER than
# GLM-5.2's ~36.6B → expect ~1.5× faster single-request decode (~45-55 tok/s
# est. vs GLM's measured ~30). Verify live after first serve. Still short of the
# 130+/400 target — DeepSeek-V4-Flash (~13B active) remains the speed leader.
#
# Memory budget on 4×H200 NVL (140.4 GB each = 561.6 GB total):
#   GPU: ~114 GB/card weights (456 GB / 4 TP shards)
#        mem_fraction_static=0.85 → 119.3 GB/card reserved → fits ✓ (+5 GB buffer)
#   KV:  ~21 GB/card (15% × 140.4) = 84 GB total KV pool
#        At 128K tokens w/ typical GQA ratios, KV fits well within budget.
#        MSA at 1M context: per-token compute is 1/20th of full attention;
#        raise max_total_tokens after confirming KV headroom on first run.
#   No CPU offloading — entire 456 GB model lives on GPU
#
# Throughput target: >400 tok/s
#   MSA delivers 15× decode speedup vs M2 at 1M context (per M3 blog).
#   4×H200 NVL + FP8 tensor cores at TP=4 comfortably clears 400 tok/s floor.
#   Comparison: DeepSeek V4-Flash (164 GB FP4) achieves ~500-800 tok/s on the
#   same hardware; M3 at ~456 GB FP8 with MSA should land in a similar range.
#
# Thinking mode (max effort): toggle per-request
#   Enable:  extra_body={"chat_template_kwargs": {"thinking": True}}
#   Disable: extra_body={"chat_template_kwargs": {"thinking": False}}
#   Preserve thinking tokens: add "preserve_thinking": True
#   Recommended: temperature=1.0, top_p=0.95 with thinking enabled.
#   The --reasoning-parser below ensures <think>…</think> tokens are
#   extracted and surfaced in the API response.
#
# ⚠️  WEIGHTS NOT YET RELEASED — expected ~2026-06-11
#     HF repo: MiniMaxAI/MiniMax-M3 (currently a placeholder; check before download)
#     Download when ready: imas-ambix agent download minimax-m3
#     Serve:               imas-ambix agent serve minimax-m3
#
#     Post-launch tuning checklist (validate on first run):
#       1. fp8_gemm_runner_backend: unset (auto) is the default. If SGLang logs
#          "Error Internal" from fp8_blockwise_scaled_mm (the H200 NVL + sgl-kernel
#          ≤0.5.x bug that affected M2.7), add fp8_gemm_runner_backend="triton".
#          Check sgl-kernel version first — newer releases may have fixed this.
#       2. moe_runner_backend: unset (auto) targets fastest available kernel.
#          Fall back to "triton" if CUTLASS raises MoE errors.
#       3. disable_cuda_graph: set true for safe first run; MSA uses custom
#          sparse kernels and may not be compatible with standard CUDA graph
#          capture. Relax to false once a stable serving run is confirmed.
#       4. attention_backend: "flashinfer" is the default. MSA may require a
#          dedicated attention backend — check M3 model card / deployment guide.
#       5. max_total_tokens: raise from 131072 toward 262144 or higher after
#          confirming KV headroom and MSA token capacity on first run.
#       6. Parser names: verify reasoning/tool_call parsers match M3 chat
#          template (assumed same as M2.7; update if M3 uses a new format).
#       7. Multimodal: M3 natively accepts image and video input. SGLang
#          multimodal support is auto-detected from config.json; no extra flags
#          should be needed, but verify after first load.
#       8. size_gb: update with actual on-disk size once downloaded.
#
# License: TBD (M2.7 uses Custom — check M3 license before commercial use)
# Benchmarks: SWE-Bench Pro 59.0%, Terminal-Bench 2.1 66.0%, BrowseComp 83.5%

# ─── Serving on H200: vLLM + BF16 (NOT MXFP8) ────────────────────────────────
# M3 ships two checkpoints: MiniMax-M3 (BF16, ~800 GB) and MiniMax-M3-MXFP8
# (~440 GB). MXFP8 needs Blackwell tensor cores — on H200 (Hopper) it can only
# run via a BF16-dequant emulation fallback (vLLM), which gives NO memory
# saving (dequantizes at load) and no speedup. So on our hardware the only
# sound choice is the **BF16** checkpoint at TP=8. Consequence: M3-BF16 is
# ~800 GB — LARGER than GLM-5.2's 744 GB FP8 — so KV headroom is TIGHTER than
# GLM, not looser. The win over GLM is purely the ~1.5× faster decode from
# fewer active params (24.5B vs 36.6B), not memory.
# Engine: vLLM (arch MiniMaxM3SparseForConditionalGeneration is supported in
# our vLLM 0.23.0). `--block-size 128` is MANDATORY for M3's MSA sparse/index
# cache on every platform.

[model]
name = "MiniMax-M3"
hf_repo = "MiniMaxAI/MiniMax-M3"
served_name = "minimax-m3"
checkpoint_precision = "bfloat16"
size_gb = 800
max_context = 1048576

[engine]
type = "vllm"
tensor_parallel = 8
trust_remote_code = true
enable_auto_tool_choice = true
# --block-size 128 is required by M3's MSA attention (mandatory on all platforms).
block_size = 128
# BF16 KV (no fp8 KV — the BF16 checkpoint; revisit if accuracy/space needs it).
# Start LOW like GLM-5.2: ~800 GB weights / 8 = ~100 GB/card, leaving little for
# KV + the attention kernel scratch. 0.90 first; if the first real decode OOMs,
# drop mem_fraction (decode scratch is a hard floor — see glm-5-2.toml).
mem_fraction_static = 0.90
attention_backend = "flashinfer"
enable_mixed_chunk = true
enable_p2p_check = false
chunked_prefill_size = 32768
# Conservative context ceiling for the first run — ~800 GB weights leave a thin
# KV pool. Measure GPU KV cache size at startup, then raise. (GLM-5.2 fit 224K
# at 744 GB; M3-BF16 at ~800 GB will be tighter — expect a similar or lower cap.)
max_total_tokens = 131072

[engine.parsers]
# M3 uses the MiniMax M2-family chat template — verify thinking syntax on first
# load and update if the response has no <think> blocks.
tool_call = "minimax-m2"
reasoning = "minimax-append-think"

# Host cores for a full-GPU serve. Cores do NOT scale with cards: the engine
# runs one API server, one engine core, and one worker per tensor-parallel rank,
# and every worker spends most of its time blocked on the device. What the extra
# cores would buy is detokenization headroom at high concurrency, which is far
# below the reservation ceiling. Requesting the ceiling instead is what leaves a
# co-running job pending on cores while the cards it wants sit idle, on a node
# carrying two overlapping 30-core reservations. Probe with `srun --test-only`
# before raising this, and use `serve --cpus N` for a one-off.
[slurm]
gpus = 8
cpus = 16
memory = "640G"
port = 18808
time_serve = "0"
time_download = "24:00:00"
