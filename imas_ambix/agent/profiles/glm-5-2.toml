# GLM-5.2 — Z.ai (Zhipu AI) ~744B MoE frontier coding/agentic model
#
# Architecture: fine-grained MoE, ~744B total / ~40B active per token, native
#   FP8 (E4M3) weights, 1,048,576-token context, native thinking mode.
#   Headline change over GLM-5.1: Multi-Token-Prediction (MTP) draft depth
#   raised from 3 → 5 tokens, the main end-to-end throughput win.
# Benchmarks: coding-first; Z.ai claims it beats GPT-5.5 on coding at ~1/6 cost.
# License: MIT (fully permissive).
# HuggingFace: https://huggingface.co/zai-org/GLM-5.2-FP8
#
# Deployment: vLLM native, full-GPU, TP=8 on all 8×H200 (NO CPU offload).
# Unlike the 4-card glm-5-1 profile (which had to spill experts to CPU via
# KTransformers), the FP8 checkpoint fits entirely in 8×140 GB = 1,123 GB VRAM:
#   * Weights:  ~744 GB FP8  → ~93 GB/card at TP=8
#   * Free:     ~47 GB/card  → KV cache, well short of the native 1M context
# This is exactly the case the official vLLM recipe targets ("fits on a single
# 8×H200 node"). Requires vLLM ≥ 0.23.0 (MTP + tool calling together want main).
#
# Upstream serve command — https://recipes.vllm.ai/zai-org/GLM-5.2 — note its
# --kv-cache-dtype fp8 does NOT hold on this engine; see the KV note below:
#   vllm serve zai-org/GLM-5.2-FP8 --tensor-parallel-size 8 --kv-cache-dtype fp8 \
#     --speculative-config.method mtp --speculative-config.num_speculative_tokens 5 \
#     --tool-call-parser glm47 --reasoning-parser glm45 --enable-auto-tool-choice
#
# ─── TUNING CHECKLIST (after first successful run) ───────────────────────────
# 1. Confirm free VRAM/card at startup (look for the KV-cache capacity line).
#    If KV is tight at 1M context, lower max_total_tokens or mem_fraction_static.
# 2. max_num_seqs/max_num_batched_tokens are set high to exploit the KV budget
#    (the vLLM default 256-seq cap is the throughput bottleneck — see deepseek).
# 3. Re-measure the KV pool line at startup before quoting any context ceiling;
#    the bf16 entry size makes every previously-recorded fp8 figure optimistic.

[model]
name = "GLM-5.2"
hf_repo = "zai-org/GLM-5.2-FP8"
served_name = "glm-5.2"
checkpoint_precision = "fp8"
size_gb = 744
max_context = 1048576

[engine]
type = "vllm"
tensor_parallel = 8
trust_remote_code = true
enable_auto_tool_choice = true
# NOTE: CUDA graphs are ON (vLLM ignores `disable_cuda_graph` — that flag is
# SGLang-only). The earlier "capture stalls" on jobs 1222717/1222745/1222792
# were memory pressure at mem_fraction 0.90/0.95, NOT an inherent TP=8+MTP bug:
# at 0.86 (below) capture completes in ~70 s and the server is graph-accelerated
# (verified job 1222821: "Graph capturing finished in 70 secs, took 2.84 GiB",
# then served real traffic). One root cause — mem_fraction too high — explained
# both the capture stalls and the decode OOM.
# Two HBM constraints fight on 8×H200 (measured 2026-06-25):
#   * Decode scratch is a HARD FLOOR: the sparse-MLA attention kernel
#     (flash_mla sparse_decode_fwd) allocates ~8 GiB/card lazily on the FIRST
#     real decode. At mem_fraction 0.95 the KV pool took almost all HBM, leaving
#     only ~2.4 GiB free → EngineDeadError on the first Claude Code request
#     (job 1222807). So mem_fraction must stay low enough to keep ~8 GiB free.
#   * At mem_fraction 0.86 (ample decode headroom) the KV pool measured
#     13.63 GiB, so context has to be sized to the pool the scratch leaves.
# Resolution: keep mem_fraction LOW (0.86, proven decode-safe) and size context
# to fit. Startup KV-init passing does NOT prove inference fits — the kernel
# scratch is allocated lazily on the first real decode, so always validate with
# a real generation rather than a successful launch.
# KV dtype is forced, not chosen. This model's sparse attention has no FP8 KV
# kernel in vLLM, and "fp8" resolves to the same fp8_e4m3 that every candidate
# sparse/MLA backend rejects, so the server cannot start with it.
#
# Context is sized from the checkpoint's own KV geometry, not from a remembered
# figure. This is MLA: the cache holds a compressed latent of
# kv_lora_rank + qk_rope_head_dim = 512 + 64 = 576 elements per token per
# layer, so at bf16 across 78 layers it costs 576*2*78 = ~87.75 KiB/token.
# That latent is REPLICATED on every rank rather than sharded, so per-card KV
# cost does not fall as cards are added -- more cards help only by shrinking
# weights-per-card and freeing room. (Confirmed against a measured four-card
# pool, which came in at ~90 KiB/token.)
#
# Eight cards: the engine reported 16.53 GiB of pool at mem_fraction 0.90 and
# named 188,992 as its own ceiling there, against a predicted ~29 GiB -- the
# runtime overhead is ~12 GiB larger than the weights and MTP draft alone
# suggest, most of it CUDA graphs. The KV cost per token was right (25.79 GiB
# for 288K is 91.7 KiB/token against 87.75 predicted); only the overhead was
# not. So this is sized from the reported pool, not from arithmetic: 0.92 buys
# ~2.8 GiB more budget and a 256-sequence cap returns graph memory to the pool,
# which together carry 200K.
max_total_tokens = 204800
kv_cache_dtype = "bfloat16"
# 0.92 leaves ~11 GiB/card outside the budget. That reserve is not spare: the
# sparse-MLA kernel claims ~8 GiB/card lazily on the FIRST real decode, and a
# run that left only ~2.4 GiB there reached READY and then died on its first
# request. Do not raise this without re-checking that margin.
mem_fraction_static = 0.92
# 256 sequences, not 1024: CUDA graph capture scales with this cap and the
# memory it takes comes straight out of the KV pool. 256 still sits far above
# any measured concurrency here, so the cap costs nothing and buys context.
max_num_seqs = 256
max_num_batched_tokens = 32768
# MTP speculative decoding — GLM-5.2 ships an MTP head tuned for 5 draft tokens.
speculative_method = "mtp"
speculative_num_tokens = 5

[engine.parsers]
# GLM-5.x function-calling + chain-of-thought output formats.
tool_call = "glm47"
reasoning = "glm45"

[slurm]
# All 8 cards — this run fills the node (the GLM-5.2 FP8 checkpoint needs the
# whole 8×H200 VRAM, so no other GPU job can coexist). Check squeue first.
gpus = 8
# 30 = the full grpA reservation core count (probed 2026-06-25: `gpu:8 cpus=30`
# starts immediately; cpus=60 is denied — the node's other 30 cores belong to
# grpB's overlapping reservation, and betelgeuse refuses jobs without our
# reservation). 30 is therefore the schedulable ceiling for an 8-GPU job.
cpus = 30
memory = "640G"
time_serve = "7-00:00:00"
time_download = "24:00:00"

# ─── INT4 AWQ deployments (four or six cards) ───────────────────────────
# The card counts need genuinely different weights -- the FP8 checkpoint does
# not fit below eight cards -- so the checkpoint travels here as a variant
# rather than in a second slug. Everything not listed is inherited above.
#
# Sizing rule, measured on this node: KV costs ~362 KiB/token in total and is
# sharded across ranks, so per card it is ~362/N KiB/token. The weights are the
# binding constraint, because ~447 GiB spread over N cards leaves only what is
# left of ~131 GiB per card:
#
#   cards   weights/card   KV room/card   200K needs/card
#   4       ~102 GiB       ~6.5 GiB       ~17.7 GiB   -> cannot reach 200K
#   6       ~74 GiB        ~43 GiB        ~12.4 GiB   -> comfortable
#
# So six cards is the long-context deployment and still coexists with a
# two-card neighbour. Four cards is the compact option, capped near 64K: the
# engine put its own workable ceiling at ~74.7K there, so 64K is the honest
# figure rather than a hopeful one.
#
# mem_fraction stays at 0.90 deliberately: it leaves ~14 GB/card outside the
# budget, and the sparse-MLA kernel claims ~8 GiB/card lazily on the FIRST real
# decode. Raising it buys KV but eats that reserve, which is what turns a clean
# launch into a dead engine on the first request. Reaching READY is not
# evidence the reserve suffices -- only a real generation is.
#
# MTP speculative decoding is unavailable here: vLLM cannot build an MTP draft
# against a compressed-tensors MoE checkpoint. The draft weights are fine and
# the loader reads their per-expert layout, but the MTP block's quantized MoE
# never registers the fused `routed_experts` parameter the expert mapping
# resolves against. The main model loads the same layout without trouble, so
# this is specific to the draft path. Draft weights are kept beside the
# checkpoint in `mtp-draft/` for when the engine supports it.

[gpu_variants.4.model]
hf_repo = "cyankiwi/GLM-5.2-AWQ-INT4"
checkpoint_precision = "int4"
# Separate download directory -- both checkpoints coexist on disk.
weights_slug = "glm-5-2-int4"
size_gb = 440

[gpu_variants.4.engine]
tensor_parallel = 4
mem_fraction_static = 0.90
max_total_tokens = 65536
kv_cache_dtype = "bfloat16"
max_num_seqs = 64
# No speculative decoding -- see the note above.
speculative_method = ""
speculative_num_tokens = 0

[gpu_variants.4.slurm]
gpus = 4
cpus = 12
memory = "320G"

# Six cards -- the long-context INT4 deployment. 256K needs ~15.1 GiB/card of
# the ~43 GiB the weights leave, so the margin is wide; the ceiling here is
# nearer 700K, and 256K is chosen to stay well inside it.
[gpu_variants.6.model]
hf_repo = "cyankiwi/GLM-5.2-AWQ-INT4"
checkpoint_precision = "int4"
weights_slug = "glm-5-2-int4"
size_gb = 440

[gpu_variants.6.engine]
tensor_parallel = 6
mem_fraction_static = 0.90
max_total_tokens = 262144
kv_cache_dtype = "bfloat16"
max_num_seqs = 64
speculative_method = ""
speculative_num_tokens = 0

[gpu_variants.6.slurm]
gpus = 6
cpus = 12
memory = "420G"

# ─── GLM-5.3 Migration (weights expected ~Aug 28) ───────────────────────
# GLM-5.3 shares GLM-5.2's glm_moe_dsa architecture — the FP8 checkpoint
# format, MTP head, TP layout, and SGLang/vLLM recipes all carry over.
# When the open-weight release lands:
#   1. Replace hf_repo with ``zai-org/GLM-5.3-FP8``
#   2. Rerun ``imas-ambix agent download glm-5-2``
#   3. Rerun ``imas-ambix agent serve glm-5-2``
# No other config changes are expected (same FP8 scheme, same parsers, same
# MTP head depth).  The SGLang low-latency recipe (see bottom comments) works
# as-is for 5.3 production — adjust chunked-prefill and mem-fraction only if
# the 5.3 KV budget differs (unlikely — same base model).
#
# ─── SGLang alternative (8×H200, low-latency production serving) ─────────
# The SGLang v0.5.14+ cookbook defines a proven FP8 recipe at higher
# aggregate throughput than the vLLM path for concurrency ≥16:
#   python -m sglang.launch_server \
#     --model-path /work/projects/imas_gpu/agents/glm-5-2/model \
#     --tp-size 8 \
#     --speculative-algorithm EAGLE \
#     --speculative-num-steps 5 \
#     --speculative-eagle-topk 1 \
#     --speculative-num-draft-tokens 6 \
#     --mem-fraction-static 0.8 \
#     --chunked-prefill-size 8192 \
#     --max-running-requests 48
# Measured (8K-in/1K-out): TTFT 668 ms, TPOT 5.05 ms, ~197 tok/s/GPU @ c=1.
# Swap engine.type to "sglang" and uncomment the fields above to test it.
# The balanced recipe (DP=8, DeepEP, chunked-prefill=32768) hits ~2,390 tok/s/GPU
# at concurrency 256 — use that for production batch serving.
