# DeepSeek V4-Flash — 2×H200 variant
#
# Inherits all settings from deepseek-v4-flash.toml (4×H200 base) and
# overrides only the GPU topology.  Shares downloaded weights with the
# base profile — run ``imas-ambix agent download deepseek-v4-flash`` once.
#
# Memory budget on 2×H200 (140.4 GB each):
#   GPU: ~82 GB/card weights → ~58 GB/card free for KV
#   KV:  2 × 58 GB / 42 KB per token ≈ 2.8M tokens pool capacity
#   Full 1M context fits: the ~2.8M-token pool (1,372,204 measured 2026-06-04)
#   easily holds one 1M-token request, with room for concurrency.
#
# Throughput target: ~150–250 tok/s decode (vs 500–800 tok/s at 4×H200)
# Use this variant when the other 6 GPUs are needed for a concurrent job.

_base = "deepseek-v4-flash"

[engine]
tensor_parallel = 2
# Full 1M context on 2 cards — single KV head (~42 KB/token) makes KV cheap,
# so there's no reason to cap. The base declares the same full native window,
# so this matches it rather than raising a narrower cap.
max_total_tokens = 1048576
# Halved from base — at 2×H200 the KV pool sustains hundreds of concurrent
# sequences at typical context before hitting the pool ceiling.
# vLLM preempts gracefully if the pool fills; 512 avoids OOM bursts.
max_num_seqs = 512

[slurm]
gpus = 2
cpus = 8
memory = "200G"
# 18809, outside the 18800-18808 profile block, because 18802 is the ROUTER's
# port. Declaring it here made a bare `serve deepseek-v4-flash-2x` refuse at
# submit with a port-holder error naming ambix-router, which reads as a router
# fault rather than a profile defect. Every profile must declare a DISTINCT
# port (tests/test_agent.py::test_every_profile_declares_a_distinct_port), so
# this cannot simply share the four-card base's 18800 even though the two are
# never up together -- they share a served_name and the router refuses a
# duplicate model id from two upstreams.
port = 18809
