<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Decisions · imas-ambix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="foundation.css">
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="project.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>

<div id="root"></div>

<script src="state-loader.js"></script>
<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel">
  const { useState, useMemo, useEffect } = React;

  // Collect every decision across every plan in one list, attaching the plan slug.
  function collectAllDecisions() {
    const M = window.STATE;
    const out = [];
    for (const [slug, plan] of Object.entries(M.plans)) {
      for (const d of (plan.decisions || [])) {
        out.push({
          plan: slug,
          planTitle: plan.title,
          ms: plan.ms,
          ...d,
        });
      }
    }
    return out;
  }

  // Decision card — free-form: chips commit on click; text + Send commits too.
  // Collapses to a one-line summary once committed.
  function DecisionCard({ d, onRationale, onLock }) {
    const hasChoice    = !!d.chosen;
    const hasRationale = !!(d._committedRationale && d._committedRationale.length);
    const locked       = hasChoice || hasRationale;
    const [collapsed, setCollapsed] = React.useState(locked);
    React.useEffect(() => { if (locked) setCollapsed(true); }, [locked, d.when]);

    const rationaleDirty = (d.rationale || "") !== (d._committedRationale || "");
    const commit = (overrideChoice) => {
      const choice = overrideChoice !== undefined ? overrideChoice : (d.chosen || "");
      onLock(choice);
    };

    return (
      <div className={`inline-decision ${locked ? "locked" : "open"} ${collapsed && locked ? "collapsed" : ""}`} id={`d-${d.key}`}>
        <div className="h">
          <span className="k">{d.key}</span>
          <span className="t">{d.title}</span>
          {locked
            ? <span className="dim" style={{ fontSize: 11.5, fontFamily: "var(--mono)" }}>{collapsed ? "✓" : "open for edit"} by {d.by || "—"} · {d.when}</span>
            : <span style={{ fontSize: 11.5, fontFamily: "var(--mono)", color: "var(--accent)" }}>open</span>}
          {locked && (
            <button className="reopen" onClick={() => setCollapsed(c => !c)}>
              {collapsed ? "edit" : "done"}
            </button>
          )}
        </div>

        <div className="summary-line">
          {d.chosen && <><strong>{d.chosen}</strong>{d._committedRationale && " — "}</>}
          {d._committedRationale && <span>{d._committedRationale}</span>}
          {!d.chosen && !d._committedRationale && <em>(empty)</em>}
        </div>

        {d.context && (<div style={{ color: "var(--muted)", fontSize: 13.5, marginBottom: 10, lineHeight: 1.55 }}>{d.context}</div>)}
        <div className="c">
          {d.choices.map(c => (
            <button
              key={c}
              className={`${c === d.chosen ? "chosen" : ""} ${c.toLowerCase().includes("defer") ? "defer" : ""}`}
              onClick={() => commit(c)}
              title="Clicking commits this choice + the current rationale"
            >{c}</button>
          ))}
        </div>
        <div className="rationale-row">
          <input
            className={`r ${rationaleDirty ? "dirty" : ""}`}
            placeholder="rationale or free-form comment (Enter to send)"
            value={d.rationale || ""}
            onChange={(e) => onRationale(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") commit(); }}
          />
          <button
            className="send"
            onClick={() => commit()}
            title="Commit text (and current choice if any) to state"
          >
            {locked ? "Update ↵" : "Send ↵"}
          </button>
        </div>
      </div>
    );
  }

  function Page() {
    const [decisions, setDecisions] = useState(() => {
      // Hydrate from localStorage so already-committed decisions render locked.
      return collectAllDecisions().map(d => {
        const s = Persist.load(d.plan);
        const stored = s && s.decisions && s.decisions[d.key];
        if (!stored) return d;
        return { ...d, chosen: stored.choice || "", rationale: stored.rationale || "", when: stored.when || "", by: stored.by || "", _committedRationale: stored.rationale || "" };
      });
    });
    const [filterStatus, setFilterStatus] = useState("open");
    const [filterPlan, setFilterPlan]     = useState("");
    const [query, setQuery]               = useState("");

    const planList = [...new Set(decisions.map(d => d.plan))].sort();

    const isLocked = (d) => !!d.chosen || !!d._committedRationale;
    const filtered = decisions.filter(d =>
      (filterStatus === ""    || (filterStatus === "open" && !isLocked(d)) || (filterStatus === "locked" && isLocked(d))) &&
      (filterPlan === ""      || d.plan === filterPlan) &&
      (!query || d.title.toLowerCase().includes(query.toLowerCase()) || d.key.includes(query.toLowerCase()))
    );

    const openCount   = decisions.filter(d => !isLocked(d)).length;
    const lockedCount = decisions.filter(d =>  isLocked(d)).length;

    // Group by plan
    const byPlan = useMemo(() => {
      const g = {};
      for (const d of filtered) (g[d.plan] = g[d.plan] || []).push(d);
      const planOrder = filtered.map(d => d.plan).filter((p, i, a) => a.indexOf(p) === i);
      return planOrder.map(p => ({ plan: p, planTitle: g[p][0].planTitle, ms: g[p][0].ms, decisions: g[p] }));
    }, [filtered]);

    const lock = (plan, key, choice) => {
      const now = new Date().toISOString().slice(0, 16).replace("T", " ");
      setDecisions(ds => ds.map(d =>
        d.plan === plan && d.key === key
          ? { ...d, chosen: choice, when: now, by: "Simon McIntosh" }
          : d
      ));
      const cur = decisions.find(d => d.plan === plan && d.key === key);
      const rationale = cur?.rationale || "";
      Persist.save(plan, { [`decisions.${key}`]: { choice, rationale, when: now, by: "Simon McIntosh" } });
      flashSaved(`${plan}.${key} → ${choice}`);
    };
    const setRationale = (plan, key, rationale) => {
      setDecisions(ds => ds.map(d =>
        d.plan === plan && d.key === key ? { ...d, rationale } : d
      ));
    };
    const saveRationale = (plan, key) => {
      const cur = decisions.find(d => d.plan === plan && d.key === key);
      if (!cur) return;
      Persist.save(plan, { [`decisions.${key}`]: { choice: cur.chosen, rationale: cur.rationale, when: cur.when, by: cur.by || "Simon McIntosh" } });
      flashSaved(`${plan}.${key} rationale`);
    };

    return (
      <div className="shell">
        <Topbar project="imas-ambix" active="decisions" />

        <main className="page wide">
          <div className="page-head">
            <div className="title">
              <h1>Decisions</h1>
              <div className="subtitle">
                Every choice on every plan in the project. <strong>{openCount}</strong> open ·
                <strong> {lockedCount}</strong> locked. Lock or change a call right here — chips POST to the
                owning plan's state JSON. Open the plan only if you need full context beyond the row.
              </div>
            </div>
            <div className="actions">
              <button className="btn">Export as JSON</button>
            </div>
          </div>

          <div className="stats">
            <div className="stat"><div className="l">total</div><div className="n">{decisions.length}</div></div>
            <div className="stat"><div className="l">open</div><div className="n" style={{ color: "var(--accent)" }}>{openCount}</div></div>
            <div className="stat"><div className="l">locked</div><div className="n">{lockedCount}</div></div>
            <div className="stat"><div className="l">plans w/ open</div><div className="n">{new Set(decisions.filter(d => !d.chosen).map(d => d.plan)).size}</div></div>
            <div className="stat"><div className="l">oldest open</div><div className="n" style={{ fontSize: 16 }}>3d</div></div>
            <div className="stat"><div className="l">last locked</div><div className="n" style={{ fontSize: 14 }}>2026-05-20 22:00</div></div>
          </div>

          <div className="filterbar">
            <label className="search">
              <span className="icon"><Icon name="search" /></span>
              <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="filter by title or key…" />
            </label>
            <label className="field">
              show
              <select value={filterStatus} onChange={(e) => setFilterStatus(e.target.value)}>
                <option value="open">open only</option>
                <option value="locked">locked only</option>
                <option value="">all</option>
              </select>
            </label>
            <label className="field">
              plan
              <select value={filterPlan} onChange={(e) => setFilterPlan(e.target.value)}>
                <option value="">(all)</option>
                {planList.map(p => <option key={p} value={p}>{p}</option>)}
              </select>
            </label>
            <span className="count">{filtered.length} of {decisions.length}</span>
          </div>

          {/* Decisions grouped by plan, each row is an actionable InlineDecision-equivalent */}
          {byPlan.length === 0 && (
            <div className="dim" style={{ padding: 40, textAlign: "center" }}>No decisions match.</div>
          )}
          {byPlan.map(g => (
            <section key={g.plan} style={{ marginTop: 24 }}>
              <h2 style={{ display: "flex", alignItems: "baseline", gap: 8 }}>
                <a className="link" href={`plan.html?slug=${encodeURIComponent(g.plan)}`} style={{ color: "var(--ink)", border: 0, fontWeight: 600, textTransform: "none", letterSpacing: 0, fontSize: 14 }}>
                  {g.planTitle}
                </a>
                <span className="dim" style={{ fontFamily: "var(--mono)", fontSize: 11.5, fontWeight: 400, textTransform: "none", letterSpacing: 0 }}>/{g.plan}</span>
                <Tag kind="ms">{g.ms}</Tag>
                <span className="count">{g.decisions.length}</span>
                <span className="sp"></span>
                <a className="link" href={`plan.html?slug=${encodeURIComponent(g.plan)}`} style={{ fontSize: 11.5, fontWeight: 400, textTransform: "none", letterSpacing: 0 }}>open plan ↗</a>
              </h2>

              {g.decisions.map(d => (
                <DecisionCard
                  key={d.key}
                  d={d}
                  onSelect={(c) => {/* visual selection only — local to card */}}
                  onRationale={(text) => setRationale(d.plan, d.key, text)}
                  onLock={(choice) => lock(d.plan, d.key, choice)}
                />
              ))}
            </section>
          ))}

          <div className="card" style={{ marginTop: 36 }}>
            <div className="card-head"><h3>How decisions move</h3></div>
            <div className="card-body" style={{ fontSize: 13.5, color: "var(--ink-2)", lineHeight: 1.65 }}>
              <p style={{ marginTop: 0 }}>
                Each decision belongs to one plan. Clicking a choice on this page is exactly equivalent to
                clicking it on the plan page — both POST to
                <code> docs/state/imas-ambix/&lt;plan&gt;.json#decisions.&lt;key&gt;</code>. The aggregator
                exists so you can sweep through every open call in one pass instead of opening every plan.
              </p>
              <p style={{ marginBottom: 0 }}>
                On the published GitHub Pages site the chips are disabled (read-only mode banner explains).
                To record a decision there, edit the state JSON in the repo and commit; the aggregator picks
                it up on next load.
              </p>
            </div>
          </div>

        </main>
      </div>
    );
  }

  function ReadyGate({ children }) {
    const [ready, setReady] = React.useState(false);
    React.useEffect(() => {
      if (window.STATE_READY) window.STATE_READY.then(() => setReady(true));
      else setReady(true);  // fallback if loader didn't run
    }, []);
    if (!ready) {
      return (
        <div className="dim" style={{
          padding: 48, textAlign: "center",
          fontFamily: "var(--mono)", fontSize: 13, color: "var(--muted)"
        }}>
          Loading state…
        </div>
      );
    }
    return children;
  }

  ReactDOM.createRoot(document.getElementById("root")).render(
    <ReadyGate><Page /></ReadyGate>
  );
</script>
</body>
</html>
