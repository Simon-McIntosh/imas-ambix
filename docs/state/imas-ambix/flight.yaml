# Flight control — imas-ambix project layer.
#
# Merges over the host layer; only the keys named here change. This layer
# currently changes nothing beyond its version.
#
# Worker placement is not declared here. The host layer
# (~/.config/reckon/flight.yaml) arms placement for every backend and every
# project on the shared fleet reservation, and reckon/crew/placement.py holds
# that reservation and builds the overlapping step. A placement block here would
# only repeat the host's, or drift from it: the reservation's reason query is
# `%R`, which reports the pending reason, or the node list once the step runs.
#
# The fleet allocation itself is held and read through reckon:
# `reckon fleet-node hold [--submit] | status | place -- <command>`.
#
# yaml-language-server: $schema=http://127.0.0.1:8765/_shared/flight.schema.json

version: 1
