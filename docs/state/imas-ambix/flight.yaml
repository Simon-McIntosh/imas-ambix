# Flight control — imas-ambix project layer.
#
# Merges over the host layer; only the keys named here change, so every other
# routing property of the clive backend stays whatever the host layer declares.
#
# The clive lane routes to the endpoint served on the GPU node, so a worker is
# free to run anywhere that endpoint is reachable. What the placement changes
# is which host the worker runs on: the login node caps a user slice at a
# fraction of four cores, and a held whole-node allocation has no such ceiling.
#
# The wrapper resolves the held allocation from the scheduler by the comment
# token the hold generator emits, so the job identifier is deliberately absent
# here. A literal identifier goes stale on a resubmit, a cancel-and-rehold or a
# move to another node, and it does so silently: the launch would land back on
# the login node while every record still claimed it was placed. Naming the
# resolver instead means the placement follows the allocation.
#
# yaml-language-server: $schema=http://127.0.0.1:8765/_shared/flight.schema.json

version: 1

backends:
  clive:
    placement:
      # The step client itself, resolved on PATH as /usr/bin/srun. Reckon
      # reads the held allocation from the reservation every session shares
      # and prefixes `--overlap --jobid=<held>` ahead of these options, so the
      # identifier is resolved per launch and is absent from this file for the
      # same reason it was absent before: it goes stale on a resubmit, and it
      # does so silently, returning workers to the login node while every
      # record still reports them placed.
      scheduler: srun
      options: []
      # The same wrapper's status surface identifies the allocation selected by
      # its comment token. Reckon reads the numeric token from this output and
      # substitutes it into both scheduler queries below.
      job_id_probe: ["imas-ambix", "agent", "fleet", "status"]
      state_query: ["squeue", "-h", "-j", "{job}", "-o", "%T"]
      reason_query: ["squeue", "-h", "-j", "{job}", "-o", "%r"]
