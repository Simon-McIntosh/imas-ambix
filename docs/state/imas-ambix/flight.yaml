# Flight control — imas-ambix project layer.
#
# Merges over the host layer; only the keys named here change, so every other
# routing property of the clive backend stays whatever the host layer declares.
#
# The clive lane routes to the endpoint served on the GPU node, so a worker is
# free to run anywhere that endpoint is reachable. What the placement changes
# is which host the worker runs on: the login node caps a user slice at a
# fraction of four cores, and a held whole-node allocation has no such ceiling.
#
# The wrapper resolves the held allocation from the scheduler by the comment
# token the hold generator emits, so the job identifier is deliberately absent
# here. A literal identifier goes stale on a resubmit, a cancel-and-rehold or a
# move to another node, and it does so silently: the launch would land back on
# the login node while every record still claimed it was placed. Naming the
# resolver instead means the placement follows the allocation.
#
# yaml-language-server: $schema=http://127.0.0.1:8765/_shared/flight.schema.json

version: 1

# THE WRAPPER IS A BRIDGE, NOT THE DESTINATION. Reckon's own design resolves the
# allocation from a reservation record published into shared crew state, which is
# the better mechanism: one record, read by every session, with the identifier
# held in one place. It is not used here because that record is HOST-GLOBAL while
# this declaration is per project, so publishing one gives every repository's
# workers a single roster ceiling of 25. Measured 2026-09-23: 45 runs across four
# repositories occupied it within minutes and dispatch was refused workstation
# wide, while exactly one step was running inside the allocation it protects.
#
# So the wrapper resolves the allocation itself and publishes no record, which is
# what keeps the effect inside this repository. It retires the moment reckon's
# roster cap is scoped to the project that armed it, or its reservation record is,
# or the limit becomes configurable. At that point this block becomes:
#
#     scheduler: srun
#     state_query:  [squeue, -h, -j, "{job}", -o, "%T"]
#     reason_query: [squeue, -h, -j, "{job}", -o, "%R"]
#
# published reservation first, declaration second — a declaration without a record
# prefixes a bare `srun`, which mints one allocation per worker.

backends:
  clive:
    placement:
      # A shim on PATH rather than a path in this file, because the interpreter
      # it execs belongs to one checkout on one machine and this file is
      # committed. The shim hands the worker's argv to `agent fleet place`,
      # which resolves the allocation by the comment token the hold generator
      # emits — so no job identifier appears here, and a resubmit is picked up
      # at launch rather than remembered. Verified 2026-09-23 across a real
      # resubmit under a new identifier, with no change to this file; the two
      # identifiers are recorded in the plan rather than here, so that a search
      # of this file for a job number stays a check with no false positives.
      # Named for what it does rather than for the field it fills, and NOT
      # `ambix-fleet`: that token is the allocation's own identity — the SLURM
      # job name and the comment the resolver matches on — so reusing it would
      # give one name two referents, the place and the act of placing, in logs
      # and scripts where telling them apart is the whole point.
      scheduler: ambix-on-fleet
      options: []
      state_query: [squeue, -h, -j, "{job}", -o, "%T"]
      reason_query: [squeue, -h, -j, "{job}", -o, "%r"]
