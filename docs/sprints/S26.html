  <li data-slug="serving-record-warehouse" data-item="{&quot;done_when&quot;: &quot;A window is totalled by partitioning it into contiguous counter runs and summing, with the union of contributing runs reported as its coverage; a window the record cannot cover answers partial-with-coverage or declines; the store ingests every receipts file idempotently and resumably, rebuilds from the receipts alone to a store equal to the appended one, and compacts older entries into tiers rather than deleting them; per-model queries answer across all recorded serves; ingest runs on its own schedule, owned by neither the recorder nor the watcher; whole-tree lint exits 0.&quot;, &quot;slug&quot;: &quot;serving-record-warehouse&quot;, &quot;why_now&quot;: &quot;Every figure the reporter prints today is wrong in a way a reader cannot see, and the receipts it should be reading accumulate whether or not anything reads them.&quot;}">serving-record-warehouse</li>
  <li data-slug="circular-assertion-guard" data-item="{&quot;done_when&quot;: &quot;An AST check reports a test whose expected value is read from the same module-level constant the code under test reads; every site it finds on the current tree is either rewritten to a literal or declared with a stated reason; the check runs in the ordinary lint gate and exits 0.&quot;, &quot;slug&quot;: &quot;circular-assertion-guard&quot;, &quot;why_now&quot;: &quot;The spine shipped with tests that import the constant they assert against, so the suite stayed green through the exact change it was meant to refuse; the sites are known and the check is cheap.&quot;}">circular-assertion-guard</li>
  <li data-slug="serving-interpreter-version-split" data-item="{&quot;done_when&quot;: &quot;The accelerator kernel resolves from its own environment and the serving environment no longer contains it; that environment syncs on the interpreter the repository targets and the sync reproduces from the project files after removing the environment entirely; a source file carrying syntax the previous serving interpreter could not parse is imported by the serve; a real generation succeeds against the rebuilt serve and the lane document reports a measured state afterwards; the drained-to-zero evidence is recorded beside the rebuild.&quot;, &quot;slug&quot;: &quot;serving-interpreter-version-split&quot;, &quot;why_now&quot;: &quot;The serving environment parses repository sources with an older interpreter than the formatter targets, and that mismatch has now broken the serve four separate times; the sprint&#x27;s own work touches that package, so a fifth instance is likely before it closes. Membership is granted by the lead; the rebuild still waits on a drained-lane window, which stops the model serve and is not an agent&#x27;s to schedule.&quot;}">serving-interpreter-version-split</li>
  </ol>
