  <li data-slug="serve-telemetry-spine" data-item="{&quot;done_when&quot;: &quot;The stall is diagnosed and named, and `imas-ambix agent watch` renders every panel from the real record \u2014 the plan&#x27;s own original criterion, this time measured rather than asserted. Impl reflects the reader&#x27;s state and not the recorder&#x27;s.&quot;, &quot;slug&quot;: &quot;serve-telemetry-spine&quot;, &quot;why_now&quot;: &quot;Its reader has never been seen to render. `imas-ambix agent watch` timed out at 110 s twice against the real record and a staged probe printed nothing, so it stalls before the first instrumented stage; the index is built at 1,046 MB over 49 sources and ingest is 0.29 s, so the stall is downstream of ingest and not isolated. The plan read shipped at impl 1.0 over that, and everything the warehouse will build assumes the reader works.&quot;}">serve-telemetry-spine</li>
  <li data-slug="a-recorded-field-is-one-that-was-measured" data-item="{&quot;done_when&quot;: &quot;A recorded vLLM exposition lives under tests/data/ with the family reader asserted against it and a namespace or label-shape mutation proving the assertion can fail. The recorder&#x27;s stated contract matches the marker case it now records. cards[].name is parsed or the key is removed.&quot;, &quot;slug&quot;: &quot;a-recorded-field-is-one-that-was-measured&quot;, &quot;why_now&quot;: &quot;Three defects were carried as an open followup on a plan marked shipped, so they were excluded from every open path and visible only to someone reading past a finished plan&#x27;s conclusion. One of them is a test that cannot fail.&quot;}">a-recorded-field-is-one-that-was-measured</li>

  <li data-slug="local-lane-admission-control" data-item="{&quot;done_when&quot;: &quot;lane.json and router-gate.json are one documented, versioned schema owned by imas_ambix.agent.lane, which every consumer reads rather than re-deriving field names by path. The open queue-order decision is locked or explicitly deferred with its reason.&quot;, &quot;slug&quot;: &quot;local-lane-admission-control&quot;, &quot;why_now&quot;: &quot;Deep and largely landed: the global gate, the drained relaunch under lpm with a queue bound of 64, the router-enforced pause and the inert dry runs are all live and tested at their call sites. What remains is a schema contract rather than a mechanism, and the lead has ranked the lane items low.&quot;}">local-lane-admission-control</li>
  <li data-slug="clive-launch-modes" data-item="{&quot;done_when&quot;: &quot;The final section lands or the plan is closed with its residue named in a followup carrying a done-when and a path.&quot;, &quot;slug&quot;: &quot;clive-launch-modes&quot;, &quot;why_now&quot;: &quot;At impl 0.99 it is one step from closed, and leaving it open carries a nearly finished plan into a new sprint where a successor has to re-establish what the remaining fraction is.&quot;}">clive-launch-modes</li>
  <li data-slug="serving-record-warehouse" data-item="{&quot;done_when&quot;: &quot;The warehouse reads every serving record through one interface, with a currency audit recording per feature whether it is reached from a real call site or is scaffolding.&quot;, &quot;slug&quot;: &quot;serving-record-warehouse&quot;, &quot;why_now&quot;: &quot;A separate workstream from the fleet move, and untouched at impl 0. It is the consumer surface for every serving record the lane now produces, and the lane&#x27;s own telemetry is landing faster than anything reads it.&quot;}">serving-record-warehouse</li>
  <li data-slug="circular-assertion-guard" data-item="{&quot;done_when&quot;: &quot;The three outstanding fixes are committed with the written tests passing, or the worktree path and the three fixes are named in a followup a successor can act on without the conversation.&quot;, &quot;slug&quot;: &quot;circular-assertion-guard&quot;, &quot;why_now&quot;: &quot;Its failing tests are already written and three fixes remain, so the cost of finishing is small and the cost of losing it is the whole diagnosis.&quot;}">circular-assertion-guard</li>
  </ol>
