<main class="reckon-resource" data-type="sprint" data-id="S24">
  <ol data-reckon="sprint-items">
  <li data-slug="serving-endpoint-indirection" data-item="{&quot;capability&quot;: {&quot;class&quot;: &quot;orchestrator&quot;, &quot;requirements&quot;: {&quot;reasoning&quot;: &quot;deep&quot;, &quot;verification&quot;: &quot;strict&quot;}, &quot;version&quot;: &quot;1.0&quot;}, &quot;done_when&quot;: &quot;Two engines serve behind one origin with a union catalog carrying intact per-release metadata; the generated launcher lists and selects both with no source change; streaming, tool blocks and count_tokens are byte-faithful through the router; an engine restart on a new port needs no config edit.&quot;, &quot;effort_hours&quot;: 6, &quot;slug&quot;: &quot;serving-endpoint-indirection&quot;, &quot;why_now&quot;: &quot;Every other item in this sprint depends on it: one origin is what lets a second model exist without a second consumer contract, and it is where upstream resolution, the union catalog, admission control and per-consumer accounting all live. Both prerequisites are already met — the allocation parser reads this scheduler&#x27;s spelling, and a keyless engine is running.&quot;}">serving-endpoint-indirection</li>
  <li data-slug="multi-model-serving-capacity" data-item="{&quot;capability&quot;: {&quot;class&quot;: &quot;orchestrator&quot;, &quot;requirements&quot;: {&quot;reasoning&quot;: &quot;deep&quot;, &quot;risk&quot;: &quot;moderate&quot;, &quot;verification&quot;: &quot;strict&quot;}, &quot;version&quot;: &quot;1.0&quot;}, &quot;done_when&quot;: &quot;Two releases serve concurrently on distinct ports inside the card and core budget, each sized from a scheduler probe and each context ceiling quoted from its own startup pool line and validated by a real generation; a per-consumer concurrency cap with a bounded queue holds under deliberate overload; the sub-tree guidance matches the profiles as they now are; a written service statement names the audience and the reserved floor.&quot;, &quot;effort_hours&quot;: 4, &quot;slug&quot;: &quot;multi-model-serving-capacity&quot;, &quot;why_now&quot;: &quot;Both GLM checkpoints finished downloading today and a keyless DeepSeek serve is running on 2 cards and 8 cores, so the concurrent configuration is available now rather than hypothetical. It also owns the honest answer to what the endpoint can promise, which sizes everything else.&quot;}">multi-model-serving-capacity</li>
  <li data-slug="clive-launch-modes" data-item="{&quot;capability&quot;: {&quot;class&quot;: &quot;general&quot;, &quot;requirements&quot;: {&quot;verification&quot;: &quot;strict&quot;}, &quot;version&quot;: &quot;1.0&quot;}, &quot;done_when&quot;: &quot;An unqualified launch serves local models only regardless of any readable credential, fenced by a test; the mode axis is named and documented; curated rows present each release with its real topology and context and are confirmed rendering interactively; supported capabilities are declared for every slot; a delegated worker is observed running on the local engine and the session is told which alias that is.&quot;, &quot;effort_hours&quot;: 3, &quot;slug&quot;: &quot;clive-launch-modes&quot;, &quot;why_now&quot;: &quot;Last of the three because the picker and the alias mapping are only worth building once one origin can actually offer more than one model. The two naming decisions it carries are the lead&#x27;s and can be settled while the router is built.&quot;}">clive-launch-modes</li>
  <li data-slug="glm-53-serve-and-wiring" data-item="{&quot;capability&quot;: {&quot;class&quot;: &quot;orchestrator&quot;, &quot;requirements&quot;: {&quot;reasoning&quot;: &quot;deep&quot;, &quot;risk&quot;: &quot;moderate&quot;, &quot;verification&quot;: &quot;strict&quot;}, &quot;version&quot;: &quot;1.0&quot;}, &quot;done_when&quot;: &quot;The four-card INT4 deployment serves on its own port beside the DeepSeek serve at 6 of 8 cards without exhausting the shared core pool; its context ceiling is quoted from the engine&#x27;s startup pool line and a real generation succeeds, not merely a ready state; a tool-use round trip and a reasoning response both succeed against this engine; the release appears in the catalog with complete per-variant metadata and the generated launcher selects it with no source change; the eight-card FP8 deployment is measured once and recorded as an alternative to concurrency rather than a default.&quot;, &quot;effort_hours&quot;: 3, &quot;slug&quot;: &quot;glm-53-serve-and-wiring&quot;, &quot;why_now&quot;: &quot;First in the graph, and the only item with nothing outstanding: both checkpoints finished downloading on 2026-09-01 and an open endpoint is now the serve default. Every other item is about serving more than one model and none of them can be PROVEN until a second engine is listening, so this unblocks the router&#x27;s acceptance test rather than following from it.&quot;}">glm-53-serve-and-wiring</li>
  <li data-slug="dsv41-flash-four-card-throughput" data-item="{&quot;capability&quot;: {&quot;class&quot;: &quot;orchestrator&quot;, &quot;requirements&quot;: {&quot;reasoning&quot;: &quot;deep&quot;, &quot;risk&quot;: &quot;moderate&quot;, &quot;verification&quot;: &quot;strict&quot;}, &quot;version&quot;: &quot;1.0&quot;}, &quot;done_when&quot;: &quot;Both decisions are locked from the record rather than from a measurement; if the plan proceeds, real clive workers have run sustained multi-turn work against a V4.1 serve with per-worker decode binned by concurrency and the prefill rate recorded beside it, and a windowed internal prefix-cache hit rate taken as a distribution of per-interval deltas at a stated concurrency; and the four-card V4.1 question is either closed with a recorded measurement or returned to the lead with one.&quot;, &quot;effort_hours&quot;: 6, &quot;slug&quot;: &quot;dsv41-flash-four-card-throughput&quot;, &quot;why_now&quot;: &quot;The four-card V4.1 question has been raised three times and closed twice on judgement rather than on a number. The prior plan&#x27;s concurrency and single-stream sweeps are landed and must not be repeated; its one unrun section - real agent traffic - is the only measurement that could overturn the close, and it is now framed against a lane whose measured bottleneck is prefix turnover, which is exactly what V4.1&#x27;s 5.3x larger pool would act on.&quot;}">dsv41-flash-four-card-throughput</li>
  <li data-slug="dsv41-serve-tuning-for-concurrency" data-item="{&quot;capability&quot;: {&quot;class&quot;: &quot;orchestrator&quot;, &quot;requirements&quot;: {&quot;reasoning&quot;: &quot;deep&quot;, &quot;risk&quot;: &quot;moderate&quot;, &quot;verification&quot;: &quot;strict&quot;}, &quot;version&quot;: &quot;1.0&quot;}, &quot;done_when&quot;: &quot;Restart A lands DSpark plus hicache_ratio 2.0 and memory 480G, through a four-card rotation where cards allow or a coordinated eight-minute dispatch hold otherwise, and is proven by a real multi-hundred-token generation rather than a readiness probe, with draft acceptance rate, mean accept length, post-workspace free device memory and per-worker plus aggregate output at a stated width recorded; restart B raises max_total_tokens to a value justified by restart A&#x27;s measured free memory with pool occupancy re-read afterwards; the explicit non-levers are recorded with their reasons; and the two-replica eight-card option remains gated on session-affinity routing rather than launched.&quot;, &quot;effort_hours&quot;: 5, &quot;slug&quot;: &quot;dsv41-serve-tuning-for-concurrency&quot;, &quot;why_now&quot;: &quot;The prefix repair landed tonight and took aggregate output from 32.9 to 330 tok/s, which inverted which serve parameters matter: the device pool reads 52-54% occupied at 27 concurrent while the host tier measured 100,308 writes against 56 read-backs. DSpark was refused twice on device memory that is now free at 52.04 GB, so the one untried throughput lever is available for the first time and the configuration the lane is running was sized for a bottleneck that no longer exists.&quot;}">dsv41-serve-tuning-for-concurrency</li>
  </ol>
