  <script type="application/json" id="reckon-resource-state">{"description":"Move machine-description production out of the physics solver and into a data layer that is measured before it is built. First the read-rate evidence: what IMAS-netCDF, zarr carrying DD-path metadata, and the native level-2 form each cost the GPU training path, for static description and streamed experimental data separately. Then the producer that evidence licenses: declared machine maps applied by transform engines scoped to store format, so adding a machine costs a map and adding a store costs one engine. Geometry stays a function of shot through named transitions in the shot manifest, and identity is asserted as determinism, partition consistency and visible change rather than a global digest a changing machine cannot satisfy. Supersedes the intent of the dangling mast-machine-configuration-map item in S17.","ends":"2026-09-13","id":"S22","items":[{"capability":{"class":"general","requirements":{"reasoning":"deep","verification":"strict"},"version":"1.0"},"done_when":"Three arms measured across four access patterns plus the live-versus-mapped transport comparison on one node class, the IDSTensorizer subclassing seam verified or refuted, and a proposal naming a storage format for machine description and for experimental data separately with the numbers that decide each.","slug":"training-store-read-benchmark","why_now":"Every other property of a store is affordable only if it keeps four H200s fed; the format decision must be made on measured read rates, not on which container is most standard."},{"capability":{"class":"general","requirements":{"reasoning":"deep","verification":"strict"},"version":"1.0"},"done_when":"A LinkML machine-map schema with MAST and DIII-D maps, transform engines for the formats the benchmark selected, the shot manifest extended with named geometry transitions, the three identity assertions tested over a real multi-campaign corpus, and description emitted for both machines through one code path with no machine-specific reader left.","slug":"machine-map-transform-engine","why_now":"A reader per machine re-derives storage, semantics and reshaping every time; declared maps plus format-scoped engines make machines and stores vary independently, and the per-campaign geometry table and shot manifest already carry half of what this needs."},{"capability":{"class":"general","requirements":{"reasoning":"deep","verification":"strict"},"version":"1.0"},"done_when":"MAST's source convention identified as a COCOS number or explicitly recorded as not COCOS-expressible, asserted against real level-2 data at both current polarities with the per-quantity sign table printed; the Sauter coefficient set and derived factors to COCOS-17 committed as data; the transform applied in the engine for every COCOS-dependent target the catalog binds, with an undeclared source convention on such a target failing loudly; and a both-polarity round-trip test recovering source values.","slug":"machine-map-cocos-transform","why_now":"The engine now writes to Data Dictionary paths, which is exactly the IMAS ingestion seam the MAST COCOS evaluation flagged as the latent sign risk; the map binds probe orientation angles the DD marks COCOS-dependent, so a name map without a convention transform is a silent sign error rather than a missing feature."}],"starts":"2026-08-17","status":"done","summary":"SHIPPED 3/3 plans, 57 worker commits, 0 wiring findings. THE FORMAT QUESTION IS ANSWERED AND LOCKED: DD-annotated zarr reads 9.02-10.28x native level-2 and ~3.2x IMAS-netCDF, invariant across 36 cells spanning a 64x payload range with ZERO crossings, so experimental data is locked to zarr carrying DD paths; machine description is left to the owner with evidence attached because its cost amortises to nothing and the choice is publishability, not speed. The finding that separates them: the IMAS shape costs about 3.2x as STORAGE and about nothing as INTERCHANGE, because the DD tensorization logic is reusable by subclass into a non-IMAS container. Transport measures 41.1x login / 129.1x on the storage-arm node class, the earlier 481x having been an artifact of comparing arrays of different length. THE PRODUCER IS BUILT AND VERIFIED AGAINST ITS CONSUMER: 2 format-scoped engines with 0 machine-name conditionals, 254 executable bindings plus qualifications over magnetics, pf_active, pf_passive and wall, and an adapter whose operator is STRUCTURALLY IDENTICAL to the legacy one — channel order, plasma grid, limiter mask, 251 columns and the 21/84/146 block split all exact, 0 non-finite entries, 0 unattributed metrics. Identity holds without a global digest: byte-identical re-emission, every one of 11,573 corpus shots resolving to exactly one range, and a non-empty inspectable diff at the real boundary. FOUR CONCLUSIONS WERE RETRACTED ON OWNER CHALLENGE and the pattern matters more than any one: three came from searching the Data Dictionary under the SOURCE's naming and recording 'unrepresentable' on failing to find it — a saddle is filed as a loop TYPE, a parallelogram as an oblique PRIMITIVE, drive as a CIRCUIT concept. The fourth, that mesh resolution is not geometry, collapsed 11 declared transitions to 2. TWO LIVE DEFECTS WERE FOUND IN SHIPPED CODE: the declared MAST coordinate convention, now recorded as a DECLARED ASSUMPTION of COCOS 3 with the measured sigma_Bp kept separately marked as measured; and a netCDF engine that collapsed any one-element structural array to a scalar. A THIRD, DEEPER DEFECT WAS FOUND UNDER THE BASELINE ITSELF: the frozen reference residual was produced with a sensor identity join that aliased 8 co-located acquisition addresses onto one reconstruction index, 37 of 50 loop rows misjoined across three shots with 2 of them silent. Level-1 versus level-2 was disentangled to a positional difference confined to flux loops, with the processed store exactly coincident with the reconstruction on the worst case and the
