  <script type="application/json" id="reckon-resource-state">{"capacity": {"total_hours": 11, "unit": "worker-hours"}, "description": "The serve already runs a recorder that samples /metrics every five seconds for the life of the job, and it has been writing fourteen null fields across 13,791 rows because it parses only vLLM metric names against an SGLang engine. This sprint makes that recorder the single generator: both engine families behind one shared owner, the GPU cards, host and node job table added from local probes the node makes free, tiered rotation from five-second detail to an indefinite hourly trend, a disposable reader-side index, and per-request receipts from the router. The workstation watcher moves in as an agent subcommand and stops keeping a second, partial copy of the same record. Closed 2026-09-24 with its plan moved out, not with its work finished. This sprint was first marked done on the strength of its plan reading shipped at impl 1.0; its own done-when required that `imas-ambix agent watch` render every panel from the record, and that command was measured timing out at 110 s twice against the real record, with a staged probe printing nothing, so it stalls before the first instrumented stage. The recorder half is deep and verified at 7,324 of 7,324 relayed inferences carrying tokens against 0 of 87 before. The reader half has never been seen to render. serve-telemetry-spine therefore carries an honest status in S27 rather than a shipped one here.", "ends": "", "id": "S25", "items": [{"done_when": "Both engine families resolve through one shared module; card, host and job-table sections are recorded from on-node probes; raw samples compact through minute and hour tiers; imas-ambix agent watch renders every panel from the record and spawns no sampler step for the serve's cards; the router writes one receipt per completed request; whole-tree lint exits 0.", "slug": "serve-telemetry-spine", "why_now": "The canonical recorder is already running wi
