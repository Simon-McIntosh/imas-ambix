<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid generative state-estimation architecture</title>
  <desc id="desc">Actuator trajectories and stochastic transferable closures drive Nova. Nova predicts equilibria and diagnostics. Signal innovations condition the ensemble in Ambix. The same posterior supports forecast, reconstruction, smoothing, and generated diagnostic products.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .box { rx: 18; ry: 18; stroke-width: 2.5; }
      .physics { fill: #e0f2fe; stroke: #0369a1; }
      .learned { fill: #f3e8ff; stroke: #7e22ce; }
      .data { fill: #dcfce7; stroke: #15803d; }
      .output { fill: #fff7ed; stroke: #c2410c; }
      .title { font: 700 27px system-ui, sans-serif; fill: #0f172a; }
      .label { font: 700 22px system-ui, sans-serif; fill: #0f172a; }
      .body { font: 18px system-ui, sans-serif; fill: #334155; }
      .small { font: 16px system-ui, sans-serif; fill: #475569; }
      .flow { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .innovation { fill: none; stroke: #7e22ce; stroke-width: 4; stroke-dasharray: 11 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="700" y="44" text-anchor="middle" class="title">One physics-led generative model, three conditionings</text>

  <rect x="40" y="105" width="280" height="150" class="box data"/>
  <text x="180" y="145" text-anchor="middle" class="label">Scenario</text>
  <text x="180" y="181" text-anchor="middle" class="body">machine geometry</text>
  <text x="180" y="211" text-anchor="middle" class="body">coil + actuator trajectory</text>
  <text x="180" y="239" text-anchor="middle" class="small">known future commands when available</text>

  <rect x="395" y="85" width="305" height="190" class="box learned"/>
  <text x="548" y="129" text-anchor="middle" class="label">Transferable uncertainty</text>
  <text x="548" y="166" text-anchor="middle" class="body">transport + closure coefficients</text>
  <text x="548" y="196" text-anchor="middle" class="body">sources + boundary decisions</text>
  <text x="548" y="226" text-anchor="middle" class="body">topology branch where required</text>
  <text x="548" y="255" text-anchor="middle" class="small">sampled, learned, distilled from surprise</text>

  <rect x="775" y="85" width="270" height="190" class="box physics"/>
  <text x="910" y="129" text-anchor="middle" class="label">Nova transition</text>
  <text x="910" y="166" text-anchor="middle" class="body">force balance + conservation</text>
  <text x="910" y="196" text-anchor="middle" class="body">circuits + transport + geometry</text>
  <text x="910" y="226" text-anchor="middle" class="body">equilibrium + observation map</text>
  <text x="910" y="255" text-anchor="middle" class="small">fast, validated, machine portable</text>

  <rect x="1115" y="105" width="245" height="150" class="box data"/>
  <text x="1238" y="145" text-anchor="middle" class="label">Signals</text>
  <text x="1238" y="181" text-anchor="middle" class="body">magnetics + profiles</text>
  <text x="1238" y="211" text-anchor="middle" class="body">flux-surface averages</text>
  <text x="1238" y="239" text-anchor="middle" class="small">cameras and other diagnostics</text>

  <path d="M320 180 H395" class="flow"/>
  <path d="M700 180 H775" class="flow"/>
  <path d="M1045 180 H1115" class="flow"/>

  <rect x="430" y="365" width="540" height="155" class="box learned"/>
  <text x="700" y="407" text-anchor="middle" class="label">Ambix ensemble conditioning</text>
  <text x="700" y="445" text-anchor="middle" class="body">innovation = measured signals − Nova observation</text>
  <text x="700" y="477" text-anchor="middle" class="body">update latent state, closures, sources, boundaries and branch weights</text>
  <text x="700" y="505" text-anchor="middle" class="small">calibration, OOD detection and attribution prevent false discovery</text>

  <path d="M1238 255 V330 H970 V405" class="innovation"/>
  <path d="M545 365 V300 H548 V275" class="innovation"/>

  <rect x="42" y="610" width="290" height="110" class="box output"/>
  <text x="187" y="652" text-anchor="middle" class="label">Forecast</text>
  <text x="187" y="685" text-anchor="middle" class="body">causal future ensemble</text>
  <text x="187" y="711" text-anchor="middle" class="small">observations withheld</text>

  <rect x="385" y="610" width="290" height="110" class="box output"/>
  <text x="530" y="652" text-anchor="middle" class="label">Reconstruction</text>
  <text x="530" y="685" text-anchor="middle" class="body">causal filtered state</text>
  <text x="530" y="711" text-anchor="middle" class="small">signals through the current time</text>

  <rect x="728" y="610" width="290" height="110" class="box output"/>
  <text x="873" y="652" text-anchor="middle" class="label">Smoothing</text>
  <text x="873" y="685" text-anchor="middle" class="body">non-causal reanalysis</text>
  <text x="873" y="711" text-anchor="middle" class="small">future signals condition the past</text>

  <rect x="1071" y="610" width="290" height="110" class="box output"/>
  <text x="1216" y="652" text-anchor="middle" class="label">Generative products</text>
  <text x="1216" y="685" text-anchor="middle" class="body">equilibria + diagnostics</text>
  <text x="1216" y="711" text-anchor="middle" class="small">camera streams are a by-product</text>

  <path d="M700 520 V566 H187 V610" class="flow"/>
  <path d="M700 520 V566 H530 V610" class="flow"/>
  <path d="M700 520 V566 H873 V610" class="flow"/>
  <path d="M700 520 V566 H1216 V610" class="flow"/>
</svg>
