<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430"
     font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6470"/>
    </marker>
  </defs>

  <text x="0" y="16" font-size="14" font-weight="600" fill="#1a1d21">Today — the fleet shares a four-core slice with everything else on the login node</text>

  <rect x="0" y="34" width="300" height="118" fill="#fff" stroke="#c0392b" stroke-width="1.5" rx="3"/>
  <text x="14" y="56" font-size="13.5" font-weight="600" fill="#1a1d21">98dci4-srv-1006 · login node</text>
  <text x="14" y="78" font-size="13" fill="#1a1d21">~30 clive sessions</text>
  <text x="14" y="97" font-size="13" fill="#1a1d21">each + reckon mcp + imas-codex serve</text>
  <text x="14" y="121" font-size="13" font-weight="600" fill="#c0392b">CPUQuota 400% = 4 cores, whole user slice</text>
  <text x="14" y="140" font-size="13" fill="#c0392b">57 core-days throttled over 41 days up</text>

  <line x1="300" y1="93" x2="560" y2="93" stroke="#5b6470" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="352" y="86" font-size="13" fill="#3c4450">inference requests</text>

  <rect x="570" y="34" width="330" height="118" fill="#fff" stroke="#8a9099" stroke-width="1" rx="3"/>
  <text x="584" y="56" font-size="13.5" font-weight="600" fill="#1a1d21">98dci4-gpu-0003 · betelgeuse</text>
  <text x="584" y="78" font-size="13" fill="#1a1d21">8 × H200 · 64 cores · 1.5 TB</text>
  <text x="584" y="97" font-size="13" fill="#1a1d21">ambix-router, deepseek-v4.1-flash</text>
  <text x="584" y="121" font-size="13" fill="#3c4450">CPUs reserved (gpu_0003_grpA)</text>
  <text x="584" y="140" font-size="13" fill="#3c4450">serving, not orchestration</text>

  <line x1="0" y1="188" x2="900" y2="188" stroke="#d5d8dc" stroke-width="1"/>

  <text x="0" y="222" font-size="14" font-weight="600" fill="#1a1d21">Proposed — the fleet holds its own allocation; the login node keeps only terminals</text>

  <rect x="0" y="240" width="176" height="96" fill="#fff" stroke="#8a9099" stroke-width="1" rx="3"/>
  <text x="14" y="262" font-size="13.5" font-weight="600" fill="#1a1d21">login node</text>
  <text x="14" y="284" font-size="13" fill="#1a1d21">terminals, git, editors</text>
  <text x="14" y="303" font-size="13" fill="#1a1d21">zellij clients only</text>

  <line x1="176" y1="288" x2="236" y2="288" stroke="#5b6470" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="180" y="281" font-size="12.5" fill="#3c4450">ssh</text>

  <rect x="246" y="240" width="284" height="140" fill="#fff" stroke="#1d7a6c" stroke-width="1.5" rx="3"/>
  <text x="260" y="262" font-size="13.5" font-weight="600" fill="#1a1d21">rigel allocation · MaxTime UNLIMITED</text>
  <text x="260" y="284" font-size="13" fill="#1a1d21">28 cores · 128 GB · one node</text>
  <text x="260" y="303" font-size="13" fill="#1a1d21">zellij servers + clive fleet</text>
  <text x="260" y="327" font-size="13" font-weight="600" fill="#1d7a6c">51 of 61 nodes idle, load 0.00–0.14</text>
  <text x="260" y="346" font-size="13" fill="#1d7a6c">7 × the cores, no queue</text>
  <text x="260" y="369" font-size="12.5" fill="#c0392b">job ends → cgroup kills the fleet</text>

  <line x1="530" y1="288" x2="560" y2="288" stroke="#5b6470" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="570" y="240" width="330" height="96" fill="#fff" stroke="#8a9099" stroke-width="1" rx="3"/>
  <text x="584" y="262" font-size="13.5" font-weight="600" fill="#1a1d21">betelgeuse — unchanged</text>
  <text x="584" y="284" font-size="13" fill="#1a1d21">serving only; its 64 cores stay</text>
  <text x="584" y="303" font-size="13" fill="#1a1d21">with the model, not the fleet</text>
</svg>
