<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img"
     style="max-width:100%;height:auto"
     aria-label="Six cumulative throttle readings of the login slice in the order taken. Green ring: 0.3366, the recorded baseline. Purple ring: 0.3690, the window-start sample committed by this node. The series is a running total since boot, so the move between the two is not attributable to the window.">
  <rect x="0" y="0" width="760" height="300" fill="#ffffff"/>
  <g stroke="#d9d9d9" stroke-width="1">
    <line x1="60" y1="218" x2="730" y2="218"/>
    <line x1="60" y1="166" x2="730" y2="166"/>
    <line x1="60" y1="113" x2="730" y2="113"/>
  </g>
  <g fill="#444444" font-family="sans-serif" font-size="11" text-anchor="end">
    <text x="52" y="222">0.340</text>
    <text x="52" y="170">0.350</text>
    <text x="52" y="117">0.360</text>
  </g>
  <polyline points="110,236 226,233 342,230 458,221 574,175 690,66"
            fill="none" stroke="#8a9bb0" stroke-width="2"/>
  <circle cx="110" cy="236" r="4.5" fill="#1a6b2e"/>
  <circle cx="226" cy="233" r="4.5" fill="#4a7ebb"/>
  <circle cx="342" cy="230" r="4.5" fill="#4a7ebb"/>
  <circle cx="458" cy="221" r="4.5" fill="#c25a1a"/>
  <circle cx="574" cy="175" r="4.5" fill="#4a7ebb"/>
  <circle cx="690" cy="66" r="4.5" fill="#6a4ea8"/>
  <circle cx="110" cy="236" r="9.5" fill="none" stroke="#1a6b2e" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="690" cy="66" r="9.5" fill="none" stroke="#6a4ea8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <g fill="#243f63" font-family="sans-serif" font-size="12" text-anchor="middle">
    <text x="110" y="223">0.3366</text>
    <text x="226" y="220">0.3373</text>
    <text x="342" y="217">0.3378</text>
    <text x="458" y="208">0.3396</text>
    <text x="574" y="162">0.3483</text>
    <text x="690" y="53">0.3690</text>
  </g>
  <text x="110" y="262" fill="#1a6b2e" font-family="sans-serif" font-size="11" text-anchor="middle">the baseline recorded</text>
  <text x="110" y="276" fill="#1a6b2e" font-family="sans-serif" font-size="11" text-anchor="middle">by the first step</text>
  <text x="342" y="262" fill="#7a7a7a" font-family="sans-serif" font-size="11" text-anchor="middle">three earlier readings,</text>
  <text x="342" y="276" fill="#7a7a7a" font-family="sans-serif" font-size="11" text-anchor="middle">one carried forward in error</text>
  <text x="690" y="262" fill="#6a4ea8" font-family="sans-serif" font-size="11" text-anchor="end">the window-start sample</text>
  <text x="690" y="276" fill="#6a4ea8" font-family="sans-serif" font-size="11" text-anchor="end">committed by this node</text>
  <text x="16" y="150" fill="#333333" font-family="sans-serif" font-size="11" text-anchor="middle" transform="rotate(-90 16 150)">cumulative throttled share of permitted thread-time</text>
  <text x="60" y="292" fill="#7a7a7a" font-family="sans-serif" font-size="10" text-anchor="start">Readings in the order taken; the series is a running total since boot, so the move between the two marked points is not attributable to the window.</text>
</svg>