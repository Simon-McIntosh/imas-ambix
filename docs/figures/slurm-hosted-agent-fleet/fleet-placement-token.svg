<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" role="img"
     aria-labelledby="pt-t" font-family="system-ui, sans-serif">
  <title id="pt-t">How a placed clive worker reaches the allocation, by resolved token</title>
  <defs>
    <marker id="pt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"></path>
    </marker>
  </defs>

  <rect x="16" y="16" width="236" height="128" rx="8" fill="#f6f7f9" stroke="#c8ccd2"></rect>
  <text x="34" y="42" font-size="14" font-weight="600" fill="#222">Login node</text>
  <text x="34" y="62" font-size="12" fill="#555">98dci4-srv-1006 · four-core slice</text>
  <text x="34" y="86" font-size="11" fill="#333">imas-ambix agent fleet place --</text>
  <text x="46" y="102" font-size="11" fill="#333">clive --model …</text>
  <text x="34" y="126" font-size="11" fill="#777">the coordinator spawns the wrapper</text>

  <rect x="282" y="16" width="236" height="196" rx="8" fill="#eef3fb" stroke="#b9c8de"></rect>
  <text x="300" y="42" font-size="14" font-weight="600" fill="#1d3557">Wrapper · fleet place</text>
  <text x="300" y="66" font-size="11" fill="#333">squeue -h -u $USER -A iter \</text>
  <text x="312" y="82" font-size="11" fill="#333">-o "%i|%j|%T|…|%k|%L"</text>
  <text x="300" y="106" font-size="11" fill="#333">find_fleet_allocation(rows)</text>
  <text x="312" y="122" font-size="11" fill="#555">match %k == "ambix-fleet"</text>
  <line x1="300" y1="136" x2="500" y2="136" stroke="#c8ccd2"></line>
  <text x="300" y="156" font-size="11" fill="#1b5e20">match → job id from the row</text>
  <text x="300" y="172" font-size="11" fill="#555">no identifier in any config file</text>
  <text x="300" y="196" font-size="11" fill="#a11">no match → refuse, exit nonzero</text>

  <rect x="548" y="16" width="196" height="128" rx="8" fill="#f6f7f9" stroke="#c8ccd2"></rect>
  <text x="566" y="42" font-size="14" font-weight="600" fill="#222">Compute node</text>
  <text x="566" y="62" font-size="12" fill="#555">98dci4-clu-2002 · 28 cores</text>
  <text x="566" y="86" font-size="11" fill="#333">srun --overlap --jobid=&lt;row&gt;</text>
  <text x="578" y="102" font-size="11" fill="#333">clive …</text>
  <text x="566" y="126" font-size="11" fill="#777">inside the allocation's group</text>

  <g fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#pt-arrow)">
    <line x1="252" y1="80" x2="278" y2="80"></line>
    <line x1="518" y1="108" x2="544" y2="108"></line>
    <line x1="646" y1="144" x2="646" y2="176"></line>
  </g>
  <text x="528" y="100" font-size="10" fill="#666">resolved</text>

  <rect x="548" y="180" width="196" height="72" rx="8" fill="#fdf6e3" stroke="#e0d3a8"></rect>
  <text x="566" y="204" font-size="12" font-weight="600" fill="#6b5200">Router · 98dci4-gpu-0003</text>
  <text x="566" y="224" font-size="11" fill="#555">same fabric, no tunnel</text>
  <text x="566" y="242" font-size="11" fill="#555">the wrapped command is unchanged</text>

  <text x="16" y="292" font-size="11" fill="#777">A resubmit, a cancel-and-rehold or a move to another node changes the row; the wrapper reads the fresh row at</text>
  <text x="16" y="310" font-size="11" fill="#777">launch. A literal job id in the configuration would go stale silently: the worker would land back on the login</text>
  <text x="16" y="328" font-size="11" fill="#777">node and every record would still report it as placed.</text>
</svg>