<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img"
     style="max-width:100%;height:auto"
     aria-label="Five cumulative throttle readings in the order taken. Green ring: 0.3366, the recorded baseline. Orange ring: 0.3396, carried forward as the baseline. 0.3483 is 3.5 per cent above 0.3366.">
  <rect x="0" y="0" width="760" height="300" fill="#ffffff"/>
  <g stroke="#d9d9d9" stroke-width="1">
    <line x1="60" y1="216" x2="730" y2="216"/>
    <line x1="60" y1="172" x2="730" y2="172"/>
    <line x1="60" y1="128" x2="730" y2="128"/>
    <line x1="60" y1="84" x2="730" y2="84"/>
  </g>
  <g fill="#444444" font-family="sans-serif" font-size="11" text-anchor="end">
    <text x="52" y="220">0.336</text>
    <text x="52" y="176">0.340</text>
    <text x="52" y="132">0.344</text>

    <text x="52" y="88">0.348</text>
  </g>
  <polyline points="130,209 265,202 400,196 540,176 665,81" fill="none" stroke="#8a9bb0" stroke-width="2"/>
  <circle cx="130" cy="209" r="4.5" fill="#1a6b2e"/>
  <circle cx="265" cy="202" r="4.5" fill="#4a7ebb"/>
  <circle cx="400" cy="196" r="4.5" fill="#4a7ebb"/>
  <circle cx="540" cy="176" r="4.5" fill="#c25a1a"/>
  <circle cx="665" cy="81" r="4.5" fill="#4a7ebb"/>
  <circle cx="130" cy="209" r="9.5" fill="none" stroke="#1a6b2e" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="540" cy="176" r="9.5" fill="none" stroke="#c25a1a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <g fill="#243f63" font-family="sans-serif" font-size="12" text-anchor="middle">
    <text x="130" y="197">0.3366</text>
    <text x="265" y="190">0.3373</text>
    <text x="400" y="184">0.3378</text> 
    <text x="665" y="69">0.3483</text>
  </g>
  <text x="528" y="162" fill="#243f63" font-family="sans-serif" font-size="12" text-anchor="end">0.3396</text>
  <text x="665" y="94" fill="#243f63" font-family="sans-serif" font-size="12" text-anchor="middle">+3.5 per cent on 0.3366</text> 
  <text x="130" y="240" fill="#1a6b2e" font-family="sans-serif" font-size="11" text-anchor="middle">the baseline recorded</text>
  <text x="130" y="254" fill="#1a6b2e" font-family="sans-serif" font-size="11" text-anchor="middle">by the first step</text>
  <text x="330" y="240" fill="#7a7a7a" font-family="sans-serif" font-size="11" text-anchor="middle">two earlier readings</text>
  <text x="540" y="240" fill="#c25a1a" font-family="sans-serif" font-size="11" text-anchor="middle">read at 2026-09-21T11:44:20Z,</text>
  <text x="540" y="254" fill="#c25a1a" font-family="sans-serif" font-size="11" text-anchor="middle">then carried forward as the baseline</text>
  <text x="16" y="150" fill="#333333" font-family="sans-serif" font-size="11" text-anchor="middle" transform="rotate(-90 16 150)">cumulative throttled share of permitted thread-time</text>
</svg>
