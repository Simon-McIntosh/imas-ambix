<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" width="100%" style="max-width:960px;height:auto"
     aria-label="Timeline from 2026-09-18 to 2026-09-22: five recorded teardowns or fleet losses between 00:57:08 on 18 September and 02:31:11 on 20 September, the fixture correction at 15:06:18 on 20 September, and an unbroken active interval for user@39486.service from 15:34:42 on 20 September to the reading on 22 September">
  <title>Recorded teardowns stop at the fixture correction</title>
  <text x="90" y="24" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#222">Recorded teardowns stop at the fixture correction</text>
  <text x="90" y="44" font-family="system-ui, sans-serif" font-size="12" fill="#555">Local time (CEST). Markers 1&#8211;5 are the occurrences of 2026-09-18 and 2026-09-20; the bar is the interval with no further user-manager teardown.</text>

  <!-- occurrence markers -->
  <g fill="#1a5f8a">
    <circle cx="96.7" cy="170" r="9"/>
    <circle cx="130.5" cy="170" r="9"/>
    <circle cx="229.6" cy="170" r="9"/>
    <circle cx="248.2" cy="170" r="9"/>
    <circle cx="443.6" cy="170" r="9"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#fff" text-anchor="middle">
    <text x="96.7" y="174">1</text>
    <text x="130.5" y="174">2</text>
    <text x="229.6" y="174">3</text>
    <text x="248.2" y="174">4</text>
    <text x="443.6" y="174">5</text>
  </g>
  <g stroke="#1a5f8a" stroke-width="1">
    <line x1="96.7" y1="161" x2="96.7" y2="116"/>
    <line x1="130.5" y1="161" x2="130.5" y2="140"/>
    <line x1="229.6" y1="161" x2="229.6" y2="116"/>
    <line x1="248.2" y1="161" x2="248.2" y2="140"/>
    <line x1="443.6" y1="161" x2="443.6" y2="116"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#1a5f8a" text-anchor="middle">
    <text x="96.7" y="111">00:57:08 teardown</text>
    <text x="130.5" y="135">05:46:41 teardown</text>
    <text x="229.6" y="111">19:56:22 fleet lost</text>
    <text x="248.2" y="135">22:36:23 fleet lost</text>
    <text x="443.6" y="111">02:31:11 teardown + fleet lost</text>
  </g>

  <!-- fixture correction -->
  <polygon points="531.7,161 540.7,170 531.7,179 522.7,170" fill="#b45309"/>
  <line x1="531.7" y1="161" x2="531.7" y2="140" stroke="#b45309" stroke-width="1"/>
  <text x="531.7" y="135" font-family="system-ui, sans-serif" font-size="11" fill="#b45309" text-anchor="middle">15:06:18 fixture corrected</text>

  <!-- axis -->
  <line x1="90" y1="170" x2="930" y2="170" stroke="#999" stroke-width="1"/>
  <g stroke="#bbb" stroke-width="1">
    <line x1="90" y1="170" x2="90" y2="178"/>
    <line x1="258" y1="170" x2="258" y2="178"/>
    <line x1="426" y1="170" x2="426" y2="178"/>
    <line x1="594" y1="170" x2="594" y2="178"/>
    <line x1="762" y1="170" x2="762" y2="178"/>
    <line x1="930" y1="170" x2="930" y2="178"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#555" text-anchor="middle">
    <text x="90" y="190">Sep 18</text>
    <text x="258" y="190">Sep 19</text>
    <text x="426" y="190">Sep 20</text>
    <text x="594" y="190">Sep 21</text>
    <text x="762" y="190">Sep 22</text>
    <text x="930" y="190">Sep 23</text>
  </g>

  <!-- unbroken active interval -->
  <line x1="535.1" y1="179" x2="535.1" y2="198" stroke="#15803d" stroke-width="1" stroke-dasharray="3 2"/>
  <rect x="535.1" y="198" width="370.4" height="16" rx="3" fill="#15803d" opacity="0.9"/>
  <text x="545" y="210" font-family="system-ui, sans-serif" font-size="11" fill="#fff">no teardown recorded &#8212; 2 d 5 h active</text>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#15803d">
    <text x="535.1" y="234">user@39486.service continuously active since 2026-09-20 15:34:42 CEST</text>
    <text x="535.1" y="250">&#8212; Linger=yes, 14 sessions held (read 2026-09-22 20:30 CEST).</text>
  </g>
  <text x="90" y="278" font-family="system-ui, sans-serif" font-size="12" fill="#555">Occurrences 1&#8211;5: two read from the system journal, two reconstructed from file modification times, and the last recorded live</text>
  <text x="90" y="294" font-family="system-ui, sans-serif" font-size="12" fill="#555">by the signal canary and topology sampler. Nothing was recorded in the 12.5 hours before the correction either; the quiet</text>
  <text x="90" y="310" font-family="system-ui, sans-serif" font-size="12" fill="#555">interval above is the first that has held for more than a few hours, against two teardowns inside five hours earlier in the record.</text>
</svg>