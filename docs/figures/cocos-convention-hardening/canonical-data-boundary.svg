<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Immutable source data mapped lazily into the Ambix canonical contract</title>
  <desc id="desc">Imas-codex and Nova evidence is distilled into small versioned Ambix maps. Ambix compiles a shot-specific affine transform and applies it only to requested Zarr slices, serving Data Dictionary version 4.1.1 and COCOS 17 without modifying the physical store.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#52606d"/>
    </marker>
    <style>
      .title { font: 700 22px system-ui, sans-serif; fill: #17212b; }
      .head { font: 700 16px system-ui, sans-serif; fill: #17212b; }
      .body { font: 14px system-ui, sans-serif; fill: #263746; }
      .small { font: 12px system-ui, sans-serif; fill: #52606d; }
      .box { stroke-width: 2; rx: 12; ry: 12; }
      .arrow { stroke: #52606d; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect width="1200" height="620" fill="#f8fafc"/>
  <text x="600" y="38" text-anchor="middle" class="title">Ambix canonical data boundary: map the request, never rewrite the source</text>

  <rect x="35" y="85" width="245" height="180" class="box" fill="#eef5ff" stroke="#3374b5"/>
  <text x="157" y="116" text-anchor="middle" class="head">Immutable physical stores</text>
  <text x="58" y="148" class="body">FAIR-MAST Zarr</text>
  <text x="58" y="174" class="body">Facility DD artifacts</text>
  <text x="58" y="206" class="small">Read-only source convention</text>
  <text x="58" y="227" class="small">Raw bytes never rewritten</text>
  <text x="58" y="248" class="small">Metadata inspection reads no chunks</text>

  <rect x="35" y="350" width="245" height="175" class="box" fill="#fff7e8" stroke="#b87917"/>
  <text x="157" y="381" text-anchor="middle" class="head">Discovery evidence</text>
  <text x="58" y="414" class="body">imas-codex discovers bindings</text>
  <text x="58" y="440" class="body">Nova measures geometry</text>
  <text x="58" y="466" class="body">and calibration candidates</text>
  <text x="58" y="498" class="small">Opaque receipts; no runtime dependency</text>

  <rect x="390" y="120" width="330" height="360" class="box" fill="#f2edff" stroke="#7057b3"/>
  <text x="555" y="153" text-anchor="middle" class="head">Reviewed Ambix signal map</text>
  <text x="415" y="187" class="body">Git path: data/maps/&lt;machine&gt;/&lt;system&gt;.json</text>
  <text x="415" y="218" class="body">Semantic set version + canonical SHA-256</text>
  <line x1="415" y1="238" x2="695" y2="238" stroke="#a998d1"/>
  <text x="415" y="270" class="body">source group / array / unit / COCOS</text>
  <text x="415" y="297" class="body">DD target path / structure index / unit</text>
  <text x="415" y="324" class="body">unit and directed-axis factors</text>
  <text x="415" y="351" class="body">shot-valid affine calibration</text>
  <text x="415" y="378" class="body">evidence receipt and blocked signals</text>
  <text x="415" y="405" class="body">Standard Name: optional until accepted</text>
  <line x1="415" y1="425" x2="695" y2="425" stroke="#a998d1"/>
  <text x="555" y="453" text-anchor="middle" class="small">Ambix owns review, distillation, versioning, and application</text>

  <rect x="815" y="86" width="345" height="178" class="box" fill="#ecfbf3" stroke="#28845b"/>
  <text x="987" y="118" text-anchor="middle" class="head">Compile once per shot</text>
  <text x="840" y="151" class="body">Resolve validity intervals</text>
  <text x="840" y="178" class="body">Fuse unit × COCOS × calibration</text>
  <text x="840" y="205" class="body">O(1) semantic lookup</text>
  <text x="840" y="234" class="small">Hot loop receives scale + offset only</text>

  <rect x="815" y="350" width="345" height="175" class="box" fill="#ebf9fb" stroke="#26818d"/>
  <text x="987" y="382" text-anchor="middle" class="head">Lazy Virtual-Zarr-style view</text>
  <text x="840" y="416" class="body">Pass requested slice to physical array</text>
  <text x="840" y="443" class="body">Apply vectorised affine transform</text>
  <text x="840" y="470" class="body">Serve DD 4.1.1 / COCOS 17</text>
  <text x="840" y="499" class="small">Implicit whole reads and writes fail loudly</text>

  <path d="M280 175 C325 175, 340 225, 390 225" class="arrow"/>
  <path d="M280 438 C330 438, 340 392, 390 392" class="arrow dashed"/>
  <path d="M720 215 C760 215, 770 175, 815 175" class="arrow"/>
  <path d="M987 264 L987 350" class="arrow"/>
  <path d="M815 438 C770 438, 760 270, 720 270" class="arrow dashed"/>
  <text x="750" y="458" text-anchor="middle" class="small">target and transform metadata</text>

  <rect x="300" y="560" width="600" height="40" rx="20" fill="#17212b"/>
  <text x="600" y="586" text-anchor="middle" style="font:700 15px system-ui,sans-serif;fill:#ffffff">Canonical contract at every Ambix consumer: DDv4 + COCOS 17</text>
</svg>
