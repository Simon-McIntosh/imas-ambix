<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 640" font-family="system-ui, sans-serif">
  <!-- timeline axis -->
  <line x1="60" y1="70" x2="1020" y2="70" stroke="#888" stroke-width="1"/>
  <g font-size="13" fill="#333">
    <text x="80"  y="60">Aug</text>
    <text x="330" y="60">Sep</text>
    <text x="620" y="60">early Oct</text>
    <text x="855" y="60" font-weight="600">Oct 18</text>
    <text x="925" y="60">Oct 19–26</text>
  </g>
  <line x1="870" y1="70" x2="870" y2="600" stroke="#b3261e" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="876" y="90" font-size="13" fill="#b3261e">development close</text>
  <line x1="990" y1="70" x2="990" y2="600" stroke="#b3261e" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="996" y="90" font-size="13" fill="#b3261e" transform="rotate(90 996 90)">blind final (3 submissions)</text>

  <!-- lane labels -->
  <text x="20" y="150" font-size="14" font-weight="600" fill="#0b57d0">nova</text>
  <text x="20" y="165" font-size="12" fill="#555">deterministic forwards</text>
  <text x="20" y="360" font-size="14" font-weight="600" fill="#146c2e">ambix</text>
  <text x="20" y="375" font-size="12" fill="#555">inference + emission</text>

  <!-- nova lane -->
  <g font-size="13" fill="#222">
    <rect x="70"  y="120" width="150" height="58" fill="#fff" stroke="#0b57d0" stroke-width="1"/>
    <text x="78" y="138" font-weight="600">DIII-D machine</text>
    <text x="78" y="154" font-weight="600">description</text>
    <text x="78" y="170" fill="#555">shipped coils + wall</text>

    <rect x="70"  y="200" width="150" height="58" fill="#fff" stroke="#0b57d0" stroke-width="1"/>
    <text x="78" y="218" font-weight="600">response kernels</text>
    <text x="78" y="234" fill="#555">chord sampling,</text>
    <text x="78" y="250" fill="#555">Δ*ψ extraction</text>

    <rect x="330" y="120" width="140" height="58" fill="#fff" stroke="#0b57d0" stroke-width="1"/>
    <text x="338" y="138" font-weight="600">limiter-mode</text>
    <text x="338" y="154" font-weight="600">forward</text>
    <text x="338" y="170" fill="#555">topology receipts</text>

    <rect x="330" y="200" width="140" height="58" fill="#fff" stroke="#0b57d0" stroke-width="1"/>
    <text x="338" y="218" font-weight="600">passive circuit</text>
    <text x="338" y="234" font-weight="600">forwards</text>
    <text x="338" y="250" fill="#555">vessel eigenmodes</text>

    <rect x="540" y="160" width="150" height="58" fill="#fff" stroke="#0b57d0" stroke-width="1"/>
    <text x="548" y="178" font-weight="600">batched solve</text>
    <text x="548" y="194" font-weight="600">throughput</text>
    <text x="548" y="210" fill="#555">n=0 receipts, budget</text>
  </g>

  <!-- ambix lane -->
  <g font-size="13" fill="#222">
    <rect x="70"  y="330" width="150" height="58" fill="#fff" stroke="#146c2e" stroke-width="1"/>
    <text x="78" y="348" font-weight="600">ingest + label</text>
    <text x="78" y="364" font-weight="600">pedigree probe</text>
    <text x="78" y="380" fill="#555">doctrine locked</text>

    <rect x="70"  y="410" width="150" height="58" fill="#fff" stroke="#146c2e" stroke-width="1"/>
    <text x="78" y="428" font-weight="600">Thomson</text>
    <text x="78" y="444" font-weight="600">measurement models</text>
    <text x="78" y="460" fill="#555">pins, isoflux, validity</text>

    <rect x="330" y="330" width="140" height="58" fill="#fff" stroke="#146c2e" stroke-width="1"/>
    <text x="338" y="348" font-weight="600">closure calibration</text>
    <text x="338" y="364" fill="#555">extracted p′/FF′ →</text>
    <text x="338" y="380" fill="#555">dimensionless forms</text>

    <rect x="330" y="410" width="140" height="58" fill="#fff" stroke="#146c2e" stroke-width="1"/>
    <text x="338" y="428" font-weight="600">windowed smoother</text>
    <text x="338" y="444" fill="#555">+ hierarchical</text>
    <text x="338" y="460" fill="#555">nuisance fit</text>

    <rect x="540" y="330" width="140" height="58" fill="#fff" stroke="#146c2e" stroke-width="1"/>
    <text x="548" y="348" font-weight="600">limited-phase</text>
    <text x="548" y="364" font-weight="600">traversal</text>
    <text x="548" y="380" fill="#555">ramp dynamics</text>

    <rect x="540" y="410" width="140" height="58" fill="#fff" stroke="#146c2e" stroke-width="1"/>
    <text x="548" y="428" font-weight="600">amortizer</text>
    <text x="548" y="444" fill="#555">token-substrate</text>
    <text x="548" y="460" fill="#555">warm start</text>

    <rect x="720" y="330" width="130" height="58" fill="#fff" stroke="#146c2e" stroke-width="1"/>
    <text x="728" y="348" font-weight="600">referee-emission</text>
    <text x="728" y="364" font-weight="600">layer</text>
    <text x="728" y="380" fill="#555">quarantined</text>

    <rect x="720" y="410" width="130" height="58" fill="#fff" stroke="#146c2e" stroke-width="1"/>
    <text x="728" y="428" font-weight="600">sealed zero-shot</text>
    <text x="728" y="444" font-weight="600">rehearsal</text>
    <text x="728" y="460" fill="#555">+ submission</text>
  </g>

  <!-- gates (diamonds) -->
  <g font-size="12">
    <polygon points="260,149 280,134 300,149 280,164" fill="#fff" stroke="#b3261e" stroke-width="1.2"/>
    <text x="252" y="185" fill="#b3261e">vacuum ψ check</text>
    <text x="252" y="199" fill="#b3261e">fail ⇒ stop entry</text>

    <polygon points="260,229 280,214 300,229 280,244" fill="#fff" stroke="#b3261e" stroke-width="1.2"/>
    <text x="252" y="265" fill="#b3261e">extraction round-trip</text>
    <text x="252" y="279" fill="#b3261e">fail ⇒ stop entry</text>

    <polygon points="500,359 520,344 540,359 520,374" fill="#fff" stroke="#b3261e" stroke-width="1.2"/>
    <text x="452" y="316" fill="#b3261e">held-out FF′ skill</text>
    <text x="452" y="330" fill="#b3261e">vs untuned closure</text>

    <polygon points="500,439 520,424 540,439 520,454" fill="#fff" stroke="#b3261e" stroke-width="1.2"/>
    <text x="470" y="490" fill="#b3261e" font-weight="600">flat-top floor bar</text>
    <text x="470" y="504" fill="#b3261e">= submittable; miss ⇒</text>
    <text x="470" y="518" fill="#b3261e">diagnose, no stretch</text>

    <polygon points="700,439 718,424 736,439 718,454" fill="#fff" stroke="#b3261e" stroke-width="1.2"/>
    <text x="670" y="490" fill="#b3261e">amortizer parity</text>
    <text x="670" y="504" fill="#b3261e">at ≥3× throughput</text>

    <polygon points="862,359 880,344 898,359 880,374" fill="#fff" stroke="#b3261e" stroke-width="1.2"/>
    <text x="800" y="316" fill="#b3261e">MAST path rung-2-free;</text>
    <text x="800" y="330" fill="#b3261e">pipeline freeze</text>
  </g>

  <!-- flows -->
  <g stroke="#777" stroke-width="1" fill="none" marker-end="url(#arr)">
    <path d="M220,149 L258,149"/>
    <path d="M300,149 L328,149"/>
    <path d="M220,229 L258,229"/>
    <path d="M300,229 L328,229"/>
    <path d="M470,149 C505,149 505,175 538,180"/>
    <path d="M470,229 C505,229 505,205 538,200"/>
    <!-- cross-lane -->
    <path d="M280,244 C280,300 300,330 328,352" stroke="#0b57d0" stroke-dasharray="5 3"/>
    <path d="M280,164 C265,250 190,300 178,328" stroke="#0b57d0" stroke-dasharray="5 3"/>
    <path d="M615,218 C615,270 480,390 472,425" stroke="#0b57d0" stroke-dasharray="5 3"/>
    <path d="M400,178 C420,270 560,300 585,328" stroke="#0b57d0" stroke-dasharray="5 3"/>
    <!-- ambix chain -->
    <path d="M145,388 L145,408"/>
    <path d="M220,359 L328,359"/>
    <path d="M220,439 L328,439"/>
    <path d="M400,388 L400,408"/>
    <path d="M540,359 L498,359"/>
    <path d="M470,439 L498,439"/>
    <path d="M540,439 L538,439"/>
    <path d="M680,439 L698,439"/>
    <path d="M736,439 L718,439"/>
    <path d="M610,388 L610,408" />
    <path d="M680,359 L718,359"/>
    <path d="M850,359 L860,359"/>
    <path d="M898,359 C920,359 920,420 852,438"/>
  </g>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#777"/>
    </marker>
  </defs>

  <!-- caption / legend -->
  <g font-size="12" fill="#555">
    <text x="60" y="560">solid arrows: execution order within a repository · dashed blue: cross-repository hand-off (nova forwards → ambix inference)</text>
    <text x="60" y="578">diamonds: decision gates with pre-registered tolerances · the flat-top floor bar is the minimum submittable entry; later boxes are the stretch ladder</text>
    <text x="60" y="596">sealed zero-shot rehearsal: pipeline frozen first, one pass against nova's own MAST reconstructions (MAST EFIT firewalled), no parameter feedback</text>
  </g>
</svg>
