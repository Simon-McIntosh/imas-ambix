<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 356" width="900" height="356" font-family="system-ui, sans-serif" font-size="14" fill="#1d1d1f">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/>
    </marker>
  </defs>
  <!-- storage tiers -->
  <text x="20" y="28" font-size="15" font-weight="600">GPFS — authority and durable copies</text>
  <line x1="20" y1="36" x2="880" y2="36" stroke="#929292" stroke-width="1"/>
  <line x1="20" y1="216" x2="880" y2="216" stroke="#929292" stroke-width="1"/>
  <text x="20" y="342" font-size="15" font-weight="600">fleet node — local disk (/tmp), derived and rebuildable</text>

  <!-- GPFS boxes -->
  <rect x="20" y="56" width="250" height="92" fill="#fff" stroke="#1d1d1f"/>
  <text x="32" y="78" font-weight="600">receipts (authority)</text>
  <text x="32" y="99">raw *.jsonl, append-only</text>
  <text x="32" y="118">closed days compressed</text>
  <text x="32" y="137">retired only on compaction proof</text>

  <rect x="330" y="56" width="250" height="92" fill="#fff" stroke="#1d1d1f"/>
  <text x="342" y="78" font-weight="600">index snapshots</text>
  <text x="342" y="99">daily, zstd, newest 3 kept</text>
  <text x="342" y="118">verified before an older</text>
  <text x="342" y="137">one is removed</text>

  <rect x="640" y="56" width="240" height="92" fill="#fff" stroke="#1d1d1f"/>
  <text x="652" y="78" font-weight="600">watch.json (9–12 KB)</text>
  <text x="652" y="99">read by gpu-watch and</text>
  <text x="652" y="118">by readers on other hosts</text>

  <!-- node box -->
  <rect x="20" y="236" width="560" height="78" fill="#fff" stroke="#2f6f9f" stroke-width="2"/>
  <text x="32" y="258" font-weight="600" fill="#2f6f9f">ambix-ingest — one process, the only writer</text>
  <text x="32" y="279">index: samples + hourly rollups, WAL journal</text>
  <text x="32" y="298">reads appended bytes only; publishes when due</text>

  <!-- arrows -->
  <line x1="120" y1="148" x2="120" y2="234" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="128" y="186">appended bytes</text>

  <line x1="400" y1="234" x2="400" y2="150" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="408" y="186">daily snapshot</text>
  <line x1="510" y1="150" x2="510" y2="234" stroke="#1d1d1f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="518" y="186">restore on a new node</text>

  <line x1="580" y1="270" x2="760" y2="150" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="690" y="235">every 300 s, read</text>
  <text x="690" y="254">from rollups, &lt; 5 s</text>
</svg>
