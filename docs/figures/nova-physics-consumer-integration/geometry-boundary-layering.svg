<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" role="img" aria-labelledby="gbtitle gbdesc">
  <title id="gbtitle">GeometryTable compatibility-boundary layering</title>
  <desc id="gbdesc">Nova resolves the machine artifact and description; one Ambix adapter builds a private hash-frozen compatibility kernel that fixes representation identity; three narrow projections — GeometryIdentity, OperatorGeometry and SensorGeometry — are what the 59 consumers import, so the table type is never re-exported.</desc>
  <defs>
    <marker id="gbarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#334155"/>
    </marker>
  </defs>

  <text x="20" y="24" font-family="system-ui" font-size="13" fill="#2563eb">Nova owns source authority</text>
  <rect x="20" y="34" width="440" height="74" rx="4" fill="#fff" stroke="#2563eb"/>
  <text x="40" y="60" font-family="system-ui" font-size="14" fill="#0f172a">resolve_machine_artifact → MachineArtifactManifest</text>
  <text x="40" y="82" font-family="system-ui" font-size="13" fill="#334155">describe_machine → DescribedMachine · resolved description / IDS</text>
  <text x="40" y="100" font-family="system-ui" font-size="12" fill="#64748b">identical source hash at de3277a3 and aeffde05 — stable, but not sufficient alone</text>

  <line x1="240" y1="108" x2="240" y2="140" stroke="#334155" marker-end="url(#gbarrow)"/>
  <text x="252" y="130" font-family="system-ui" font-size="12" fill="#64748b">names · poses · drives · elements · limiter · sections</text>

  <text x="20" y="164" font-family="system-ui" font-size="13" fill="#c2410c">Ambix adapter — private, never exported</text>
  <rect x="20" y="174" width="440" height="66" rx="4" fill="#fff" stroke="#c2410c"/>
  <text x="40" y="200" font-family="system-ui" font-size="14" fill="#0f172a">compatibility kernel (today's GeometryTable)</text>
  <text x="40" y="222" font-family="system-ui" font-size="12" fill="#334155">current ordering · rounding · counts · digest rules held byte-stable</text>

  <line x1="460" y1="207" x2="516" y2="207" stroke="#334155" marker-end="url(#gbarrow)"/>

  <text x="530" y="164" font-family="system-ui" font-size="13" fill="#0f766e">Three narrow projections — the only public surface</text>
  <rect x="530" y="174" width="430" height="34" rx="4" fill="#fff" stroke="#0f766e"/>
  <text x="546" y="196" font-family="system-ui" font-size="13" fill="#0f172a">GeometryIdentity — representation_key preserved exactly</text>
  <rect x="530" y="216" width="430" height="34" rx="4" fill="#fff" stroke="#0f766e"/>
  <text x="546" y="238" font-family="system-ui" font-size="13" fill="#0f172a">OperatorGeometry — elements · limiter · unresolved_turns</text>
  <rect x="530" y="258" width="430" height="34" rx="4" fill="#fff" stroke="#0f766e"/>
  <text x="546" y="280" font-family="system-ui" font-size="13" fill="#0f172a">SensorGeometry — acquisition join · channels · features</text>

  <line x1="745" y1="292" x2="745" y2="326" stroke="#334155" marker-end="url(#gbarrow)"/>

  <rect x="530" y="336" width="430" height="74" rx="4" fill="#fff" stroke="#334155"/>
  <text x="546" y="362" font-family="system-ui" font-size="14" fill="#0f172a">59 consumers, migrated in four measured tranches</text>
  <text x="546" y="384" font-family="system-ui" font-size="12" fill="#334155">C=3 boundary producers → B=13 projections → A=18 identity-only → D=25 tests</text>
  <text x="546" y="402" font-family="system-ui" font-size="12" fill="#64748b">terminal gate: zero imports of imas_ambix.gs.geometry</text>

  <rect x="20" y="290" width="440" height="120" rx="4" fill="#fff" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="40" y="314" font-family="system-ui" font-size="13" fill="#0f172a">Identity is the expensive axis</text>
  <text x="40" y="336" font-family="system-ui" font-size="12" fill="#334155">5 store families verdicted PRESERVE EXACTLY:</text>
  <text x="40" y="354" font-family="system-ui" font-size="12" fill="#334155">patch cache · 2 GS artifacts · 25 benchmark stamps</text>
  <text x="40" y="372" font-family="system-ui" font-size="12" fill="#334155">· trained checkpoints · 101 gate/evidence JSON</text>
  <text x="40" y="394" font-family="system-ui" font-size="12" fill="#b91c1c">keying on the Nova physical digest was rejected — it conflates discretizations</text>
</svg>
