<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 250" role="img" aria-labelledby="title desc">
  <title id="title">Nova and Ambix ownership flow</title>
  <desc id="desc">Research informs Nova plans, evidence verifies Nova physics, and Ambix consumes the released interfaces.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="25" y="75" width="185" height="92" rx="4" fill="#fff" stroke="#0f766e"/>
  <text x="117" y="106" text-anchor="middle" font-family="system-ui" font-size="16" fill="#0f172a">Research</text>
  <text x="117" y="132" text-anchor="middle" font-family="system-ui" font-size="13" fill="#334155">sources · cohorts · gates</text>
  <rect x="285" y="45" width="310" height="152" rx="4" fill="#fff" stroke="#2563eb"/>
  <text x="440" y="78" text-anchor="middle" font-family="system-ui" font-size="17" fill="#0f172a">Nova owns production physics</text>
  <text x="440" y="108" text-anchor="middle" font-family="system-ui" font-size="13" fill="#334155">equilibrium · transport · circuits</text>
  <text x="440" y="132" text-anchor="middle" font-family="system-ui" font-size="13" fill="#334155">IMAS · machine data · CPU/GPU</text>
  <text x="440" y="169" text-anchor="middle" font-family="system-ui" font-size="13" fill="#2563eb">plan → implementation → evidence</text>
  <rect x="670" y="75" width="285" height="92" rx="4" fill="#fff" stroke="#c2410c"/>
  <text x="812" y="106" text-anchor="middle" font-family="system-ui" font-size="16" fill="#0f172a">Ambix consumes Nova</text>
  <text x="812" y="132" text-anchor="middle" font-family="system-ui" font-size="13" fill="#334155">labels · orchestration · ML pipeline</text>
  <line x1="210" y1="121" x2="280" y2="121" stroke="#334155" marker-end="url(#arrow)"/>
  <line x1="595" y1="121" x2="665" y2="121" stroke="#334155" marker-end="url(#arrow)"/>
</svg>
