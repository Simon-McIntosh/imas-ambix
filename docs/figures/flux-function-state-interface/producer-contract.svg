<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 360" role="img" aria-labelledby="title desc">
  <title id="title">Ambix flux-function producer boundary</title>
  <desc id="desc">Diagnostics and actuator histories feed causal state estimation and learned closure evolution in Ambix. Ambix emits a typed ensemble of flux functions to Nova, while the Grad-Shafranov solve remains outside Ambix.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#345995"/>
    </marker>
  </defs>
  <g font-family="system-ui, sans-serif" fill="#18222d">
    <text x="40" y="38" font-size="19" font-weight="650">Learn and evolve the sources; do not solve equilibrium here</text>

    <g font-size="14">
      <rect x="40" y="82" width="210" height="180" rx="5" fill="#fafafa" stroke="#7b8794"/>
      <text x="58" y="112" font-size="16" font-weight="650">Evidence streams</text>
      <text x="58" y="145">magnetics · I<tspan baseline-shift="sub" font-size="11">p</tspan> · circuits</text>
      <text x="58" y="174">Thomson · MSE holdout</text>
      <text x="58" y="203">CXRS rotation · SOL data</text>
      <text x="58" y="232">actuator and prior histories</text>

      <rect x="330" y="82" width="260" height="180" rx="5" fill="#f6f9fc" stroke="#345995"/>
      <text x="348" y="112" font-size="16" font-weight="650">Ambix causal state</text>
      <text x="348" y="145">transport propagation</text>
      <text x="348" y="174">learned closure corrections</text>
      <text x="348" y="203">conditioning + calibration</text>
      <text x="348" y="232">ensemble and provenance</text>

      <rect x="670" y="70" width="330" height="204" rx="5" fill="#fffdf7" stroke="#b27a00" stroke-width="1.5"/>
      <text x="690" y="102" font-size="16" font-weight="650">FluxFunctionState</text>
      <text x="690" y="135">p, F and physical derivatives</text>
      <text x="690" y="164">optional Ω, T and closure model</text>
      <text x="690" y="193">core + topology-qualified SOL branches</text>
      <text x="690" y="222">coordinate, units, COCOS, uncertainty</text>
      <text x="690" y="251">Iₚ/moment policy + current ledger</text>

      <path d="M250 172 H330" stroke="#345995" stroke-width="2" marker-end="url(#arrow)"/>
      <path d="M590 172 H670" stroke="#345995" stroke-width="2" marker-end="url(#arrow)"/>
    </g>

    <line x1="40" y1="306" x2="1000" y2="306" stroke="#b9c1ca"/>
    <text x="40" y="334" font-size="14" fill="#4b5967">Authority stops at the typed state. Nova owns topology, source assembly, the free-boundary fixed point and conservation diagnostics.</text>
  </g>
</svg>
