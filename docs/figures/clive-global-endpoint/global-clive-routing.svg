<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
  <title id="title">Shared Clive routing through one global vLLM endpoint</title>
  <desc id="desc">Operators publish ready models and topology at one site endpoint. Every user runs the same shared Clive launcher, which reads that endpoint only. User schedulers, repositories, credentials, and job ownership are outside the consumer path.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#255b83"/>
    </marker>
  </defs>
  <g fill="none" stroke="#255b83" stroke-width="2" marker-end="url(#arrow)">
    <path d="M190 95 H350"/>
    <path d="M610 95 H770"/>
    <path d="M480 225 V145"/>
  </g>
  <g fill="#fff" stroke="#40566b" stroke-width="1.5">
    <rect x="30" y="48" width="160" height="94" rx="5"/>
    <rect x="350" y="38" width="260" height="114" rx="5"/>
    <rect x="770" y="48" width="160" height="94" rx="5"/>
    <rect x="350" y="225" width="260" height="70" rx="5"/>
  </g>
  <g fill="#18212b" font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="110" y="77" font-size="16" font-weight="700">Every user</text>
    <text x="110" y="104" font-size="14">one shared launcher</text>
    <text x="110" y="126" font-size="14">no repo or key required</text>

    <text x="480" y="70" font-size="17" font-weight="700">Global vLLM endpoint</text>
    <text x="480" y="98" font-size="14">GET /v1/models</text>
    <text x="480" y="121" font-size="14">model + context + topology</text>
    <text x="480" y="142" font-size="13" fill="#40566b">sole availability authority</text>

    <text x="850" y="77" font-size="16" font-weight="700">Shared Clive</text>
    <text x="850" y="104" font-size="14">dynamic picker</text>
    <text x="850" y="126" font-size="14">Claude + Codex</text>

    <text x="480" y="253" font-size="16" font-weight="700">Site operator</text>
    <text x="480" y="278" font-size="14">publishes only ready backends</text>
  </g>
  <g fill="#40566b" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">
    <text x="270" y="82">poll</text>
    <text x="690" y="82">catalog</text>
    <text x="625" y="198" text-anchor="start">scheduler stays here</text>
  </g>
  <path d="M38 317 H922" stroke="#b8c3cc" stroke-width="1"/>
  <text x="480" y="326" fill="#40566b" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">No user identity, scheduler scan, batch script, key file, or operator CLI appears in the consumer path.</text>
</svg>
