<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <g fill="#1a1a1c" font-size="13">

    <!-- axis -->
    <line x1="150" y1="290" x2="720" y2="290" stroke="#c9ccd1" stroke-width="1"/>
    <g font-size="12" fill="#5f6368" text-anchor="middle">
      <text x="150" y="308">0</text>
      <text x="313" y="308">400</text>
      <text x="476" y="308">800</text>
      <text x="638" y="308">1200</text>
      <text x="435" y="325" fill="#1a1a1c">aggregate output, tok/s, at the width each row's knee sits at</text>
    </g>
    <g stroke="#e8eaed" stroke-width="1">
      <line x1="313" y1="46" x2="313" y2="290"/>
      <line x1="476" y1="46" x2="476" y2="290"/>
      <line x1="638" y1="46" x2="638" y2="290"/>
    </g>

    <!-- row 1: measured today -->
    <text x="140" y="70" text-anchor="end">4 cards, today</text>
    <text x="140" y="85" text-anchor="end" font-size="11" fill="#5f6368">measured, knee ~20</text>
    <rect x="150" y="60" width="134" height="14" fill="#2563eb"/>
    <line x1="303" y1="55" x2="303" y2="79" stroke="#1a1a1c" stroke-width="1.5"/>
    <text x="313" y="71" font-size="12">330 sustained &#183; 377 peak</text>

    <!-- row 2: + DSpark -->
    <text x="140" y="126" text-anchor="end">4 cards, + DSpark</text>
    <text x="140" y="141" text-anchor="end" font-size="11" fill="#5f6368">from 46% acceptance</text>
    <rect x="150" y="116" width="204" height="14" fill="#2563eb" opacity="0.28"/>
    <rect x="354" y="116" width="61" height="14" fill="#2563eb"/>
    <text x="424" y="127" font-size="12">500&#8211;650</text>

    <!-- row 3: two TP4 replicas -->
    <text x="140" y="182" text-anchor="end">8 cards, 2 &#215; TP4</text>
    <text x="140" y="197" text-anchor="end" font-size="11" fill="#5f6368">knee ~40&#8211;54</text>
    <rect x="150" y="172" width="269" height="14" fill="#2563eb" opacity="0.28"/>
    <rect x="419" y="172" width="36" height="14" fill="#2563eb"/>
    <text x="464" y="183" font-size="12">660&#8211;750 &#8212; twice the cards for less than DSpark buys</text>

    <!-- row 4: compounded -->
    <text x="140" y="238" text-anchor="end">8 cards, 2 &#215; TP4 + DSpark</text>
    <text x="140" y="253" text-anchor="end" font-size="11" fill="#5f6368">two inferences multiplied</text>
    <rect x="557" y="228" width="122" height="14" fill="none" stroke="#2563eb" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="688" y="239" font-size="12" fill="#5f6368">1000&#8211;1300, not a forecast</text>

    <!-- row 5: TP8 refused -->
    <text x="140" y="278" text-anchor="end" fill="#5f6368">8 cards, one TP8 replica</text>
    <rect x="150" y="268" width="151" height="10" fill="#9aa0a6" opacity="0.5"/>
    <text x="311" y="277" font-size="12" fill="#5f6368">~370 &#8212; refused: the measured 2&#8594;8 precedent gave +11.9% aggregate for &#8722;18.3% per stream</text>

    <text x="20" y="28" font-size="14" font-weight="600">What each lever is expected to buy</text>
    <text x="20" y="44" font-size="11.5" fill="#5f6368">Solid bar = the expected range. Faded extension = the measured baseline it starts from. Dashed = inference on inference.</text>
  </g>
</svg>
