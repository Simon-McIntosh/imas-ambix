<text x="352.5" y="307" font-size="11" fill="#5f6368" text-anchor="middle">120</text>
<text x="481.2" y="307" font-size="11" fill="#5f6368" text-anchor="middle">180</text>
<text x="610.0" y="307" font-size="11" fill="#5f6368" text-anchor="middle">240</text>
<line x1="91" y1="290.0" x2="610" y2="290.0" stroke="#eef0f2"/>
<text x="87" y="294.0" font-size="11" fill="#5f6368" text-anchor="end">0</text>
<line x1="91" y1="241.1" x2="610" y2="241.1" stroke="#eef0f2"/>
<text x="87" y="245.1" font-size="11" fill="#5f6368" text-anchor="end">20</text>
<line x1="91" y1="192.2" x2="610" y2="192.2" stroke="#eef0f2"/>
<text x="87" y="196.2" font-size="11" fill="#5f6368" text-anchor="end">40</text>
<line x1="91" y1="143.3" x2="610" y2="143.3" stroke="#eef0f2"/>
<text x="87" y="147.3" font-size="11" fill="#5f6368" text-anchor="end">60</text>
<line x1="91" y1="94.4" x2="610" y2="94.4" stroke="#eef0f2"/>
<text x="87" y="98.4" font-size="11" fill="#5f6368" text-anchor="end">80</text>
<text x="352" y="325" font-size="11.5" text-anchor="middle">expert weight bytes read per forward pass (GB, FP8)</text>
<text x="87" y="56" font-size="11.5" font-weight="600">milliseconds per forward pass</text>
<line x1="95.0" y1="246.5" x2="610.0" y2="95.5" stroke="#2563eb" stroke-width="1.6"/>
<line x1="95.0" y1="290.0" x2="610.0" y2="259.4" stroke="#9aa0a6" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="616.0" y="263.4" font-size="11" fill="#5f6368">19.2 TB/s</text>
<text x="616.0" y="277.4" font-size="11" fill="#5f6368">nameplate</text>
<circle cx="116.3" cy="221.1" r="3" fill="#2563eb"/>
<text x="123.3" y="215.1" font-size="11">1</text>
<circle cx="134.2" cy="231.0" r="3" fill="#2563eb"/>
<circle cx="169.2" cy="230.5" r="3" fill="#2563eb"/>
<text x="176.2" y="224.5" font-size="11">4</text>
<circle cx="236.1" cy="216.6" r="3" fill="#2563eb"/>
<circle cx="357.8" cy="185.9" r="3" fill="#2563eb"/>
<text x="364.8" y="179.9" font-size="11">16</text>
<circle cx="413.2" cy="156.6" r="3" fill="#2563eb"/>
<circle cx="465.2" cy="141.3" r="3" fill="#2563eb"/>
<circle cx="502.0" cy="124.9" r="3" fill="#2563eb"/>
<circle cx="514.0" cy="123.7" r="3" fill="#2563eb"/>
<circle cx="559.8" cy="102.1" r="3" fill="#2563eb"/>
<circle cx="581.6" cy="96.5" r="3" fill="#2563eb"/>
<text x="588.6" y="90.5" font-size="11">34</text>
<line x1="95" y1="246.5" x2="95" y2="290.0" stroke="#dc2626" stroke-width="3"/>
<text x="105" y="238.5" font-size="11.5" fill="#dc2626">17.8 ms floor &#8212; paid whatever the batch</text>
<text x="417" y="174.1" font-size="11.5" fill="#2563eb">slope 0.257 ms/GB &#8212; 3.9 TB/s effective, 20% of nameplate</text>
<text x="18" y="334" font-size="11.5">Two-parameter least squares over all eleven points, residual RMS 3.8 ms. Expert count per layer is the expected union under uniform</text>
<text x="18" y="350" font-size="11.5">routing (top-6 of 384); real routing is skewed, so the true bytes are somewhat lower and the effective bandwidth somewhat worse.</text>
