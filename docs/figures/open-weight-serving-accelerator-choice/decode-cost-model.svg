<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<g fill="#1a1a1c" font-size="13">
<text x="18" y="24" font-size="14" font-weight="600">Decode cost splits into a latency floor and a bandwidth term</text>
<text x="18" y="41" font-size="11.5" fill="#5f6368">Each point is one running-request count from the curve beside it. The x axis is how many gigabytes of expert weights that batch must read per forward pass.</text>
<line x1="95" y1="290" x2="610" y2="290" stroke="#c9ccd1"/>
<line x1="95" y1="70" x2="95" y2="290" stroke="#c9ccd1"/>
