<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <g fill="#1a1a1c" font-size="13">
    <text x="18" y="24" font-size="14" font-weight="600">One DeepSeek-V4.1-Flash rank, and what the card has left</text>
    <text x="18" y="41" font-size="11.5" fill="#5f6368">Measured for H200 from the engine's own startup ledger and the card sampler under load; B200 and B300 are the same rank against a larger card.</text>

    <line x1="150" y1="238" x2="700" y2="238" stroke="#c9ccd1"/>
    <g font-size="11" fill="#5f6368" text-anchor="middle">
      <text x="150" y="255">0</text><text x="242" y="255">50</text><text x="333" y="255">100</text>
      <text x="425" y="255">150</text><text x="517" y="255">200</text><text x="608" y="255">250</text><text x="700" y="255">300</text>
      <text x="425" y="275" fill="#1a1a1c" font-size="11.5">GB per card</text>
    </g>

    <text x="140" y="83" text-anchor="end" font-size="12">H200 NVL &#183; ours</text>
    <text x="140" y="98" text-anchor="end" font-size="11" fill="#5f6368">141 GB</text>
    <rect x="150" y="70" width="136" height="20" fill="#2563eb"/><text x="158" y="85" font-size="11" fill="#ffffff">weights 74.1</text>
    <rect x="286" y="70" width="19" height="20" fill="#7aa2e8"/>
    <rect x="305" y="70" width="35" height="20" fill="#c9d6e8"/>
    <rect x="340" y="70" width="61" height="20" fill="none" stroke="#9aa0a6" stroke-dasharray="3 2"/>
    <text x="409" y="85" font-size="11.5">KV 10.1 &#183; workspace ~19 &#183; <tspan font-weight="600">33 free loaded</tspan> (52 idle)</text>

    <text x="140" y="143" text-anchor="end" font-size="12">B200</text>
    <text x="140" y="158" text-anchor="end" font-size="11" fill="#5f6368">180 GB</text>
    <rect x="150" y="130" width="136" height="20" fill="#2563eb"/>
    <rect x="286" y="130" width="19" height="20" fill="#7aa2e8"/>
    <rect x="305" y="130" width="35" height="20" fill="#c9d6e8"/>
    <rect x="340" y="130" width="132" height="20" fill="none" stroke="#9aa0a6" stroke-dasharray="3 2"/>
    <text x="480" y="145" font-size="11.5"><tspan font-weight="600">~72 free</tspan> &#8212; room for speculation and a doubled pool together</text>

    <text x="140" y="203" text-anchor="end" font-size="12">B300</text>
    <text x="140" y="218" text-anchor="end" font-size="11" fill="#5f6368">288 GB</text>
    <rect x="150" y="190" width="136" height="20" fill="#2563eb"/>
    <rect x="286" y="190" width="19" height="20" fill="#7aa2e8"/>
    <rect x="305" y="190" width="35" height="20" fill="#c9d6e8"/>
    <rect x="340" y="190" width="330" height="20" fill="none" stroke="#9aa0a6" stroke-dasharray="3 2"/>
    <text x="150" y="228" font-size="11.5">Dashed = free. <tspan font-weight="600">~270 free</tspan> at B300 would hold the 704 GiB GLM-5.3 FP8 release on four cards instead of eight.</text>
  </g>
</svg>
