<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 366" width="1060" height="366"
     font-family="sans-serif" font-size="13" fill="#1a1a1a">
  <style>
    .ax   { stroke:#5a5a5a; stroke-width:1; }
    .tick { stroke:#d8d8d8; stroke-width:1; }
    .air  { stroke:#1f5fa8; stroke-width:6; stroke-linecap:round; }
    .both { stroke:#6b8f3a; stroke-width:6; stroke-linecap:round; }
    .liq  { stroke:#b4531b; stroke-width:6; stroke-linecap:round; }
    .now  { stroke:#9a9a9a; stroke-width:6; stroke-linecap:round; }
    .note { font-size:12px; fill:#5a5a5a; }
    .hdr  { font-size:14px; font-weight:600; }
  </style>

  <text class="hdr" x="0" y="14">What is buyable, when, and whether air will carry it</text>

  <!-- cooling legend -->
  <line class="air" x1="470" y1="10" x2="494" y2="10"/>
  <text class="note" x="502" y="14">air</text>
  <line class="both" x1="540" y1="10" x2="564" y2="10"/>
  <text class="note" x="572" y="14">air or liquid</text>
  <line class="liq" x1="658" y1="10" x2="682" y2="10"/>
  <text class="note" x="690" y="14">liquid required</text>

  <!-- rows -->
  <text x="292" y="76" text-anchor="end">8&#215;H200 NVL</text>
  <line class="now" x1="306" y1="72" x2="760" y2="72"/>
  <text class="note" x="772" y="76">in service &#183; 600 W/card &#183; air</text>

  <text x="292" y="108" text-anchor="end">8&#215;B200</text>
  <line class="air" x1="306" y1="104" x2="760" y2="104"/>
  <text class="note" x="772" y="108">shipping &#183; 1,000 W &#183; air, 10U, 14.3 kW</text>

  <text x="292" y="140" text-anchor="end">8&#215;B300 air bin</text>
  <line class="air" x1="306" y1="136" x2="760" y2="136"/>
  <text class="note" x="772" y="140">shipping &#183; 1,100 W &#183; air, 8&#8211;10U, ~14 kW</text>

  <text x="292" y="172" text-anchor="end">8&#215;B300 DLC bin</text>
  <line class="liq" x1="306" y1="168" x2="760" y2="168"/>
  <text class="note" x="772" y="172">shipping &#183; 1,400 W &#183; liquid only</text>

  <text x="292" y="204" text-anchor="end">8&#215;MI355X</text>
  <line class="both" x1="306" y1="200" x2="760" y2="200"/>
  <text class="note" x="772" y="204">shipping &#183; 1,400 W &#183; air or liquid</text>

  <text x="292" y="236" text-anchor="end">Rubin VR200</text>
  <line class="liq" x1="430" y1="232" x2="760" y2="232"/>
  <circle cx="430" cy="232" r="5" fill="#b4531b"/>
  <text class="note" x="772" y="236">1.8&#8211;2.3 kW &#183; liquid only, NVL8 included</text>

  <text x="292" y="268" text-anchor="end">Rubin Ultra</text>
  <line class="liq" x1="640" y1="264" x2="760" y2="264"/>
  <circle cx="640" cy="264" r="5" fill="#b4531b"/>
  <text class="note" x="772" y="268">announced for H2 2027 &#183; liquid</text>

  <!-- axis -->
  <line class="ax" x1="300" y1="286" x2="770" y2="286"/>
  <g class="note">
    <line class="tick" x1="300" y1="28" x2="300" y2="286"/>
    <line class="tick" x1="365" y1="28" x2="365" y2="286"/>
    <line class="tick" x1="430" y1="28" x2="430" y2="286"/>
    <line class="tick" x1="510" y1="28" x2="510" y2="286"/>
    <line class="tick" x1="640" y1="28" x2="640" y2="286"/>
    <text x="300" y="302" text-anchor="middle">now</text>
    <text x="365" y="302" text-anchor="middle">2026 Q4</text>
    <text x="430" y="302" text-anchor="middle">2027 Q1</text>
    <text x="510" y="302" text-anchor="middle">2027 Q2</text>
    <text x="640" y="302" text-anchor="middle">2027 H2</text>
  </g>
  <text class="note" x="0" y="320">The Rubin marker is broad availability, not first silicon: NVL72 entered full production in January 2026 with volume in H2, and channel</text>
  <text class="note" x="0" y="337">supply is reported for 2026 Q4 into 2027 Q1. It is liquid-cooled in every form factor, the eight-GPU HGX board included — so Blackwell is</text>
  <text class="note" x="0" y="354">the last NVIDIA generation this site can take without a coolant loop.</text>
</svg>
