<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 310" role="img" aria-labelledby="title desc">
  <title id="title">Router generation admission flow</title>
  <desc id="desc">Generation requests resolve their model catalog before entering one FIFO queue and occupying at most W relay slots. Catalog listing and token-count requests bypass the queue; the router has no health route. A timeout returns HTTP 529 and a disconnect leaves the queue or releases a slot.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3f4b59"/>
    </marker>
    <style>
      .box { fill: #f7f9fb; stroke: #3f4b59; stroke-width: 2; rx: 9; }
      .active { fill: #e8f5ec; stroke: #287a45; stroke-width: 2; rx: 9; }
      .bypass { fill: #eef5ff; stroke: #356aa0; stroke-width: 2; rx: 9; }
      .refuse { fill: #fff0ee; stroke: #a43d35; stroke-width: 2; rx: 9; }
      .flow { fill: none; stroke: #3f4b59; stroke-width: 2; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #356aa0; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      text { font-family: system-ui, sans-serif; fill: #17202a; font-size: 15px; }
      .label { font-size: 13px; fill: #4b5563; }
      .strong { font-weight: 700; }
    </style>
  </defs>

  <text x="26" y="34" class="strong">router arrivals</text>
  <rect class="box" x="24" y="54" width="160" height="58"/>
  <text x="45" y="79">generation request</text>
  <text x="45" y="99" class="label">messages or chat</text>

  <path class="flow" d="M184 83 H220"/>
  <rect class="box" x="220" y="54" width="170" height="58"/>
  <text x="244" y="79" class="strong">catalog resolution</text>
  <text x="246" y="99" class="label">select model upstream</text>

  <path class="flow" d="M390 83 H425"/>
  <rect class="box" x="425" y="45" width="190" height="116"/>
  <text x="451" y="73" class="strong">one global FIFO</text>
  <text x="451" y="98">oldest resolved first</text>
  <text x="451" y="123" class="label">disconnect removes waiter</text>
  <text x="451" y="145" class="label">wait bound is file-backed</text>

  <path class="flow" d="M615 83 H680"/>
  <rect class="active" x="680" y="45" width="175" height="116"/>
  <text x="709" y="73" class="strong">relay slots</text>
  <text x="709" y="100">in flight ≤ W</text>
  <text x="709" y="125" class="label">finally releases slot</text>
  <text x="709" y="147" class="label">stream disconnect too</text>

  <path class="flow" d="M855 83 H930"/>
  <rect class="box" x="930" y="54" width="150" height="58"/>
  <text x="958" y="80" class="strong">upstream</text>
  <text x="950" y="100" class="label">generation engine</text>

  <path class="flow" d="M520 161 V218 H680"/>
  <rect class="refuse" x="680" y="193" width="175" height="62"/>
  <text x="708" y="219" class="strong">wait expires</text>
  <text x="706" y="241" class="label">529 + Retry-After</text>

  <rect class="bypass" x="24" y="217" width="330" height="62"/>
  <text x="48" y="243" class="strong">decode-free request</text>
  <text x="48" y="265" class="label">catalog · count_tokens · no health route</text>
  <path class="dash" d="M354 248 H930"/>

  <text x="745" y="289" class="label">No engine KV is held while a generation request waits.</text>
</svg>
