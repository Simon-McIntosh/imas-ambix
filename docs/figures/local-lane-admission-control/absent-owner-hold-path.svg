<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc">
  <title id="title">A generation request for a known model with no reachable owner waits in the gate instead of being refused</title>
  <desc id="desc">A request that names a model id first resolves an owner. If one is reachable it relays as before. If not, two cases diverge: an unknown id on a generation path is refused 404, while a known id waits in the shared generation gate FIFO, re-resolving the owner at each admission attempt by polling every 0.2 seconds. An owner appearing relays the request; the wait budget elapsing answers a retryable 529 with a Retry-After of five seconds. A paused gate admits nobody, so the request stays in the FIFO until resume, exactly as a resolvable one does.</desc>

  <style>
    .box { fill: #eef3fb; stroke: #2f5d9e; stroke-width: 1.6; }
    .hold { fill: #fdf3e2; stroke: #b5791f; stroke-width: 1.6; }
    .refuse { fill: #fbecec; stroke: #a33; stroke-width: 1.6; }
    .relay { fill: #eaf6ec; stroke: #2f7d3a; stroke-width: 1.6; }
    .note { fill: #f4f4f6; stroke: #8a8a94; stroke-width: 1.4; stroke-dasharray: 5 4; }
    .label { font: 13px/1.35 system-ui, sans-serif; fill: #16202b; text-anchor: middle; }
    .small { font: 11.5px/1.3 system-ui, sans-serif; fill: #46505c; text-anchor: middle; }
    .edge { stroke: #4a5560; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .elabel { font: 11.5px system-ui, sans-serif; fill: #4a5560; text-anchor: middle; }
    .t { font: 15px/1.3 system-ui, sans-serif; fill: #16202b; font-weight: 600; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refs="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5560"/>
    </marker>
  </defs>

  <text class="t" x="480" y="24" text-anchor="middle">A generation request for a model whose engine is absent</text>

  <rect class="box"  x="300" y="42"  width="360" height="46" rx="6"/>
  <text class="label" x="480" y="70">resolve owners from reachable catalogs</text>

  <rect class="box"  x="300" y="118" width="360" height="46" rx="6"/>
  <text class="label" x="480" y="139">an owner is reachable?</text>
  <text class="small" x="480" y="155">yes relays here, exactly as before</text>

  <rect class="box"  x="300" y="198" width="360" height="46" rx="6"/>
  <text class="label" x="480" y="219">generation path and the id known?</text>
  <text class="small" x="480" y="235">known = resolved once, or named by a profile</text>

  <rect class="relay" x="720" y="118" width="220" height="46" rx="6"/>
  <text class="label" x="830" y="140">relay to the preferred</text>
  <text class="label" x="830" y="156">owner</text>

  <rect class="refuse" x="720" y="198" width="220" height="46" rx="6"/>
  <text class="label" x="830" y="220">404 unknown</text>
  <text class="label" x="830" y="236">model id</text>

  <rect class="note" x="36" y="262" width="230" height="132" rx="6"/>
  <text class="label" x="151" y="288">a paused gate admits</text>
  <text class="label" x="151" y="306">nobody, so the request</text>
  <text class="label" x="151" y="324">stays in the FIFO until</text>
  <text class="label" x="151" y="342">resume, exactly as a</text>
  <text class="label" x="151" y="360">resolvable one does</text>
  <text class="label" x="151" y="384">width is ignored while paused</text>

  <rect class="hold" x="300" y="278" width="360" height="46" rx="6"/>
  <text class="label" x="480" y="300">wait in the shared generation gate FIFO</text>
  <text class="small" x="480" y="316">FIFO position is kept across re-resolution</text>

  <rect class="hold" x="300" y="358" width="360" height="46" rx="6"/>
  <text class="label" x="480" y="380">at the head: re-resolve the owner</text>
  <text class="small" x="480" y="396">polled every 0.2 s; the resolution runs outside the lock</text>

  <rect class="relay" x="720" y="358" width="220" height="46" rx="6"/>
  <text class="label" x="830" y="380">an owner appears:</text>
  <text class="label" x="830" y="396">relay its appearance</text>

  <rect class="refuse" x="300" y="452" width="360" height="52" rx="6"/>
  <text class="label" x="480" y="474">the gate's wait_seconds elapses</text>
  <text class="label" x="480" y="492">529 overloaded_error, Retry-After: 5</text>

  <line class="edge" x1="480" y1="88"  x2="480" y2="118"/>
  <line class="edge" x1="480" y1="164" x2="480" y2="198"/>
  <line class="edge" x1="480" y1="244" x2="480" y2="278"/>
  <line class="edge" x1="480" y1="324" x2="480" y2="358"/>
  <line class="edge" x1="480" y1="404" x2="480" y2="452"/>

  <line class="edge" x1="660" y1="141" x2="720" y2="141"/>
  <text class="elabel" x="690" y="133">yes</text>
  <line class="edge" x1="660" y1="221" x2="720" y2="221"/>
  <text class="elabel" x="690" y="213">no</text>
  <line class="edge" x1="660" y1="381" x2="720" y2="381"/>
  <text class="elabel" x="690" y="373">yes</text>
  <text class="elabel" x="585" y="347">no owner yet</text>
  <line class="edge" x1="266" y1="301" x2="300" y2="301"/>
</svg>