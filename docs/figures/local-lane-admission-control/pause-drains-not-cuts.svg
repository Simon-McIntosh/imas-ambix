<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">A declared pause drains the gate, it does not cut it</title>
  <desc id="desc">Four requests against one gate. A is admitted before the pause and runs to completion during it. The pause is declared: no new generation starts. B and C arrive during the pause and wait in FIFO order; D waits past its deadline and receives HTTP 529 with a Retry-After. When the pause clears, B is admitted first and C second, in arrival order.</desc>
  <defs>
    <style>
      .lane   { fill: #f7f9fb; stroke: #3f4b59; stroke-width: 2; rx: 9; }
      .run    { fill: #e8f5ec; stroke: #287a45; stroke-width: 2; rx: 9; }
      .wait   { fill: #fdf6e3; stroke: #b58105; stroke-width: 2; rx: 9; }
      .refuse { fill: #fff0ee; stroke: #a43d35; stroke-width: 2; rx: 9; }
      .pause  { fill: #efeaf7; stroke: #6b4fa0; stroke-width: 2; rx: 9; }
      text { font-family: system-ui, sans-serif; fill: #17202a; font-size: 15px; }
      .label { font-size: 13px; fill: #4b5563; }
      .strong { font-weight: 700; }
      .rule { stroke: #6b4fa0; stroke-width: 2; stroke-dasharray: 8 6; }
      .axis { stroke: #9aa4b0; stroke-width: 2; marker-end: none; }
    </style>
  </defs>

  <text x="26" y="34" class="strong">Four requests, one gate</text>
  <text x="26" y="56" class="label">each row is a caller; bars are wall-clock time, left to right</text>

  <!-- time axis -->
  <path class="axis" d="M300 92 H1040"/>
  <text x="300" y="86" class="label">0 s</text>
  <text x="980" y="86" class="label">time</text>

  <!-- pause window -->
  <rect class="pause" x="470" y="104" width="330" height="256" opacity="0.55"/>
  <path class="rule" d="M470 100 V366"/>
  <path class="rule" d="M800 100 V366"/>
  <text x="492" y="126" class="strong">paused: true</text>
  <text x="492" y="146" class="label">reason: "drain for a relaunch"</text>
  <text x="492" y="166" class="label">no new generation starts</text>

  <!-- A: in flight at pause, completes during it -->
  <rect class="run" x="300" y="190" width="250" height="40"/>
  <text x="318" y="215" class="strong">A</text>
  <text x="352" y="215" class="label">admitted before the pause &#8212; runs to completion</text>

  <!-- B: waits, then admitted on resume -->
  <rect class="wait" x="560" y="240" width="240" height="40"/>
  <text x="578" y="265" class="strong">B</text>
  <text x="612" y="265" class="label">waiting (1st in FIFO)</text>
  <rect class="run" x="800" y="240" width="140" height="40"/>
  <text x="824" y="265" class="strong">B runs</text>

  <!-- C: waits, then admitted after B -->
  <rect class="wait" x="600" y="290" width="200" height="40"/>
  <text x="618" y="315" class="strong">C</text>
  <text x="652" y="315" class="label">waiting (2nd in FIFO)</text>
  <rect class="run" x="940" y="290" width="100" height="40"/>
  <text x="960" y="315" class="strong">C runs</text>

  <!-- D: waits past deadline, gets 529 -->
  <rect class="refuse" x="640" y="340" width="160" height="40"/>
  <text x="658" y="365" class="strong">D</text>
  <text x="692" y="365" class="label">past wait_seconds</text>

  <!-- resume marker -->
  <path class="rule" d="M800 104 V366"/>
  <text x="806" y="126" class="strong">resume</text>
  <text x="806" y="146" class="label">paused: false</text>
  <text x="806" y="166" class="label">FIFO order: B then C</text>

  <!-- 529 callout -->
  <text x="26" y="300" class="strong">D is refused, not queued forever</text>
  <text x="26" y="322" class="label">HTTP 529 overloaded_error</text>
  <text x="26" y="342" class="label">Retry-After: 5</text>
  <text x="26" y="362" class="label">the same reply a full gate gives</text>

  <text x="26" y="215" class="label">in flight at the moment of the pause</text>
</svg>