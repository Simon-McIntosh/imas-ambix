<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <rect width="940" height="400" fill="#fbfbfa"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b6b3a"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a33"/>
    </marker>
  </defs>

  <text x="40" y="40" font-size="20" font-weight="700" fill="#1a1a1a">An empty ladder component is refused, not silently skipped</text>
  <text x="40" y="64" fill="#555" font-size="14">A dropped level leaves a hole that reads as a concurrency the sweep decided against rather than one it never measured.</text>

  <!-- input -->
  <rect x="40" y="100" width="250" height="56" rx="8" fill="#eef7f0" stroke="#1b6b3a" stroke-width="2"/>
  <text x="165" y="124" text-anchor="middle" fill="#123" font-family="monospace" font-size="13">agent bench --levels</text>
  <text x="165" y="143" text-anchor="middle" fill="#123" font-family="monospace" font-size="13">4,,8</text>

  <line x1="290" y1="128" x2="330" y2="128" stroke="#1b6b3a" stroke-width="2" marker-end="url(#a)"/>

  <!-- split -->
  <rect x="334" y="100" width="210" height="56" rx="8" fill="#eef7f0" stroke="#1b6b3a" stroke-width="2"/>
  <text x="439" y="124" text-anchor="middle" fill="#123" font-family="monospace" font-size="13">split(",")</text>
  <text x="439" y="143" text-anchor="middle" fill="#123" font-family="monospace" font-size="13">["4", "", "8"]</text>

  <line x1="544" y1="128" x2="584" y2="128" stroke="#1b6b3a" stroke-width="2" marker-end="url(#a)"/>

  <!-- decision -->
  <polygon points="700,96 800,128 700,160 600,128" fill="#fff7e8" stroke="#b8860b" stroke-width="2"/>
  <text x="700" y="125" text-anchor="middle" fill="#5a4300" font-size="13">component</text>
  <text x="700" y="142" text-anchor="middle" fill="#5a4300" font-size="13">blank?</text>

  <!-- yes branch -->
  <path d="M700,160 L700,206" stroke="#a33" stroke-width="2" fill="none" marker-end="url(#r)"/>
  <text x="712" y="188" fill="#a33" font-size="13" font-weight="700">yes</text>
  <rect x="540" y="210" width="320" height="70" rx="8" fill="#fdeeee" stroke="#a33" stroke-width="2"/>
  <text x="700" y="236" text-anchor="middle" fill="#7a1f1f" font-family="monospace" font-size="13">click.BadParameter</text>
  <text x="700" y="258" text-anchor="middle" fill="#7a1f1f" font-size="13">&quot;empty component in ladder '4,,8'&quot;</text>

  <!-- no branch -->
  <path d="M800,128 L858,128 L858,150" stroke="#1b6b3a" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="812" y="118" fill="#1b6b3a" font-size="13" font-weight="700">no</text>
  <rect x="756" y="154" width="164" height="40" rx="8" fill="#eef7f0" stroke="#1b6b3a" stroke-width="2"/>
  <text x="838" y="178" text-anchor="middle" fill="#123" font-family="monospace" font-size="12">int(part) -&gt; levels</text>

  <line x1="40" y1="304" x2="900" y2="304" stroke="#d8d8d4"/>
  <text x="40" y="332" font-size="15" font-weight="700" fill="#444">Superseded behaviour</text>
  <text x="40" y="358" fill="#777" font-family="monospace" font-size="13">
    <tspan fill="#999" text-decoration="line-through">if not part: continue</tspan>
    <tspan>&#160;&#160;&#160;["4", "", "8"] &#8594; [4, 8]&#160;&#160;&#160;(the interior level silently vanished)</tspan>
  </text>
</svg>