<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660"
     font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13">
  <rect width="960" height="660" fill="#fbfbfd"/>
  <text x="24" y="30" font-size="16" font-weight="bold" fill="#1b1b1f">Ten flat columns folded into the engine section, and the five that are not duplicates</text>

  <!-- BEFORE -->
  <g>
    <rect x="24" y="46" width="440" height="300" rx="8" fill="#fdf1f1" stroke="#8a1c1c"/>
    <text x="38" y="70" font-size="14" font-weight="bold" fill="#8a1c1c">Row schema 3 — ten flat columns beside the engine section</text>

    <text x="38" y="92" font-size="11.5" fill="#8a1c1c">Each was derived inside the recorder from the vLLM spellings only,</text>
    <text x="38" y="108" font-size="11.5" fill="#8a1c1c">so against the SGLang serve they were null in every one of 79,265 rows</text>
    <text x="38" y="124" font-size="11.5" fill="#8a1c1c">while the engine published both quantities throughout.</text>

    <rect x="40" y="136" width="408" height="152" rx="6" fill="#fff" stroke="#8a1c1c"/>
    <text x="52" y="158" font-family="monospace" font-size="11" fill="#1b1b1f">prefix_cache_queries_total</text>
    <text x="52" y="176" font-family="monospace" font-size="11" fill="#1b1b1f">prefix_cache_hits_total</text>
    <text x="52" y="194" font-family="monospace" font-size="11" fill="#1b1b1f">prefix_cache_query_delta</text>
    <text x="52" y="212" font-family="monospace" font-size="11" fill="#1b1b1f">prefix_cache_hit_delta</text>
    <text x="52" y="230" font-family="monospace" font-size="11" fill="#1b1b1f">prefix_cache_hit_rate_interval</text>
    <text x="52" y="248" font-family="monospace" font-size="11" fill="#1b1b1f">prefix_cache_hit_rate</text>
    <text x="52" y="266" font-family="monospace" font-size="11" fill="#1b1b1f">spec_draft_tokens, spec_accepted_tokens,</text>
    <text x="52" y="282" font-family="monospace" font-size="11" fill="#1b1b1f">spec_acceptance_rate, spec_num_accepted_per_pos</text>

    <text x="40" y="308" font-size="11.5" fill="#8a1c1c">Interval deltas: a reader had to trust the recorder's arithmetic,</text>
    <text x="40" y="324" font-size="11.5" fill="#8a1c1c">and the two rows they were differenced from were not on the row.</text>
    <text x="40" y="340" font-size="11.5" fill="#8a1c1c">Ten columns, two families, one of them unreadable.</text>
  </g>

  <!-- AFTER -->
  <g>
    <rect x="496" y="46" width="440" height="300" rx="8" fill="#eef6ee" stroke="#1c6a2c"/>
    <text x="510" y="70" font-size="14" font-weight="bold" fill="#1c6a2c">Row schema 4 — the engine section is the authority</text>

    <text x="510" y="92" font-size="11.5" fill="#1c6a2c">One section, both families, carrying the cumulative values each engine</text>
    <text x="510" y="108" font-size="11.5" fill="#1c6a2c">publishes under its own names. A quantity a family does not publish is</text>
    <text x="510" y="124" font-size="11.5" fill="#1c6a2c">absent from the section rather than nulled into it.</text>

    <rect x="512" y="136" width="408" height="152" rx="6" fill="#fff" stroke="#1c6a2c"/>
    <text x="524" y="158" font-family="monospace" font-size="11" fill="#1b1b1f">engine.prefix_cache_queries — cumulative</text>
    <text x="524" y="176" font-family="monospace" font-size="11" fill="#1b1b1f">engine.prefix_cache_hits — cumulative</text>
    <text x="524" y="194" font-family="monospace" font-size="11" fill="#1b1b1f">engine.prefix_cache_hit_rate — rate gauge, where the</text>
    <text x="536" y="210" font-family="monospace" font-size="11" fill="#1b1b1f">family publishes one; else hits / queries</text>
    <text x="524" y="232" font-family="monospace" font-size="11" fill="#1b1b1f">engine.spec_decode{draft_tokens_total,</text>
    <text x="536" y="248" font-family="monospace" font-size="11" fill="#1b1b1f">accepted_tokens_total, num_accepted_per_pos}</text>
    <text x="524" y="270" font-family="monospace" font-size="11" fill="#1b1b1f">engine.spec_decode{accept_rate, accept_length,</text>
    <text x="536" y="286" font-family="monospace" font-size="11" fill="#1b1b1f">active_draft_tokens}  — the SGLang spellings</text>

    <text x="512" y="308" font-size="11.5" fill="#1c6a2c">A delta is now two rows' sections differenced by the reader, which is</text>
    <text x="512" y="324" font-size="11.5" fill="#1c6a2c">the same arithmetic with both endpoints on the record.</text>
    <text x="512" y="340" font-size="11.5" fill="#1c6a2c">The row no longer states a rate it cannot reconstruct.</text>
  </g>

  <!-- MAPPING -->
  <g>
    <text x="24" y="384" font-size="14" font-weight="bold" fill="#1b1b1f">What a reader gets in place of each removed column, measured on the live SGLang engine</text>
    <rect x="24" y="396" width="912" height="132" rx="8" fill="#fff" stroke="#6a6a72"/>
    <line x1="24" y1="424" x2="936" y2="424" stroke="#c9c9d2"/>
    <text x="40" y="416" font-size="12" font-weight="bold" fill="#1b1b1f">removed flat column</text>
    <text x="440" y="416" font-size="12" font-weight="bold" fill="#1b1b1f">now read from the engine section</text>
    <text x="700" y="416" font-size="12" font-weight="bold" fill="#1b1b1f">live value, job 1273253</text>

    <text x="40" y="444" font-family="monospace" font-size="10.5" fill="#1b1b1f">prefix_cache_queries_total</text>
    <text x="440" y="444" font-family="monospace" font-size="10.5" fill="#1b1b1f">engine.prefix_cache_queries</text>
    <text x="700" y="444" font-family="monospace" font-size="10.5" fill="#8a1c1c">absent (vLLM-only series)</text>

    <text x="40" y="462" font-family="monospace" font-size="10.5" fill="#1b1b1f">prefix_cache_hits_total</text>
    <text x="440" y="462" font-family="monospace" font-size="10.5" fill="#1b1b1f">engine.prefix_cache_hits</text>
    <text x="700" y="462" font-family="monospace" font-size="10.5" fill="#1c6a2c">6,158,605,312</text>

    <text x="40" y="480" font-family="monospace" font-size="10.5" fill="#1b1b1f">prefix_cache_query_delta / _hit_delta</text>
    <text x="440" y="480" font-family="monospace" font-size="10.5" fill="#1b1b1f">difference of two rows' sections</text>
    <text x="700" y="480" font-family="monospace" font-size="10.5" fill="#1c6a2c">2,000 / 1,800 in the tests</text>

    <text x="40" y="498" font-family="monospace" font-size="10.5" fill="#1b1b1f">prefix_cache_hit_rate_interval / _rate</text>
    <text x="440" y="498" font-family="monospace" font-size="10.5" fill="#1b1b1f">engine.prefix_cache_hit_rate (gauge)</text>
    <text x="700" y="498" font-family="monospace" font-size="10.5" fill="#1c6a2c">0.9981884</text>

    <text x="40" y="516" font-family="monospace" font-size="10.5" fill="#1b1b1f">spec_draft_tokens / spec_accepted_tokens</text>
    <text x="440" y="516" font-family="monospace" font-size="10.5" fill="#1b1b1f">engine.spec_decode{accept_rate, accept_length}</text>
    <text x="700" y="516" font-family="monospace" font-size="10.5" fill="#1c6a2c">0.66926 / 4.34632</text>
  </g>

  <!-- KEPT -->
  <g>
    <rect x="24" y="542" width="912" height="102" rx="8" fill="#f4f2fb" stroke="#4a3a9c"/>
    <text x="38" y="566" font-size="13" font-weight="bold" fill="#4a3a9c">Kept, and which of them the engine section also carries</text>

    <text x="40" y="590" font-family="monospace" font-size="10.5" fill="#1b1b1f">generation_throughput_toks_per_s  — NOT a duplicate: the section carries only cumulative engine.generation_tokens</text>
    <text x="40" y="608" font-family="monospace" font-size="10.5" fill="#1b1b1f">prompt_throughput_toks_per_s      — NOT a duplicate: the section carries only cumulative engine.prompt_tokens</text>
    <text x="40" y="626" font-family="monospace" font-size="10.5" fill="#1b1b1f">num_requests_running / _waiting / kv_cache_usage_perc  — duplicated by engine.requests_running / requests_queued / kv_pool_occupancy</text>
    <text x="40" y="640" font-size="10.5" fill="#4a3a9c">  (5 vs 5.0, 0 vs 0.0, 0.2 vs 0.2 on the live row) — kept as instructed, removable in a later pass</text>
  </g>
</svg>