<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540"
     font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13">
  <rect width="980" height="540" fill="#fbfbfd"/>
  <text x="24" y="30" font-size="16" font-weight="bold" fill="#1b1b1f">Where a row's serve configuration comes from: the engine states what is in force, a caller fills only the gap</text>

  <!-- engine source -->
  <g>
    <rect x="24" y="60" width="330" height="250" rx="8" fill="#eef4ec" stroke="#2f6b3a"/>
    <text x="40" y="84" font-size="14" font-weight="bold" fill="#2f6b3a">The engine, asked about itself</text>
    <text x="40" y="104" font-size="11" fill="#3a3a44">GET &lt;base-url&gt;/server_info  (SGLang)</text>
    <text x="40" y="124" font-size="11" fill="#3a3a44">reports what is in force, not what was requested</text>

    <rect x="40" y="138" width="298" height="156" rx="6" fill="#fff" stroke="#6a6a72"/>
    <text x="52" y="158" font-family="monospace" font-size="11.5" fill="#1b1b1f">context_length        512000</text>
    <text x="52" y="177" font-family="monospace" font-size="11.5" fill="#1b1b1f">max_total_tokens      4000000</text>
    <text x="52" y="196" font-family="monospace" font-size="11.5" fill="#1b1b1f">mem_fraction_static   0.85</text>
    <text x="52" y="215" font-family="monospace" font-size="11.5" fill="#1b1b1f">max_running_requests  36</text>
    <text x="52" y="234" font-family="monospace" font-size="11.5" fill="#1b1b1f">hicache_ratio         2.0</text>
    <text x="52" y="253" font-family="monospace" font-size="11.5" fill="#1b1b1f">speculative_algorithm DSPARK</text>
    <text x="52" y="272" font-family="monospace" font-size="11.5" fill="#1b1b1f">tp_size               4</text>
    <text x="300" y="272" text-anchor="end" font-size="10" fill="#2f6b3a">all 7 on the live lane</text>
  </g>

  <!-- caller source -->
  <g>
    <rect x="24" y="330" width="330" height="120" rx="8" fill="#f4f1e8" stroke="#8a6a1c"/>
    <text x="40" y="354" font-size="14" font-weight="bold" fill="#8a6a1c">A caller, stating a setting</text>
    <text x="40" y="374" font-family="monospace" font-size="11.5" fill="#1b1b1f">--serve-setting KEY=VALUE</text>
    <text x="40" y="396" font-size="11" fill="#3a3a44">used only for what the engine left out:</text>
    <text x="40" y="413" font-size="11" fill="#3a3a44">an engine family that does not publish</text>
    <text x="40" y="430" font-size="11" fill="#3a3a44">its arguments carries no configuration.</text>
  </g>

  <!-- merge -->
  <g>
    <line x1="354" y1="185" x2="452" y2="205" stroke="#2f6b3a" stroke-width="1.6"/>
    <line x1="354" y1="390" x2="452" y2="290" stroke="#8a6a1c" stroke-width="1.6" stroke-dasharray="5 3"/>
    <rect x="452" y="200" width="200" height="86" rx="8" fill="#e8eef8" stroke="#3a5a9c"/>
    <text x="552" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b1b1f">merge</text>
    <text x="552" y="246" text-anchor="middle" font-size="11" fill="#3a5a9c">engine wins a conflict</text>
    <text x="552" y="264" text-anchor="middle" font-size="11" fill="#3a5a9c">caller fills a gap only</text>
    <text x="552" y="281" text-anchor="middle" font-size="10" fill="#6a6a72">resolved once per serve</text>
  </g>

  <!-- row -->
  <g>
    <line x1="652" y1="243" x2="716" y2="243" stroke="#3a5a9c" stroke-width="1.6"/>
    <rect x="716" y="182" width="240" height="122" rx="8" fill="#fff" stroke="#3a5a9c"/>
    <text x="836" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b1b1f">row.serve_config</text>
    <text x="836" y="226" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#1b1b1f">7 settings</text>
    <text x="836" y="244" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#1b1b1f">schema_version 3</text>
    <text x="836" y="266" text-anchor="middle" font-size="10.5" fill="#3a3a44">carried on every row,</text>
    <text x="836" y="281" text-anchor="middle" font-size="10.5" fill="#3a3a44">so a figure states its settings</text>
    <text x="836" y="296" text-anchor="middle" font-size="10.5" fill="#3a3a44">rather than leaving them guessed</text>
  </g>

  <!-- absent branch -->
  <g>
    <rect x="452" y="330" width="504" height="120" rx="8" fill="#fdf1f1" stroke="#8a1c1c"/>
    <text x="468" y="354" font-size="13" font-weight="bold" fill="#8a1c1c">Neither source read anything</text>
    <text x="468" y="376" font-size="11" fill="#3a3a44">engine route absent, engine down, body not JSON, or nothing of the vocabulary reported</text>
    <text x="468" y="398" font-family="monospace" font-size="11.5" fill="#8a1c1c">"serve_config" is OMITTED from the row</text>
    <text x="468" y="420" font-size="11" fill="#3a3a44">never written as <tspan font-family="monospace">null</tspan>, on the sparse-section rule the other sections follow:</text>
    <text x="468" y="438" font-size="11" fill="#3a3a44">a stated setting and an unread one must not read alike.</text>
  </g>
</svg>