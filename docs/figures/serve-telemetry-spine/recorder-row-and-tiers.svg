<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430"
     font-family="system-ui, sans-serif" font-size="13">
  <rect width="900" height="430" fill="#ffffff"/>

  <text x="450" y="26" text-anchor="middle" font-size="16" font-weight="600">
    One recorder tick: two sources, one sparse row, three resolutions
  </text>

  <!-- sources -->
  <rect x="20" y="60" width="200" height="72" rx="6" fill="#eef4ff" stroke="#4a6fa5"/>
  <text x="120" y="84" text-anchor="middle" font-weight="600">engine /metrics</text>
  <text x="120" y="103" text-anchor="middle">gauges, counters,</text>
  <text x="120" y="120" text-anchor="middle">spec-decode</text>

  <rect x="20" y="180" width="200" height="96" rx="6" fill="#eef4ff" stroke="#4a6fa5"/>
  <text x="120" y="204" text-anchor="middle" font-weight="600">node probe</text>
  <text x="120" y="223" text-anchor="middle">nvidia-smi, /proc, squeue</text>
  <text x="120" y="246" text-anchor="middle" fill="#8a5a00">jobs section is due</text>
  <text x="120" y="263" text-anchor="middle" fill="#8a5a00">only every 60 s</text>

  <!-- row -->
  <rect x="330" y="60" width="240" height="216" rx="6" fill="#f4fbf4" stroke="#3f7a3f"/>
  <text x="450" y="84" text-anchor="middle" font-weight="600">one receipt row (schema 2)</text>
  <text x="450" y="112" text-anchor="middle">schema_version, timestamp,</text>
  <text x="450" y="129" text-anchor="middle">hostname</text>
  <text x="450" y="152" text-anchor="middle">flat vLLM fields</text>
  <rect x="350" y="166" width="200" height="26" rx="4" fill="#dff0df" stroke="#3f7a3f"/>
  <text x="450" y="184" text-anchor="middle">engine</text>
  <rect x="350" y="196" width="200" height="26" rx="4" fill="#dff0df" stroke="#3f7a3f"/>
  <text x="450" y="214" text-anchor="middle">cards  ·  host</text>
  <rect x="350" y="226" width="200" height="26" rx="4" fill="#fdf3d8" stroke="#b8860b"
        stroke-dasharray="5 3"/>
  <text x="450" y="244" text-anchor="middle" fill="#8a5a00">jobs — absent when not read</text>

  <!-- tiers -->
  <rect x="670" y="60" width="210" height="56" rx="6" fill="#fbf3fb" stroke="#7a4a7a"/>
  <text x="775" y="84" text-anchor="middle" font-weight="600">raw · 5 s</text>
  <text x="775" y="103" text-anchor="middle">append-only JSONL</text>

  <rect x="670" y="140" width="210" height="56" rx="6" fill="#fbf3fb" stroke="#7a4a7a"/>
  <text x="775" y="164" text-anchor="middle" font-weight="600">minute · 1 min mean</text>
  <text x="775" y="183" text-anchor="middle">counters by endpoint</text>

  <rect x="670" y="220" width="210" height="56" rx="6" fill="#fbf3fb" stroke="#7a4a7a"/>
  <text x="775" y="244" text-anchor="middle" font-weight="600">hour · 1 h mean</text>
  <text x="775" y="263" text-anchor="middle">gauges by weighted mean</text>

  <!-- arrows -->
  <line x1="220" y1="96" x2="330" y2="130" stroke="#4a6fa5" stroke-width="1.6"
        marker-end="url(#a)"/>
  <line x1="220" y1="228" x2="330" y2="200" stroke="#4a6fa5" stroke-width="1.6"
        marker-end="url(#a)"/>
  <line x1="570" y1="120" x2="670" y2="88" stroke="#7a4a7a" stroke-width="1.6"
        marker-end="url(#p)"/>
  <line x1="775" y1="116" x2="775" y2="140" stroke="#7a4a7a" stroke-width="1.6"
        marker-end="url(#p)"/>
  <line x1="775" y1="196" x2="775" y2="220" stroke="#7a4a7a" stroke-width="1.6"
        marker-end="url(#p)"/>
  <text x="890" y="122" text-anchor="end" font-size="11" fill="#5a3a5a">between samples</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a6fa5"/>
    </marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M 0 0 L 2 5 L 0 10 z" fill="#7a4a7a"/>
    </marker>
  </defs>

  <text x="20" y="322" font-size="12" font-weight="600">A section nothing read is absent, not null:</text>
  <text x="20" y="342" font-size="12">the middle tick carries no <tspan font-family="monospace">jobs</tspan> key at all, so a</text>
  <text x="20" y="360" font-size="12">present key always means a measurement and an absent</text>
  <text x="20" y="378" font-size="12">one can never read as a measured zero.</text>
  <text x="20" y="406" font-size="12" font-weight="600">A failed compaction is reported and skipped:</text>
  <text x="20" y="424" font-size="12">the sample loop is the durable record, so one failed roll costs a retry, not the run.</text>
</svg>