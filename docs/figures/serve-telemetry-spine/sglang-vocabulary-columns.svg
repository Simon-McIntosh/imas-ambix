<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <style>
    .t { fill: #1a1a1a; }
    .m { fill: #555; }
    .box { stroke-width: 1.4; }
    .vllm { fill: #eef2f8; stroke: #2c4a7c; }
    .sgl  { fill: #f6f0ea; stroke: #8a5a2b; }
    .can  { fill: #eaf3ea; stroke: #2f6b34; }
    .none { fill: #ffffff; stroke: #999; stroke-dasharray: 4 3; }
    .lbl { font-size: 12.5px; }
    .ttl { font-size: 16px; font-weight: 600; }
    .sm { font-size: 11px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
    .head { font-size: 13px; font-weight: 600; }
  </style>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#333"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2f6b34"/>
    </marker>
    <marker id="ad" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#999"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="760" fill="#ffffff"/>
  <text x="24" y="34" class="t ttl">Two published vocabularies resolving onto one canonical column set</text>
  <text x="24" y="56" class="m sm">A flat column is filled for whichever family published the scrape. Where a family publishes nothing for a column, the column stays absent rather than zero.</text>

  <rect class="box vllm" x="24" y="74" width="300" height="40"/>
  <text x="38" y="99" class="t head">vLLM publishes</text>
  <rect class="box can" x="364" y="74" width="272" height="40"/>
  <text x="378" y="99" class="t head">canonical column</text>
  <rect class="box sgl" x="676" y="74" width="300" height="40"/>
  <text x="690" y="99" class="t head">SGLang publishes</text>

  <text x="24" y="146" class="m sm" font-weight="600">prefix cache</text>
  <line x1="24" y1="154" x2="976" y2="154" stroke="#ddd" stroke-width="1"/>

  <!-- 1 queries -->
  <rect class="box vllm" x="24" y="168" width="300" height="38"/>
  <text x="38" y="192" class="mono">prefix_cache_queries_total</text>
  <rect class="box can" x="364" y="168" width="272" height="38"/>
  <text x="378" y="192" class="mono">prefix_cache_queries</text>
  <rect class="box none" x="676" y="168" width="300" height="38"/>
  <text x="690" y="192" class="m sm">not published &#8212; no query counter</text>
  <line x1="328" y1="187" x2="360" y2="187" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 2 hits -->
  <rect class="box vllm" x="24" y="212" width="300" height="38"/>
  <text x="38" y="236" class="mono">prefix_cache_hits_total</text>
  <rect class="box can" x="364" y="212" width="272" height="38"/>
  <text x="378" y="236" class="mono">prefix_cache_hits</text>
  <rect class="box sgl" x="676" y="212" width="300" height="38"/>
  <text x="690" y="236" class="mono">cached_tokens_total</text>
  <line x1="328" y1="231" x2="360" y2="231" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="672" y1="231" x2="640" y2="231" stroke="#8a5a2b" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- 3 rate -->
  <rect class="box none" x="24" y="256" width="300" height="38"/>
  <text x="38" y="280" class="m sm">no rate series &#8212; derived one layer up</text>
  <rect class="box can" x="364" y="256" width="272" height="38"/>
  <text x="378" y="280" class="mono">prefix_cache_hit_rate</text>
  <rect class="box sgl" x="676" y="256" width="300" height="38"/>
  <text x="690" y="280" class="mono">cache_hit_rate</text>
  <line x1="328" y1="275" x2="360" y2="275" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ad)"/>
  <line x1="672" y1="275" x2="640" y2="275" stroke="#8a5a2b" stroke-width="1.5" marker-end="url(#ag)"/>

  <text x="24" y="334" class="m sm" font-weight="600">speculative decoding</text>
  <line x1="24" y1="342" x2="976" y2="342" stroke="#ddd" stroke-width="1"/>

  <!-- 4 draft -->
  <rect class="box vllm" x="24" y="356" width="300" height="38"/>
  <text x="38" y="380" class="mono">spec_decode_num_draft_tokens_total</text>
  <rect class="box can" x="364" y="356" width="272" height="38"/>
  <text x="378" y="380" class="mono">draft_tokens_total</text>
  <rect class="box none" x="676" y="356" width="300" height="38"/>
  <text x="690" y="380" class="m sm">no cumulative draft counter</text>
  <line x1="328" y1="375" x2="360" y2="375" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 5 accepted -->
  <rect class="box vllm" x="24" y="400" width="300" height="38"/>
  <text x="38" y="424" class="mono">spec_decode_num_accepted_tokens_total</text>
  <rect class="box can" x="364" y="400" width="272" height="38"/>
  <text x="378" y="424" class="mono">accepted_tokens_total</text>
  <rect class="box none" x="676" y="400" width="300" height="38"/>
  <text x="690" y="424" class="m sm">no accepted-token counter</text>
  <line x1="328" y1="419" x2="360" y2="419" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 6 accept rate -->
  <rect class="box none" x="24" y="444" width="300" height="38"/>
  <text x="38" y="468" class="m sm">no acceptance gauge</text>
  <rect class="box can" x="364" y="444" width="272" height="38"/>
  <text x="378" y="468" class="mono">accept_rate</text>
  <rect class="box sgl" x="676" y="444" width="300" height="38"/>
  <text x="690" y="468" class="mono">spec_accept_rate</text>
  <line x1="672" y1="463" x2="640" y2="463" stroke="#8a5a2b" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- 7 accept length -->
  <rect class="box none" x="24" y="488" width="300" height="38"/>
  <text x="38" y="512" class="m sm">no length gauge</text>
  <rect class="box can" x="364" y="488" width="272" height="38"/>
  <text x="378" y="512" class="mono">accept_length</text>
  <rect class="box sgl" x="676" y="488" width="300" height="38"/>
  <text x="690" y="512" class="mono">spec_accept_length</text>
  <line x1="672" y1="507" x2="640" y2="507" stroke="#8a5a2b" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- 8 active draft setting -->
  <rect class="box none" x="24" y="532" width="300" height="38"/>
  <text x="38" y="556" class="m sm">no such gauge</text>
  <rect class="box can" x="364" y="532" width="272" height="38"/>
  <text x="378" y="556" class="mono">active_draft_tokens</text>
  <rect class="box sgl" x="676" y="532" width="300" height="38"/>
  <text x="690" y="556" class="mono">spec_num_draft_tokens</text>
  <line x1="672" y1="551" x2="640" y2="551" stroke="#8a5a2b" stroke-width="1.5" marker-end="url(#ag)"/>

  <text x="24" y="606" class="m sm">solid = resolves from that family's scrape.  dashed = no series on that side, and nothing invented to fill the gap.</text>
  <text x="24" y="630" class="m sm">The two families differ in SHAPE, not only in spelling: SGLang states the cache hit rate and the acceptance rate directly, as gauges, where</text>
  <text x="24" y="650" class="m sm">vLLM publishes counters from which a rate is derived. So the rate columns are filled from different sources rather than renamed, and the</text>
  <text x="24" y="670" class="m sm">speculative names are NOT paired one to one: SGLang's `spec_num_draft_tokens` is the active draft-token setting, distinct from vLLM's</text>
  <text x="24" y="690" class="m sm">similarly named cumulative draft-token count, and the two are carried as separate columns.</text>
  <text x="24" y="716" class="m sm">Read against the live four-card lane (job 1273253, port 18810): 0.9976 hit rate, 5,775,464,448 cached tokens, accept_rate 0.6454,</text>
  <text x="24" y="736" class="m sm">accept_length 4.2270, active_draft_tokens 6.0 &#8212; with the query column absent, its denominator being a sum of prefill modes rather than a series.</text>
</svg>