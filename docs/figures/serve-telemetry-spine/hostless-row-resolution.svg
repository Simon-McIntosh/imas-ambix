<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560"
     font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13">
  <rect width="960" height="560" fill="#fbfbfd"/>
  <text x="24" y="30" font-size="16" font-weight="bold" fill="#1b1b1f">A hostless row: where its key's host comes from, and the source the repair removed</text>

  <!-- ================= REMOVED ================= -->
  <g>
    <rect x="24" y="46" width="912" height="150" rx="8" fill="#fdf1f1" stroke="#8a1c1c"/>
    <text x="38" y="70" font-size="14" font-weight="bold" fill="#8a1c1c">Removed — the reading machine's own identity</text>

    <!-- writer -->
    <rect x="44" y="84" width="200" height="52" rx="6" fill="#e8eef8" stroke="#3a5a9c"/>
    <text x="144" y="104" text-anchor="middle" fill="#1b1b1f">wrote it: <tspan font-family="monospace" font-size="11">98dci4-gpu-0003</tspan></text>
    <text x="144" y="122" text-anchor="middle" font-size="10" fill="#3a3a44">serve job 1271709</text>

    <!-- file -->
    <line x1="244" y1="110" x2="292" y2="110" stroke="#3a5a9c" stroke-width="1.5"/>
    <rect x="292" y="84" width="230" height="52" rx="6" fill="#fff" stroke="#6a6a72" stroke-dasharray="4 3"/>
    <text x="407" y="104" text-anchor="middle" font-family="monospace" font-size="11" fill="#1b1b1f">…-1271709.jsonl</text>
    <text x="407" y="122" text-anchor="middle" font-size="10" fill="#6a6a72">rows carry no host</text>

    <!-- reader -->
    <line x1="522" y1="110" x2="570" y2="110" stroke="#8a1c1c" stroke-width="1.5"/>
    <rect x="570" y="84" width="200" height="52" rx="6" fill="#f6e8ee" stroke="#9c3a5a"/>
    <text x="670" y="104" text-anchor="middle" fill="#1b1b1f">read it: <tspan font-family="monospace" font-size="11">98dci4-srv-1006</tspan></text>
    <text x="670" y="122" text-anchor="middle" font-size="10" fill="#9c3a5a">the login node</text>

    <text x="790" y="100" font-size="11" fill="#8a1c1c">no host was recorded,</text>
    <text x="790" y="116" font-size="11" fill="#8a1c1c">so the fallback adopted</text>
    <text x="790" y="132" font-size="11" fill="#8a1c1c">the reader.</text>

    <rect x="44" y="146" width="872" height="38" rx="5" fill="#fff" stroke="#8a1c1c" stroke-dasharray="4 3"/>
    <text x="58" y="170" font-family="monospace" font-size="11.5" fill="#8a1c1c">key = (98dci4-srv-1006, &lt;reader's boot&gt;, inode, offset)</text>
    <text x="470" y="170" font-size="11" fill="#8a1c1c">key_kind = "host+boot"  — indistinguishable from a recorded pair</text>
  </g>

  <!-- ================= NOW ================= -->
  <g>
    <rect x="24" y="208" width="912" height="304" rx="8" fill="#eef7f1" stroke="#12603a"/>
    <text x="38" y="232" font-size="14" font-weight="bold" fill="#12603a">Now — the host the key carries, in precedence order</text>

    <!-- rung 1 -->
    <rect x="44" y="246" width="300" height="48" rx="6" fill="#fff" stroke="#3a5a9c"/>
    <text x="58" y="266" font-size="12" fill="#1b1b1f">1 · the row names a host</text>
    <text x="58" y="284" font-family="monospace" font-size="10.5" fill="#3a3a44">row_host(row) → "host" | "hostname"</text>
    <line x1="344" y1="270" x2="392" y2="270" stroke="#12603a" stroke-width="1.5"/>
    <rect x="392" y="250" width="330" height="40" rx="5" fill="#eaf7ef" stroke="#12603a"/>
    <text x="406" y="275" font-family="monospace" font-size="11" fill="#12603a">key = (that host, boot)  kind "host+boot"</text>

    <!-- rung 2 -->
    <rect x="44" y="304" width="300" height="48" rx="6" fill="#fff" stroke="#3a5a9c"/>
    <text x="58" y="324" font-size="12" fill="#1b1b1f">2 · the caller passes host=</text>
    <text x="58" y="342" font-family="monospace" font-size="10.5" fill="#3a3a44">TelemetryIndex(host="98dci4-gpu-0003")</text>
    <line x1="344" y1="328" x2="392" y2="328" stroke="#12603a" stroke-width="1.5"/>
    <rect x="392" y="308" width="330" height="40" rx="5" fill="#eaf7ef" stroke="#12603a"/>
    <text x="406" y="333" font-family="monospace" font-size="11" fill="#12603a">key = (that host, boot)  kind "host+boot"</text>

    <!-- rung 3 -->
    <rect x="44" y="362" width="300" height="78" rx="6" fill="#fff" stroke="#3a5a9c"/>
    <text x="58" y="382" font-size="12" fill="#1b1b1f">3 · the file names a job id</text>
    <text x="58" y="399" font-family="monospace" font-size="10.5" fill="#3a3a44">receipts_host("…-1271709.jsonl")</text>
    <text x="58" y="415" font-family="monospace" font-size="10.5" fill="#3a3a44">→ sacct -j 1271709 -X -n -P -o NodeList</text>
    <text x="58" y="431" font-family="monospace" font-size="10.5" fill="#3a3a44">→ scontrol show hostnames  (1 line)</text>
    <line x1="344" y1="401" x2="392" y2="401" stroke="#12603a" stroke-width="1.5"/>
    <rect x="392" y="374" width="330" height="54" rx="5" fill="#eaf7ef" stroke="#12603a"/>
    <text x="406" y="396" font-family="monospace" font-size="11" fill="#12603a">→ "98dci4-gpu-0003"</text>
    <text x="406" y="415" font-size="10.5" fill="#12603a">key = (that host, boot)  kind "host+boot"</text>

    <!-- rung 4 -->
    <rect x="44" y="450" width="300" height="48" rx="6" fill="#fff" stroke="#8a1c1c"/>
    <text x="58" y="470" font-size="12" fill="#1b1b1f">4 · nothing resolves</text>
    <text x="58" y="488" font-size="10.5" fill="#8a1c1c">no host, or the job does not resolve</text>
    <line x1="344" y1="474" x2="392" y2="474" stroke="#8a1c1c" stroke-width="1.5"/>
    <rect x="392" y="454" width="330" height="40" rx="5" fill="#fdecec" stroke="#8a1c1c"/>
    <text x="406" y="472" font-family="monospace" font-size="11" fill="#8a1c1c">key = ("", …)  kind "unknown-host"</text>
    <text x="406" y="487" font-size="10" fill="#8a1c1c">or a raise — never a guess at a machine</text>

    <!-- right column note -->
    <rect x="736" y="250" width="180" height="228" rx="6" fill="#f4f4f7" stroke="#d5d5dd"/>
    <text x="826" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b1b1f">The guarantee</text>
    <text x="750" y="300" font-size="11" fill="#3a3a44">A key's host is a</text>
    <text x="750" y="316" font-size="11" fill="#3a3a44">recorded fact of the</text>
    <text x="750" y="332" font-size="11" fill="#3a3a44">row, or of the file's</text>
    <text x="750" y="348" font-size="11" fill="#3a3a44">own job id — never</text>
    <text x="750" y="364" font-size="11" fill="#3a3a44">the machine that</text>
    <text x="750" y="380" font-size="11" fill="#3a3a44">happened to read it.</text>
    <text x="750" y="410" font-size="11" fill="#3a3a44">A row with no host</text>
    <text x="750" y="426" font-size="11" fill="#3a3a44">says so in its key</text>
    <text x="750" y="442" font-size="11" fill="#3a3a44">and in its key_kind,</text>
    <text x="750" y="458" font-size="11" fill="#3a3a44">so it is never read</text>
    <text x="750" y="474" font-size="11" fill="#3a3a44">as a keyed row.</text>
  </g>

  <text x="24" y="524" font-size="11" fill="#6a6a72">The marker mirrors the refused-boot case (keyed under the host alone, <tspan font-family="monospace">key_kind = "host"</tspan>) rather than inventing a second mechanism:</text>
  <text x="24" y="540" font-size="11" fill="#6a6a72">a degraded key is still stored and carried, and a reader sees which identity the row actually got.</text>
</svg>