<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="system-ui, sans-serif">
  <title>The profile-route argv and the exact-agreement assertion</title>
  <desc>The emitted claude argv for a worker-profile launch is the profile segment, then the launcher's fixed --settings pair, then the dispatch arguments the launcher was handed. The test strips the fixed pair and the dispatch tail, then requires the remaining profile segment to equal the receipt's added_arguments element for element.</desc>

  <text x="30" y="36" font-size="18" font-weight="600">Profile-route argv: claude &lt;PROFILE_ARGS&gt; --settings &lt;SETTINGS&gt; &lt;ARGS&gt;</text>

  <!-- argv row -->
  <g font-size="13">
    <rect x="30" y="70" width="330" height="76" rx="10" fill="#e8f1fb" stroke="#2f6fb0" stroke-width="2"/>
    <text x="195" y="98" text-anchor="middle" font-weight="600" fill="#1d4f80">profile segment</text>
    <text x="195" y="118" text-anchor="middle" fill="#1d4f80">PROFILE_ARGS</text>
    <text x="195" y="136" text-anchor="middle" fill="#1d4f80" font-size="11">the launcher's expansion flags</text>

    <rect x="380" y="70" width="250" height="76" rx="10" fill="#eeeeee" stroke="#777" stroke-width="2"/>
    <text x="505" y="98" text-anchor="middle" font-weight="600" fill="#333">launcher's fixed pair</text>
    <text x="505" y="118" text-anchor="middle" fill="#333">--settings &lt;SETTINGS&gt;</text>

    <rect x="650" y="70" width="220" height="76" rx="10" fill="#eeeeee" stroke="#777" stroke-width="2"/>
    <text x="760" y="98" text-anchor="middle" font-weight="600" fill="#333">dispatch arguments</text>
    <text x="760" y="118" text-anchor="middle" fill="#333">ARGS</text>
  </g>

  <!-- receipts -->
  <g font-size="13">
    <rect x="30" y="230" width="330" height="70" rx="10" fill="#e9f7ee" stroke="#2f8f57" stroke-width="2"/>
    <text x="195" y="258" text-anchor="middle" font-weight="600" fill="#1f6640">receipt.added_arguments</text>
    <text x="195" y="280" text-anchor="middle" fill="#1f6640" font-size="11">the record's exact argument vector</text>
  </g>

  <!-- equality arrow -->
  <line x1="195" y1="228" x2="195" y2="150" stroke="#2f8f57" stroke-width="3"/>
  <polygon points="195,150 188,166 202,166" fill="#2f8f57"/>
  <polygon points="195,228 188,212 202,212" fill="#2f8f57"/>
  <text x="205" y="196" font-size="13" font-weight="600" fill="#1f6640">assert equal, element for element</text>
  <text x="205" y="214" font-size="11" fill="#1f6640">(equal length — a prefix check would pass on an extra appended flag)</text>

  <!-- bracket for the compared slice -->
  <path d="M360 165 L360 185 L30 185 L30 165" fill="none" stroke="#2f6fb0" stroke-width="2"/>
  <text x="40" y="205" font-size="12" fill="#2f6fb0">argv with the fixed pair and the dispatch tail removed</text>

  <text x="30" y="340" font-size="12" fill="#555">A flag appended to PROFILE_ARGS after the receipt read is emitted but unrecorded; the stripped segment is then one element longer, so the equality refuses it.</text>
</svg>