<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="300" viewBox="0 0 1080 300" role="img" aria-labelledby="title desc">
  <title id="title">Clive worker profile expansion flow</title>
  <desc id="desc">A worker profile is validated, its files and hooks are assembled, a route is selected, and a receipt is emitted before Claude Code starts.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#425466"/>
    </marker>
    <style>
      .box { fill: #f4f7fb; stroke: #425466; stroke-width: 2; rx: 12; }
      .route { fill: #e9f7ef; stroke: #287a4d; stroke-width: 2; rx: 12; }
      .text { fill: #152536; font: 16px sans-serif; text-anchor: middle; }
      .small { fill: #425466; font: 13px sans-serif; text-anchor: middle; }
      .line { stroke: #425466; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="box" x="25" y="95" width="190" height="90"/>
  <text class="text" x="120" y="130">worker profile</text>
  <text class="small" x="120" y="155">JSON + referenced files</text>
  <line class="line" x1="215" y1="140" x2="255" y2="140"/>
  <rect class="box" x="255" y="70" width="205" height="140"/>
  <text class="text" x="357" y="108">validate</text>
  <text class="small" x="357" y="135">shape, paths, tools</text>
  <text class="small" x="357" y="158">sha256 identities</text>
  <text class="small" x="357" y="181">hooks from settings</text>
  <line class="line" x1="460" y1="140" x2="500" y2="140"/>
  <rect class="box" x="500" y="70" width="220" height="140"/>
  <text class="text" x="610" y="108">assemble context</text>
  <text class="small" x="610" y="135">digest + AGENTS.md</text>
  <text class="small" x="610" y="158">MCP + tool flags</text>
  <text class="small" x="610" y="181">dispatch guidance</text>
  <line class="line" x1="720" y1="140" x2="760" y2="140"/>
  <rect class="route" x="760" y="35" width="135" height="75"/>
  <text class="text" x="827" y="66">bare route</text>
  <text class="small" x="827" y="90">API key</text>
  <rect class="route" x="760" y="170" width="135" height="75"/>
  <text class="text" x="827" y="201">settings route</text>
  <text class="small" x="827" y="225">hooks retained</text>
  <line class="line" x1="895" y1="72" x2="950" y2="125"/>
  <line class="line" x1="895" y1="207" x2="950" y2="155"/>
  <rect class="box" x="950" y="95" width="105" height="90"/>
  <text class="text" x="1002" y="130">receipt</text>
  <text class="small" x="1002" y="155">then exec</text>
</svg>
