# Publish the plans/ directory to GitHub Pages.
#
# GitHub Pages "Deploy from a branch" only supports / and /docs as the
# source folder.  We host the plan dashboard at /plans, so the Pages
# source must be set to "GitHub Actions" — this workflow uploads
# ./plans as the Pages artifact.
#
# To enable:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
# Once selected the workflow below will publish on every push to main
# that touches plans/ or this file.

name: Deploy plans to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "plans/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; in-flight runs are cancelled by
# the latest push.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload plans/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./plans

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
