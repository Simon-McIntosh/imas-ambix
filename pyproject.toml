[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "imas-ambix"
dynamic = ["version"]
description = "Fusion World Model — distilling experimental data into physics-informed generative models"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Simon McIntosh", email = "simon.mcintosh@iter.org" }]
license = { text = "LGPL-3.0-or-later" }
keywords = [
    "fusion",
    "world model",
    "transformer",
    "plasma physics",
    "IMAS",
    "ITER",
    "machine learning",
    "generative model",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # --- Core ML: transformer training on GPU ---
    "torch>=2.6",
    "lightning>=2.5",
    "transformers>=4.48",
    "datasets>=3.2",
    "safetensors>=0.5",
    # GPU-native by default: the engine is moving to accelerator-first (the
    # contour-free flux-surface averaging and the batched corpus labeller run
    # on-device), with CPU as the fallback rather than the target. A CUDA jaxlib
    # is therefore CORE on Linux (the SDCC / H200 platform); on any other OS the
    # plain jax wheel installs and the SAME code runs on CPU. The cuda12 extra is
    # linux-only (its nvidia-*-cu12 wheels), so it must stay platform-gated.
    "jax[cuda12]>=0.10; platform_system == 'Linux'",
    "jax>=0.10; platform_system != 'Linux'",
    # --- Experiment tracking & configuration ---
    "wandb>=0.19",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    # --- Data handling ---
    "numpy>=2.2",
    "pandas>=2.2",
    "xarray>=2025.1",
    "h5py>=3.12",
    "zarr>=3.0",
    "imas-python>=2.3.0",
    # --- Tokenization & embeddings ---
    "tiktoken>=0.9",
    "sentence-transformers>=3.4",
    # --- Utilities ---
    "rich>=13.9",
    "click>=8.1",
    "pydantic>=2.10",
    "tqdm>=4.67",
    "torax>=1.1.1",
    "nova-stella",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "pre-commit>=4.0",
    "mypy>=1.14",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]
viz = [
    "bokeh>=3.6",
    # Equilibrium / flux-surface plotting + firewalled-EFIT overlay maps
    # (imas_ink.figures.equilibrium_figure_mpl). Local sibling checkout —
    # see [tool.uv.sources] below.
    "imas-ink",
]
agent = [
    "openai>=1.60",
    "huggingface-hub>=0.27",
    # GPU inference stack — install on GPU node only (requires CUDA):
    #   uv pip install "sglang>=0.5.10.post1" kt-kernel --prerelease=allow
    #   pip install flashinfer -i https://flashinfer.ai/whl/cu124/torch2.6
]
data = [
    # FAIR-MAST acquisition stack — install on a sirius compute node.
    # The s5cmd Go binary is installed separately, not via pip:
    #   - Go binary releases at https://github.com/peak/s5cmd/releases
    #   - or via conda: `conda install -c conda-forge s5cmd`
    # The Python code looks for it on PATH via shutil.which("s5cmd").
    "fsspec[s3]>=2024.10",
]
train = [
    # World-model training stack — install on the betelgeuse GPU node:
    "accelerate>=1.0",
    "einops>=0.8",
    "chronos-forecasting>=1.3",
]

[project.urls]
Repository = "https://github.com/iterorganization/imas-ambix"
Documentation = "https://iterorganization.github.io/imas-ambix"
Issues = "https://github.com/iterorganization/imas-ambix/issues"

[project.scripts]
imas-ambix = "imas_ambix.cli:main"

[tool.uv.sources]
# imas-ink is developed as a sibling checkout (~/Code/imas-ink); editable so
# local changes are picked up without reinstall. Pulled in via the `viz` extra:
#   uv sync --extra viz
imas-ink = { path = "../imas-ink", editable = true }
nova-stella = { path = "../nova", editable = true }

[tool.hatch.version]
source = "vcs"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["imas_ambix"]

[tool.ambix.agent]
default_profile = "deepseek-v4-flash"
url = "http://98dci4-gpu-0003:18800"

[tool.ruff]
target-version = "py314"
line-length = 88
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N", "B", "A", "SIM", "TCH"]

[tool.ruff.lint.per-file-ignores]
# Tests use uppercase N/M/D for matrix dimensions and Path is fine in test files
"tests/**/*.py" = ["N806", "TC003"]
# The current-moment boundary read uses conventional linear-algebra naming
# (M = moment basis matrix) — uppercase matches the math, same rationale as above.
"imas_ambix/latent/boundary_moment.py" = ["N806", "N803"]
# The metric module uses conventional linear-algebra naming (X, Y, R, Xb, logZ,
# Phi) for the frozen-probe regression and the closed-form CRPS — uppercase
# matches the math, same rationale as the test ignore above.
"imas_ambix/camdyn/metrics.py" = ["N806", "N802"]
# The structure-fidelity probe uses conventional math names (L, G, W, T) and
# carries long diagnostic caption/verdict strings; same rationale as metrics.py.
"imas_ambix/camdyn/structure_fidelity.py" = ["N806", "E501"]
# The batched-labeller spike uses conventional linear-algebra naming (G = the
# Green's matrix, I = the current matrix) — uppercase matches the math.
"scripts/gpu_labeler_foundation_spike.py" = ["N803", "N806", "E741"]
# The single-shot device rollout shares the same convention (G, T, W).
"scripts/device_rollout_single_shot.py" = ["N803", "N806"]
# Cosmos workers use T/B/H/W for tensor dimensions and PyTorch's F alias.
"imas_ambix/bench/cosmos_worker.py" = ["N806", "N812"]
# Stream workers use T/B/H/W for tensor dimensions and PyTorch's F alias.
"imas_ambix/bench/stream_worker.py" = ["N806", "N812"]
# Tokenizer benchmark constants preserve the uppercase configuration convention.
"imas_ambix/bench/tokenizer.py" = ["N806"]
# Stream encoding uses PyTorch's conventional functional-as-F alias.
"imas_ambix/data/stream_encode.py" = ["N812"]
# Activity metrics use T for the temporal tensor dimension.
"imas_ambix/eval/metrics.py" = ["N806"]
# Filament helpers preserve A for vector potential and B for magnetic field.
"imas_ambix/gs/filaments3d.py" = ["N802"]
# Baseline fitting uses X/Xs for design matrices and uppercase math dimensions.
"imas_ambix/statespace/baseline.py" = ["N802", "N803", "N806"]
# State filtering uses T/D/L for temporal, state and latent dimensions.
"imas_ambix/statespace/filter.py" = ["N806"]
# Integrated inputs use X for the design matrix and T for its time dimension.
"imas_ambix/statespace/integrated_inputs.py" = ["N806"]
# Decoder training preserves tensor dimensions, PyTorch F, and the standard DDP alias.
"imas_ambix/tokenizer/finetune_decoder.py" = ["N806", "N812", "N817"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.14"
strict = true
