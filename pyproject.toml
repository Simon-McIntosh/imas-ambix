[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "imas-ambix"
dynamic = ["version"]
description = "Fusion World Model — distilling experimental data into physics-informed generative models"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Simon McIntosh", email = "simon.mcintosh@iter.org" }]
license = { text = "LGPL-3.0-or-later" }
keywords = [
    "fusion",
    "world model",
    "transformer",
    "plasma physics",
    "IMAS",
    "ITER",
    "machine learning",
    "generative model",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # --- Core ML: transformer training on GPU ---
    "torch>=2.6",
    "lightning>=2.5",
    "transformers>=4.48",
    "datasets>=3.2",
    "safetensors>=0.5",
    # accelerator-native, contour-free flux-surface averaging (the GPU labeller
    # inner loop); a CUDA jaxlib turns the same code into a device kernel
    "jax>=0.10",
    # --- Experiment tracking & configuration ---
    "wandb>=0.19",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    # --- Data handling ---
    "numpy>=2.2",
    "pandas>=2.2",
    "xarray>=2025.1",
    "h5py>=3.12",
    "zarr>=3.0",
    # --- Tokenization & embeddings ---
    "tiktoken>=0.9",
    "sentence-transformers>=3.4",
    # --- Utilities ---
    "rich>=13.9",
    "click>=8.1",
    "pydantic>=2.10",
    "tqdm>=4.67",
    "torax>=1.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "pre-commit>=4.0",
    "mypy>=1.14",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]
viz = [
    # Equilibrium / flux-surface plotting + firewalled-EFIT overlay maps
    # (imas_ink.figures.equilibrium_figure_mpl). Local sibling checkout —
    # see [tool.uv.sources] below.
    "imas-ink",
]
agent = [
    "openai>=1.60",
    "huggingface-hub>=0.27",
    # GPU inference stack — install on GPU node only (requires CUDA):
    #   uv pip install "sglang>=0.5.10.post1" kt-kernel --prerelease=allow
    #   pip install flashinfer -i https://flashinfer.ai/whl/cu124/torch2.6
]
data = [
    # FAIR-MAST acquisition stack — install on a sirius compute node.
    # The s5cmd Go binary is installed separately, not via pip:
    #   - Go binary releases at https://github.com/peak/s5cmd/releases
    #   - or via conda: `conda install -c conda-forge s5cmd`
    # The Python code looks for it on PATH via shutil.which("s5cmd").
    "fsspec[s3]>=2024.10",
]
train = [
    # World-model training stack — install on the betelgeuse GPU node:
    "accelerate>=1.0",
    "einops>=0.8",
    "chronos-forecasting>=1.3",
]

[project.urls]
Repository = "https://github.com/iterorganization/imas-ambix"
Documentation = "https://iterorganization.github.io/imas-ambix"
Issues = "https://github.com/iterorganization/imas-ambix/issues"

[project.scripts]
imas-ambix = "imas_ambix.cli:main"

[tool.uv.sources]
# imas-ink is developed as a sibling checkout (~/Code/imas-ink); editable so
# local changes are picked up without reinstall. Pulled in via the `viz` extra:
#   uv sync --extra viz
imas-ink = { path = "../imas-ink", editable = true }

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["imas_ambix"]

[tool.hatch.build.targets.wheel.force-include]
"imas_ambix/agent/profiles" = "imas_ambix/agent/profiles"
"imas_ambix/agent/envs" = "imas_ambix/agent/envs"

[tool.ambix.agent]
default_profile = "deepseek-v4-flash"
url = "http://98dci4-gpu-0003:18800"

[tool.ruff]
target-version = "py312"
line-length = 88
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N", "B", "A", "SIM", "TCH"]

[tool.ruff.lint.per-file-ignores]
# Tests use uppercase N/M/D for matrix dimensions and Path is fine in test files
"tests/**/*.py" = ["N806", "TC003"]
# The current-moment boundary read uses conventional linear-algebra naming
# (M = moment basis matrix) — uppercase matches the math, same rationale as above.
"imas_ambix/latent/boundary_moment.py" = ["N806", "N803"]
# The metric module uses conventional linear-algebra naming (X, Y, R, Xb, logZ,
# Phi) for the frozen-probe regression and the closed-form CRPS — uppercase
# matches the math, same rationale as the test ignore above.
"imas_ambix/camdyn/metrics.py" = ["N806", "N802"]
# The structure-fidelity probe uses conventional math names (L, G, W, T) and
# carries long diagnostic caption/verdict strings; same rationale as metrics.py.
"imas_ambix/camdyn/structure_fidelity.py" = ["N806", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
